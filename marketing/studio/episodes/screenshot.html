<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, textTexture, makeLockie, makeArtist, makeGhost, makeBlob, makeCoin, makeSign, makeMagnifier, makeHourglass, makeConfetti, makePoof, blinkAt, BLOB_COLORS } from "/kit.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
const S = setup({ camPos: [0, 2.6, 13], look: [0, 1.95, 0] });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const A = makeArtist(); A.root.position.set(-1.4, 0, 0.2); S.scene.add(A.root);
const L = makeLockie(); L.root.position.set(-0.15, 0, 0.5); S.scene.add(L.root);
const G = makeGhost(); S.scene.add(G.root);
const client = makeBlob(BLOB_COLORS[1], 0.85); S.scene.add(client.root);
const coin = makeCoin(); coin.scale.setScalar(0.8); S.scene.add(coin);
const glass = makeMagnifier(); glass.scale.setScalar(0.9); S.scene.add(glass);
const hourglass = makeHourglass(); S.scene.add(hourglass);
const poof = makePoof(14, 6); S.scene.add(poof);
const confetti = makeConfetti(90, 9); S.scene.add(confetti);

// The "screenshot" the ghost waves around.
const shot = makeSign(["VENMO", "$50 SENT", "trust me bro"], { w: 1.5, h: 1.05, bg: "#eaf5ff", color: "#1a6fd6" }); S.scene.add(shot);
// The slot on the wall: held, then open again, then booked for real.
const slot = [["SAT 2 PM", "HELD: GHOST"], ["SAT 2 PM", "OPEN AGAIN"], ["SAT 2 PM", "BOOKED"]].map((lines, i) => {
  const s = makeSign(lines, { w: 1.9, h: 0.95, bg: i === 2 ? "#ff5c39" : "#ffffff", color: i === 2 ? "#ffffff" : "#1a0905" });
  s.children[0].visible = false; s.position.set(0.9, 2.75, -1.6); s.scale.setScalar(0.85); S.scene.add(s); return s;
});
// The artist's own phone: what actually came in.
const phone = new THREE.Group(); S.scene.add(phone);
phone.add(mesh(new RoundedBoxGeometry(0.46, 0.8, 0.06, 3, 0.06), toon(0x1b1816), 0.015));
const screen = (lines, bg, color) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.7), new THREE.MeshBasicMaterial({ map: textTexture("", { w: 200, h: 350, font: "900 64px 'Bricolage Grotesque'", color, bg, radius: 20, lines }) })); m.position.z = 0.032; phone.add(m); return m; };
const noMoney = screen(["Venmo", "$0.00"], "#ffffff", "#1a0905");
const money = screen(["Venmo", "+$50"], "#e6fff1", "#128a52");

const bub = bubbles([
  { t0: 1.0, t1: 2.4, text: "sent it!! 😇", anchor: () => G.root.position.clone().add(V(0.3, 1.9, 0)), align: 0.7, tail: "70%" },
  { t0: 2.5, t1: 3.5, text: "yay!! 🥹", anchor: () => V(-1.4, 2.5, 0.2), align: 0.3, tail: "30%" },
  { t0: 4.4, t1: 5.5, text: "hmm…", cls: "dark", anchor: () => V(-0.15, 2.1, 0.5), align: 0.5 },
  { t0: 6.7, t1: 8.3, text: "…nothing came in?", anchor: () => V(-1.4, 2.55, 0.2), align: 0.25, tail: "25%" },
  { t0: 9.2, t1: 10.8, text: "wifi is slow 😅", anchor: () => G.root.position.clone().add(V(0.3, 1.9, 0)), align: 0.75, tail: "75%" },
  { t0: 11.55, t1: 12.4, sfx: true, text: "POOF!", anchor: () => V(1.2, 1.6, 0.4), rot: 8 },
  { t0: 13.3, t1: 14.4, text: "deposit sent 💸", cls: "accent", anchor: () => client.root.position.clone().add(V(0, 1.15, 0)), align: 0.75, tail: "75%" },
  { t0: 14.6, t1: 15.4, sfx: true, text: "CLICK!", anchor: () => V(-0.15, 1.5, 1.2), rot: -6 },
  { t0: 15.0, t1: 16.4, text: "confirmed ✅", anchor: () => V(-1.4, 2.55, 0.2), align: 0.25, tail: "25%" },
]);

window.DUR = 21.6;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.4, html: "POV: a client sends a <em>“payment screenshot”</em>" },
    { t0: 2.4, t1: 5.6, html: "Looks legit… right? 🤔" },
    { t0: 5.6, t1: 8.6, html: "Screenshots lie. <em>Your Venmo doesn't.</em>" },
    { t0: 8.6, t1: 12.8, html: "No deposit? The hold <em>expires by itself.</em>" },
    { t0: 12.8, t1: 16.4, html: "Real money lands? <em>You tap confirm.</em>" },
    { t0: 16.4, t1: 18.6, html: "Nice try, <em>ghost.</em> 👻" },
  ]);
  S.aim(V(Math.sin(t * 0.3) * 0.2, 2.6, 13 - E.inOut(prog(t, 3.6, 4.3)) * 1.2 * (1 - E.inOut(prog(t, 5.4, 6.0)))), V(0, 1.95, 0));

  // Ghost floats in waving the screenshot, sweats, then poofs when the hold runs out.
  const gin = E.out(prog(t, 0.1, 1.0)), gone = prog(t, 11.5, 11.8);
  G.root.visible = t < 11.8;
  G.root.position.set(lerp(3.2, 1.3, gin), 0, 0.3);
  G.pose({ opacity: 1 - gone, float: Math.abs(Math.sin(t * 5)) * 0.08, tilt: Math.sin(t * 5) * 0.06, waveL: 0.35 + Math.sin(t * 7) * 0.05,
    mouth: t > 6.4 ? "o" : "smile", sweat: t > 6.4, blink: blinkAt(t, 0.2), lookX: t > 8.8 ? -0.8 : -0.5 }, t);
  shot.visible = t < 11.7;
  shot.position.set(G.root.position.x - 0.1, 0.5 + Math.sin(t * 5) * 0.04, 1.0); shot.scale.setScalar(0.7 * (1 - gone)); shot.rotation.z = 0.12 + Math.sin(t * 7) * 0.05;
  poof.position.set(1.3, 1.0, 0.6); poof.userData.at(prog(t, 11.5, 12.3));

  // The artist: thrilled, checks their own phone, confirms the real one.
  const checking = (t > 6.0 && t < 8.6) || (t > 14.3 && t < 16.4);
  const cheer = E.back(prog(t, 2.5, 2.8)) * (1 - prog(t, 3.3, 3.6)) + E.back(prog(t, 16.4, 16.7)) * (1 - prog(t, 18.3, 18.6));
  const catchK = E.back(prog(t, 14.2, 14.45)) * (1 - prog(t, 14.8, 15.1));
  A.pose({ blink: blinkAt(t, 0.9), mouth: t > 6.5 && t < 11.6 ? "flat" : "smile", lookX: checking ? 0.3 : 0.6, lookY: checking ? -0.5 : 0,
    headNod: checking ? 0.2 : 0, armL: checking ? 0.3 : 0.15 + cheer * 2.4, armLx: checking ? -1.2 : 0, armR: 0.15 + cheer * 2.4 + catchK * 1.4 });
  const ph = Math.max(E.out(prog(t, 6.0, 6.3)) * (1 - prog(t, 8.3, 8.6)), E.out(prog(t, 14.3, 14.6)) * (1 - prog(t, 16.1, 16.4)));
  phone.visible = ph > 0.01;
  phone.position.set(-0.8, 1.05, 1.0); phone.scale.setScalar(1.4 * ph); phone.rotation.set(-0.1, 0.2, 0);
  noMoney.visible = t < 12; money.visible = t >= 12;

  // Lockie: magnifier on the screenshot, points at the artist's phone, locks the real booking.
  const inspect = E.inOut(prog(t, 3.4, 4.1)) * (1 - E.inOut(prog(t, 5.5, 6.0)));
  const point = E.back(prog(t, 5.9, 6.2)) * (1 - prog(t, 7.6, 8.0));
  const click = t > 14.6 ? Math.exp(-(t - 14.6) * 7) : 0;
  const dance = prog(t, 16.4, 16.6) * (1 - prog(t, 18.4, 18.6));
  L.root.position.y = dance * Math.abs(Math.sin(t * 9)) * 0.22;
  L.pose({ squash: click * 0.5 + Math.sin(t * 6) * 0.03, open: 1 - E.out(prog(t, 14.6, 14.75)), tilt: dance * Math.sin(t * 9) * 0.15 + inspect * -0.08,
    armR: 0.25 + inspect * 1.3 + dance * 2, armL: 0.25 + point * 1.5 + dance * 2, blink: t > 4.3 && t < 5.5 ? 0.45 : blinkAt(t, 1.4),
    lookX: inspect > 0.3 ? 0.9 : point > 0.3 ? -0.9 : 0.2, mouth: t > 4.3 && t < 5.5 ? "flat" : click > 0.3 ? "o" : "smile" });
  glass.visible = inspect > 0.01;
  glass.position.set(lerp(0.6, 1.05, inspect), 0.3 + Math.sin(t * 4) * 0.03, 1.3); glass.rotation.z = lerp(0.4, 0.1, inspect); glass.scale.setScalar(0.9 * inspect);

  // The hold's timer: an hourglass that runs out.
  const hg = E.back(prog(t, 8.7, 9.0)) * (1 - E.inOut(prog(t, 12.4, 12.8)));
  hourglass.visible = hg > 0.01;
  hourglass.position.set(-0.3, 2.55, -1.6); hourglass.scale.setScalar(0.62 * hg); hourglass.rotation.z = Math.sin(t * 2) * 0.03;
  hourglass.userData.at(E.inOut(prog(t, 9.0, 11.4)));
  slot[0].visible = t < 11.7;
  slot[1].visible = t >= 11.7 && t < 14.6; slot[1].scale.setScalar(0.85 * E.back(prog(t, 11.7, 12.0)));
  slot[2].visible = t >= 14.6; slot[2].scale.setScalar(0.85 * E.back(prog(t, 14.6, 14.9)));

  // A real client hops in and sends the deposit to the artist.
  const cin = E.out(prog(t, 12.9, 13.3)), cout = E.inOut(prog(t, 15.2, 15.8));
  client.root.visible = t > 12.9 && cout < 1;
  client.root.position.set(lerp(3.2, 1.2, cin) + cout * 2.2, Math.abs(Math.sin(t * 11)) * 0.15 * (cin < 1 || cout > 0 ? 1 : 0), 0.7);
  client.pose({ blink: blinkAt(t, 2.2), lookX: -0.7, armL: t > 13.6 && t < 14.1 ? 1.5 : 0.3 });
  const ck = prog(t, 13.8, 14.4);
  coin.visible = ck > 0 && ck < 1;
  coin.position.set(lerp(1.0, -0.95, ck), lerp(1.0, 1.9, ck) + Math.sin(ck * Math.PI) * 1.2, lerp(0.7, 0.4, ck)); coin.rotation.y = ck * 18;

  confetti.position.set(0, 2.3, 0.3); confetti.userData.at(t - 16.4);
  showBubbles(t, bub, S.toScreen);
  outro(t, 18.6, { h: "Nice try,<br>ghost.", p: "Booking + deposits for tattoo artists.<br>Free for founding artists." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
