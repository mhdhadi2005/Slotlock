<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeArtist, makeGhost, makeBlob, makeCoin, makeSign, makeHourglass, makeMedal, makeLabel, makeConfetti, makePoof, blinkAt, BLOB_COLORS } from "/kit.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
const S = setup({ camPos: [0, 2.6, 13], look: [0, 1.95, 0] });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const A = makeArtist(); A.root.position.set(-1.1, 0, 0.2); S.scene.add(A.root);
const L = makeLockie(); L.root.position.set(0.05, 0, 0.6); S.scene.add(L.root);
const tag = makeLabel(["HELLO", "I'M LOCKIE"], { w: 0.42, h: 0.26, bg: "#ffffff", color: "#1a0905" }); tag.position.set(0.36, 0.52, 0.43); tag.rotation.z = -0.12; L.body.add(tag);
const medal = makeMedal("#1"); S.scene.add(medal);
const G = makeGhost(); G.root.scale.setScalar(0.8); S.scene.add(G.root);
const client = makeBlob(BLOB_COLORS[3], 0.85); S.scene.add(client.root);
const coin = makeCoin(); coin.scale.setScalar(0.8); S.scene.add(coin);
const hourglass = makeHourglass(); S.scene.add(hourglass);
const poof = makePoof(12, 13); S.scene.add(poof);
const confetti = makeConfetti(100, 41); S.scene.add(confetti);
const rules = [["RULE 1", "DEPOSIT FIRST"], ["RULE 2", "HOLDS EXPIRE"], ["RULE 3", "MONEY TO ARTIST"]].map((lines) => {
  const s = makeSign(lines, { w: 2.0, h: 0.95, bg: "#fff3d6" }); s.children[0].visible = false; s.position.set(-0.3, 2.5, -1.6); s.scale.setScalar(0.85); S.scene.add(s); return s;
});
const RULE_AT = [2.3, 5.6, 9.0];
const slots = [["SAT 3 PM", "HELD"], ["SAT 3 PM", "OPEN"]].map((lines, i) => {
  const s = makeSign(lines, { w: 1.3, h: 0.8, bg: i ? "#ffffff" : "#ffe1d6" }); s.children[0].visible = false; s.position.set(1.15, 1.35, 0.4); s.scale.setScalar(0.85); S.scene.add(s); return s;
});

const bub = bubbles([
  { t0: 0.6, t1: 2.2, text: "welcome! 3 rules 👇", anchor: () => V(-1.1, 2.55, 0.2), align: 0.25, tail: "25%" },
  { t0: 2.7, t1: 3.9, text: "i'll pay later 😇", anchor: () => G.root.position.clone().add(V(0, 1.6, 0)), align: 0.75, tail: "75%" },
  { t0: 4.3, t1: 5.1, sfx: true, text: "BOING!", anchor: () => V(1.0, 1.8, 0.6), rot: 8 },
  { t0: 8.3, t1: 9.0, sfx: true, text: "POOF!", anchor: () => V(1.15, 2.2, 0.4), rot: -6 },
  { t0: 10.25, t1: 10.9, sfx: true, text: "BONK!", anchor: () => V(0.05, 2.35, 0.6), rot: 10 },
  { t0: 10.6, t1: 11.9, text: "not mine!! 😳", cls: "dark", anchor: () => V(0.05, 2.1, 0.6), align: 0.5 },
  { t0: 11.9, t1: 13.2, text: "…he's a keeper 🥹", anchor: () => V(-1.1, 2.55, 0.2), align: 0.25, tail: "25%" },
]);

window.DUR = 19.8;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.3, html: "Lockie's <em>first day</em> on the job" },
    { t0: 2.3, t1: 5.6, html: "Rule 1: <em>deposit first.</em>" },
    { t0: 5.6, t1: 9.0, html: "Rule 2: unpaid holds <em>expire.</em>" },
    { t0: 9.0, t1: 13.4, html: "Rule 3: the money goes <em>to the artist.</em>" },
    { t0: 13.4, t1: 16.6, html: "Employee of the month. <em>Every month.</em>" },
  ]);
  S.aim(V(Math.sin(t * 0.3) * 0.2, 2.6, 13), V(0, 1.95, 0));
  let ri = -1; RULE_AT.forEach((a, i) => { if (t >= a) ri = i; });
  rules.forEach((s, i) => { s.visible = i === ri && t < 13.4; s.scale.setScalar(0.85 * (i === ri ? E.back(prog(t, RULE_AT[i], RULE_AT[i] + 0.3)) : 1)); });

  // Rule 1: the ghost tries "I'll pay later" and gets bounced.
  const gin = E.out(prog(t, 2.4, 3.0)), gb = prog(t, 4.3, 5.2);
  G.root.visible = t > 2.4 && gb < 1;
  G.root.position.set(lerp(3.0, 1.2, gin) + gb * 3, gb > 0 ? Math.sin(gb * Math.PI) * 1.8 + gb : 0, 0.5); G.root.rotation.z = -gb * 8;
  G.pose({ float: Math.abs(Math.sin(t * 5)) * 0.08, mouth: gb > 0 ? "o" : "smile", blink: blinkAt(t, 0.4), lookX: -0.7 }, t);

  // Rule 2: a held slot with an hourglass; when it runs out, the slot opens.
  const r2 = t > 5.6 && t < 9.0;
  const hg = E.back(prog(t, 5.8, 6.1)) * (1 - E.inOut(prog(t, 8.3, 8.6)));
  hourglass.visible = hg > 0.01; hourglass.position.set(1.15, 2.05, 0.4); hourglass.scale.setScalar(0.5 * hg); hourglass.userData.at(E.inOut(prog(t, 6.1, 8.2)));
  slots[0].visible = t > 5.8 && t < 8.35; slots[0].scale.setScalar(0.85 * E.back(prog(t, 5.8, 6.1)));
  slots[1].visible = t >= 8.35 && t < 9.1; slots[1].scale.setScalar(0.85 * (1 - E.inOut(prog(t, 8.85, 9.1))));
  poof.position.set(1.15, 1.7, 0.5); poof.userData.at(prog(t, 8.3, 9.0));

  // Rule 3: the client's coin bonks Lockie, who hands it straight to the artist.
  const cin = E.out(prog(t, 9.1, 9.5)), cout = E.inOut(prog(t, 12.0, 12.5));
  client.root.visible = t > 9.1 && cout < 1;
  client.root.position.set(lerp(3.2, 1.25, cin) + cout * 2.2, cin < 1 || cout > 0 ? Math.abs(Math.sin(t * 11)) * 0.14 : 0, 0.7);
  client.pose({ blink: blinkAt(t, 1.1), lookX: -0.7, armL: t > 9.7 && t < 10.1 ? 1.5 : 0.3 });
  let cp = null;
  const k1 = prog(t, 9.8, 10.25), k2 = prog(t, 11.3, 11.8);
  if (k1 > 0 && k1 < 1) cp = [lerp(1.1, 0.05, k1), lerp(1.0, 2.25, k1) + Math.sin(k1 * Math.PI) * 1.0, 0.7];
  else if (t >= 10.25 && t < 11.3) cp = [0.05 + Math.sin(t * 20) * 0.02, 2.25 + Math.abs(Math.sin((t - 10.25) * 9)) * 0.2 * Math.exp(-(t - 10.25) * 3), 0.7];
  else if (k2 > 0 && k2 < 1) cp = [lerp(0.05, -0.85, k2), lerp(2.25, 1.8, k2) + Math.sin(k2 * Math.PI) * 0.9, lerp(0.7, 0.5, k2)];
  coin.visible = !!cp; if (cp) { coin.position.set(...cp); coin.rotation.y = t * 12; }

  // Lockie: nervous, then confident, then flustered by the coin, then decorated.
  const nervous = t < 2.3;
  const stop = E.back(prog(t, 3.9, 4.2)) * (1 - prog(t, 5.0, 5.3));
  const bonk = t > 10.25 && t < 11.3;
  const toss = E.back(prog(t, 11.1, 11.35)) * (1 - prog(t, 11.7, 12.0));
  const dance = prog(t, 13.6, 13.8) * (1 - prog(t, 16.4, 16.6));
  L.root.position.y = dance * Math.abs(Math.sin(t * 9)) * 0.22;
  L.pose({ squash: (bonk ? Math.exp(-(t - 10.25) * 6) * 0.6 : 0) + (nervous ? Math.sin(t * 30) * 0.03 : 0), tilt: nervous ? Math.sin(t * 25) * 0.04 : dance * Math.sin(t * 9) * 0.15,
    open: t > 3.8 && t < 5.3 ? 0 : 0.6, armR: 0.25 + stop * 1.6 + toss * 1.2 + dance * 2, armL: 0.25 + (bonk ? 1.6 + Math.sin(t * 20) * 0.3 : 0) + dance * 2,
    blink: blinkAt(t, 1.2), lookX: t > 2.4 && t < 5.2 ? 0.8 : bonk ? 0 : t > 11 && t < 12 ? -0.8 : 0.2, lookY: bonk ? 0.8 : 0,
    mouth: nervous ? "flat" : bonk ? "o" : "smile" });
  const md = E.out(prog(t, 13.5, 13.9));
  medal.visible = t > 13.5;
  medal.position.set(0.05, lerp(4.5, 0.42, md) + dance * Math.abs(Math.sin(t * 9)) * 0.22, 1.04); medal.rotation.z = Math.sin(t * 3) * 0.1;

  // The artist trains, catches the deposit, and claps.
  const catchK = E.back(prog(t, 11.55, 11.8)) * (1 - prog(t, 12.2, 12.5));
  const clap = t > 13.6 && t < 16.4 ? Math.abs(Math.sin(t * 10)) : 0;
  A.pose({ blink: blinkAt(t, 0.6), mouth: "smile", lookX: 0.6, armL: 0.15 + (t < 2.2 ? E.back(prog(t, 0.4, 0.7)) * 2.2 : 0) + clap * 1.1, armR: 0.15 + catchK * 1.4 + clap * 1.1,
    armLx: clap ? -0.7 : 0, armRx: clap ? -0.7 : 0 });

  confetti.position.set(0, 2.4, 0.4); confetti.userData.at(t - 13.6);
  showBubbles(t, bub, S.toScreen);
  outro(t, 16.6, { h: "Hired.<br>Forever.", p: "Booking + deposits for tattoo artists.<br>Free for founding artists." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
