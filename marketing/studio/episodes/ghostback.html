<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeArtist, makeGhost, makeBlob, makeCoin, makeJar, makePhone, makeSign, makeLabel, makeConfetti, makePoof, blinkAt, BLOB_COLORS } from "/kit.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
const S = setup({ camPos: [0, 2.6, 13], look: [0, 1.95, 0] });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const A = makeArtist(); A.root.position.set(-1.15, 0, 0.1); S.scene.add(A.root);
const G = makeGhost(); G.root.scale.setScalar(0.85); S.scene.add(G.root);
const real = makeBlob(BLOB_COLORS[2], 0.95); S.scene.add(real.root);
const tag = makeLabel(["NO-SHOW · MARCH"], { w: 1.3, h: 0.3, bg: "#3a1414", color: "#ff8a80" }); S.scene.add(tag);
const L = makeLockie(); L.root.scale.setScalar(0.8); S.scene.add(L.root);
const jar = makeJar("DEPOSITS"); jar.position.set(-0.55, 0, 1.3); jar.scale.setScalar(0.7); jar.userData.fill(2); S.scene.add(jar);
const sign = makeSign(["DEPOSIT", "FIRST."], { w: 1.5, h: 0.9 }); S.scene.add(sign);
const phone = makePhone([{ lines: ["SAT", "2 PM"] }, { lines: ["$50", "DEPOSIT"] }, { lines: ["PAID", "✓"], bg: "#e6fff1", color: "#128a52" }]); S.scene.add(phone);
const coin = makeCoin(); coin.scale.setScalar(0.7); S.scene.add(coin);
const lPoof = makePoof(14, 31), gPoof = makePoof(16, 33); S.scene.add(lPoof, gPoof);
const confetti = makeConfetti(90, 83); S.scene.add(confetti);
const GX = 1.05;

const bub = bubbles([
  { t0: 1.0, t1: 2.8, text: "hey stranger 👋 u free sat?", anchor: () => V(GX, 1.75, 0.6), align: 0.75, tail: "75%" },
  { t0: 3.0, t1: 4.5, text: "you ghosted me in march 😐", cls: "dark", anchor: () => V(-1.15, 2.55, 0.1), align: 0.25, tail: "25%" },
  { t0: 4.1, t1: 5.4, text: "i was busy 🥺", anchor: () => V(GX, 1.75, 0.6), align: 0.75, tail: "75%" },
  { t0: 5.5, t1: 6.2, sfx: true, text: "POOF!", anchor: () => V(0.1, 1.9, 1.0), rot: 8 },
  { t0: 7.4, t1: 8.5, text: "…a deposit? 😰", anchor: () => V(GX, 1.75, 0.6), align: 0.75, tail: "75%" },
  { t0: 10.7, t1: 11.4, sfx: true, text: "POOF!", anchor: () => V(GX, 1.6, 0.8), rot: -8 },
  { t0: 11.4, t1: 12.2, sfx: true, text: "CLICK!", anchor: () => V(0.1, 1.9, 1.0), rot: 6 },
  { t0: 12.6, t1: 14.3, text: "see u saturday 😇", anchor: () => V(GX, 1.35, 0.6), align: 0.75, tail: "75%" },
]);

window.DUR = 18.8;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.8, html: "Last year's no-show <em>is back.</em> 👻" },
    { t0: 2.8, t1: 5.4, html: "No apology. <em>Just vibes.</em>" },
    { t0: 5.6, t1: 8.6, html: "Sure, babe. <em>Deposit first.</em>" },
    { t0: 8.6, t1: 12.4, html: "Once they pay, they get <em>very real.</em>" },
    { t0: 12.4, t1: 15.6, html: "Paid. Booked. <em>Actually showing up.</em>" },
  ]);
  S.aim(V(0, 2.6, 13), V(0, 1.95, 0));

  // The ghost drifts in, sweats at the word "deposit", pays, and turns solid.
  const gin = E.out(prog(t, 0.1, 0.9));
  const turn = prog(t, 10.6, 10.9);
  G.root.visible = turn < 1;
  G.root.position.set(lerp(2.8, GX, gin), 0, 0.6);
  const worried = t > 6.0 && t < 10.6;
  G.pose({ opacity: 0.85 * gin * (1 - turn), float: Math.sin(t * 3) * 0.07, mouth: worried ? "o" : "smile", blink: worried ? blinkAt(t, 2) : 0.35, lookX: -0.6,
    sweat: worried, waveR: t > 1.0 && t < 2.8 ? Math.abs(Math.sin(t * 8)) * 0.2 : t > 8.9 && t < 10.3 ? 0.25 + Math.abs(Math.sin(t * 20)) * 0.05 : 0 }, t);
  tag.visible = t > 0.5 && t < 5.4; tag.position.set(GX, 0.75 + Math.sin(t * 3) * 0.06, 1.25); tag.scale.setScalar(E.back(prog(t, 0.5, 0.8)));
  gPoof.position.set(GX, 0.9, 0.9); gPoof.userData.at(prog(t, 10.6, 11.4));
  const rk = E.back(prog(t, 10.75, 11.1));
  const hop = prog(t, 12.4, 12.6) * (1 - prog(t, 15.3, 15.5));
  real.root.visible = t > 10.75;
  real.root.scale.setScalar(0.95 * Math.max(0.01, rk));
  real.root.position.set(GX, hop * Math.abs(Math.sin(t * 9)) * 0.2, 0.6);
  real.pose({ blink: blinkAt(t, 1.9), lookX: -0.6, mouth: "smile", armL: 0.3 + hop * 1.5 + (t > 11 && t < 12 ? 1.2 : 0), armR: 0.3 + hop * 1.5, tilt: hop * Math.sin(t * 9) * 0.12 });
  const pk = E.out(prog(t, 8.8, 9.1)) * (1 - prog(t, 10.4, 10.6));
  phone.visible = pk > 0.01; phone.position.set(1.15, 2.35, 1.0); phone.scale.setScalar(1.2 * pk); phone.rotation.set(-0.1, -0.2, 0);
  phone.userData.show(t < 9.4 ? 0 : t < 9.9 ? 1 : 2);
  const ck = prog(t, 9.9, 10.5);
  coin.visible = ck > 0 && ck < 1;
  coin.position.set(lerp(1.3, -0.55, ck), lerp(1.4, 0.7, ck) + Math.sin(ck * Math.PI) * 1.3, lerp(0.9, 1.3, ck)); coin.rotation.y = ck * 16;
  jar.userData.fill(t < 10.5 ? 2 : 3);

  // The artist: unimpressed, then happy.
  const skeptic = t > 2.8 && t < 10.6;
  const cheer = E.back(prog(t, 12.5, 12.8)) * (1 - prog(t, 15.3, 15.6));
  A.pose({ blink: skeptic ? 0.45 : blinkAt(t, 0.6), mouth: skeptic ? "flat" : "smile", lookX: 0.8, headTilt: skeptic ? -0.12 : 0,
    armL: 0.15 + (skeptic ? 0.5 : 0) + cheer * 2.4, armLx: skeptic ? -1.1 : 0, armR: 0.15 + (skeptic ? 0.5 : 0) + cheer * 2.4, armRx: skeptic ? -1.1 : 0 });

  // Lockie the bouncer drops in with the house rule.
  const drop = prog(t, 5.3, 5.65);
  L.root.visible = t > 5.3;
  const landK = t > 5.65 ? Math.exp(-(t - 5.65) * 6) * Math.cos((t - 5.65) * 18) : 0;
  const signUp = E.back(prog(t, 5.9, 6.25)) * (1 - E.inOut(prog(t, 8.5, 8.8)));
  const click = t > 11.4 ? Math.exp(-(t - 11.4) * 7) : 0;
  L.root.position.set(0.0, (1 - E.out(drop)) * 4.5 + hop * Math.abs(Math.sin(t * 9 + 1)) * 0.18, 1.0);
  L.shades.visible = t > 5.3 && t < 11.4;
  L.pose({ squash: landK * 0.8 + click * 0.5, open: t < 11.4 ? 1 : 1 - E.out(prog(t, 11.4, 11.55)), armR: 0.25 + signUp * 2.3 + hop * 2, armL: 0.25 + hop * 2,
    blink: blinkAt(t, 1.2), lookX: 0.6, mouth: click > 0.3 ? "o" : "smile", tilt: hop * Math.sin(t * 9) * 0.15 });
  lPoof.position.set(0.0, 1.0, 1.1); lPoof.userData.at(prog(t, 5.4, 6.2));
  sign.visible = signUp > 0.01;
  sign.position.set(0.15, 1.45, 1.2); sign.scale.setScalar(0.6 * signUp); sign.rotation.z = -0.06 + Math.sin(t * 3) * 0.03;

  confetti.position.set(0, 1.6, 0.6); confetti.userData.at(t - 12.5);
  showBubbles(t, bub, S.toScreen);
  outro(t, 15.6, { h: "Ghosts welcome.<br>Deposits first.", p: "Booking + deposits for tattoo artists.<br>Free for founding artists." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
