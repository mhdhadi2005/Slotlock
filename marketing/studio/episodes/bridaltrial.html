<!doctype html><html data-look="blush"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
<style>
  /* Blush palette for beauty episodes. */
  body { background: #fff5f7; color: #3d1f2c; }
  .glow { background: radial-gradient(60% 38% at 82% 8%, rgba(255,150,190,.55), transparent 70%), radial-gradient(55% 35% at 0% 100%, rgba(255,200,220,.6), transparent 70%); }
  #cap { font: 700 84px/1.04 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  em { color: #d63a70; font-style: italic; }
  #foot { color: #a57f8f; }
  .bub { box-shadow: 0 16px 40px -14px rgba(170,60,105,.5); border: 3px solid #f6cfdc; }
  .bub::after { border-right: 3px solid #f6cfdc; border-bottom: 3px solid #f6cfdc; }
  .bub.accent { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; border-color: transparent; } .bub.accent::after { background: #e24f86; border-color: transparent; }
  .bub.dark { background: #3d1f2c; color: #fff5f7; border-color: #3d1f2c; } .bub.dark::after { background: #3d1f2c; border-color: #3d1f2c; }
  .sfx { color: #fff; -webkit-text-stroke: 4px #7a1d45; }
  #outro { background: radial-gradient(60% 40% at 50% 30%, rgba(255,150,190,.55), transparent 70%), #fff5f7; }
  #outro h2 { font: italic 700 100px/1.02 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  #outro p { color: #6e4b5b; }
  #outro .cta { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; }
  #outro .wordmark, #foot .wordmark { color: #3d1f2c; }
</style>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeTech, makeNailTable, makeBlob, makeCoin, makeSign, makeJar, makePhone, makeLabel, makeConfetti, makePoof, blinkAt } from "/kit.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
await document.fonts.load("600 40px 'Fraunces'"); await document.fonts.load("italic 600 40px 'Fraunces'");
const S = setup({ camPos: [0, 2.3, 10.5], look: [0, 1.75, 0], palette: "blush" });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const T = makeTech({ skin: 0xe8b48f, hair: 0x2a1a12, smock: 0xff9ec0 }); T.root.position.set(-0.7, 0, -0.35); S.scene.add(T.root);
const table = makeNailTable(); table.position.set(0, 0, 0.35); S.scene.add(table);
const jar = makeJar("DEPOSITS"); jar.position.set(0.05, 0.95, 0.6); jar.scale.setScalar(0.9); jar.userData.fill(1); S.scene.add(jar);
const L = makeLockie({ color: 0xff7aa8, feet: 0xe0457f, key: 0x7a1d45 }); L.root.scale.setScalar(0.62); S.scene.add(L.root);
// The bride: veil and flower crown.
const B = makeBlob(0xfff8fb, 0.72); S.scene.add(B.root);
const veil = mesh(new THREE.ConeGeometry(0.78, 1.15, 28, 1, true, Math.PI / 2, Math.PI), toon(0xfff3f8, { side: THREE.DoubleSide }), 0.015); veil.position.set(0, 0.52, -0.1); B.body.add(veil);
const crown = new THREE.Group(); crown.position.set(0, 0.9, 0); B.body.add(crown);
for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2; const f = mesh(new THREE.SphereGeometry(0.075, 10, 8), toon(i % 2 ? 0xff8fb1 : 0xe0457f), 0.01); f.position.set(Math.sin(a) * 0.26, 0, Math.cos(a) * 0.26); crown.add(f); }
// Her wedding checklist.
const LIST = [["DRESS ✓"], ["CAKE ✓"], ["VENUE ✓"], ["NAILS ✗"]];
const doneLbl = makeLabel(["NAILS ✓"], { w: 0.9, h: 0.24, bg: "#e0457f", color: "#ffffff" }); S.scene.add(doneLbl);
const items = LIST.map((l, i) => { const m = makeLabel(l, { w: 0.9, h: 0.24, bg: i === 3 ? "#e0457f" : "#ffffff", color: i === 3 ? "#ffffff" : "#3d1f2c" }); S.scene.add(m); return m; });
// The two slots she needs.
const SLOTS = [[["TRIAL", "SEP 12 · OPEN"], ["TRIAL ✓", "SEP 12"]], [["WEDDING DAY", "OCT 3 · OPEN"], ["WEDDING ✓", "OCT 3"]]];
const slots = SLOTS.map(([o, b], i) => {
  const open = makeLabel(o, { w: 1.15, h: 0.5, bg: "#ffffff", color: "#b58a9b" }), booked = makeLabel(b, { w: 1.15, h: 0.5, bg: "#e0457f", color: "#ffffff" });
  open.position.set(-0.65 + i * 1.3, 3.15, -1.2); booked.position.set(-0.65 + i * 1.3, 3.15, -1.18); S.scene.add(open, booked); return { open, booked };
});
const sign = makeSign(["BOOK BOTH", "RIGHT NOW"], { w: 1.5, h: 0.9, bg: "#ffffff", color: "#e0457f" }); S.scene.add(sign);
const phone = makePhone([{ lines: ["TRIAL", "SEP 12"] }, { lines: ["WEDDING", "OCT 3"] }, { lines: ["2 ×", "DEPOSIT"] }, { lines: ["BOTH", "BOOKED ✓"], bg: "#fff0f5", color: "#e0457f" }]); S.scene.add(phone);
const coins = [0, 1].map(() => { const c = makeCoin(); c.scale.setScalar(0.55); S.scene.add(c); return c; });
const PAY = [10.0, 10.6];
const poof = makePoof(14, 211); S.scene.add(poof);
const confetti = makeConfetti(100, 213); S.scene.add(confetti);
const PINKS = [0xe0457f, 0xff8fb1, 0xffffff, 0xd7a6ff, 0xffc4d8, 0xf3c6b0];
confetti.children.forEach((m, i) => { m.material = flat(PINKS[i % PINKS.length], { side: THREE.DoubleSide }); });
const BX = 0.85;

const bub = bubbles([
  { t0: 2.4, t1: 3.9, text: "do u have oct 3?? AND a trial?? 😭", anchor: () => V(BX, 1.25, 1.0), align: 0.75, tail: "75%" },
  { t0: 3.9, t1: 5.2, text: "what if someone takes it first", anchor: () => V(BX, 1.25, 1.0), align: 0.75, tail: "75%" },
  { t0: 5.3, t1: 6.0, sfx: true, text: "POOF!", anchor: () => V(0.72, 1.9, 0.8), rot: 8 },
  { t0: 11.2, t1: 12.0, sfx: true, text: "CLINK CLINK!", anchor: () => V(0.05, 1.85, 0.9), rot: -6 },
  { t0: 12.4, t1: 14.6, text: "NAILS ✓ i can breathe 💍", anchor: () => V(BX, 1.25, 1.0), align: 0.75, tail: "75%" },
]);

window.DUR = 18.8;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.4, html: "Dress ✓ Cake ✓ Venue ✓ <em>Nails…</em>" },
    { t0: 2.4, t1: 5.3, html: "The bride needs <em>a trial and the big day.</em>" },
    { t0: 5.5, t1: 8.4, html: "Book both slots <em>right now.</em>" },
    { t0: 8.4, t1: 12.2, html: "Two bookings. <em>Two deposits.</em> Both locked." },
    { t0: 12.2, t1: 15.6, html: "Nails ✓ <em>One less thing.</em> 💍" },
  ]);
  S.aim(V(0, 2.3, 10.5), V(0, 1.75, 0));

  // The bride arrives with her checklist.
  const bin = E.out(prog(t, 0.1, 0.6));
  const dance = prog(t, 12.3, 12.5) * (1 - prog(t, 15.4, 15.6));
  const stress = t > 2.4 && t < 5.4;
  B.root.position.set(lerp(3.2, BX - 0.05, bin), (bin < 1 ? Math.abs(Math.sin(t * 11)) * 0.14 : stress ? Math.abs(Math.sin(t * 14)) * 0.05 : 0) + dance * Math.abs(Math.sin(t * 9)) * 0.18, 0.95);
  const tapping = t > 8.6 && t < 10.0;
  B.pose({ blink: blinkAt(t, 1.3), lookX: -0.5, lookY: t < 2.4 ? 0.6 : 0.2, mouth: stress ? "o" : "smile", squash: stress ? Math.sin(t * 18) * 0.04 : 0,
    armL: 0.3 + (tapping ? 1.1 + Math.abs(Math.sin(t * 20)) * 0.2 : 0) + dance * 1.5, armR: 0.3 + (stress ? 1.2 + Math.sin(t * 8) * 0.3 : 0) + dance * 1.5, tilt: dance * Math.sin(t * 9) * 0.1 });
  items.forEach((m, i) => {
    const k = E.back(prog(t, 0.5 + i * 0.35, 0.8 + i * 0.35)) * (1 - E.inOut(prog(t, 5.2, 5.5))) ;
    m.visible = k > 0.01; m.scale.setScalar(Math.max(0.01, Math.min(1.1, k)));
    m.position.set(BX + 0.1, 2.65 - i * 0.28 + Math.sin(t * 3 + i) * 0.02, 1.1); m.scale.multiplyScalar(0.85);
  });
  const done = t > 12.0;
  items[3].visible = items[3].visible && !done; doneLbl.visible = done && t < 15.5; doneLbl.position.set(BX + 0.1, 2.15, 1.1); doneLbl.scale.setScalar(Math.max(0.01, E.back(prog(t, 12.0, 12.3))));
  const pk = E.out(prog(t, 8.4, 8.7)) * (1 - prog(t, 11.0, 11.2));
  phone.visible = pk > 0.01; phone.position.set(BX - 0.15, 1.85, 1.3); phone.scale.setScalar(1.05 * pk); phone.rotation.set(-0.1, -0.25, 0);
  phone.userData.show(t < 9.0 ? 0 : t < 9.5 ? 1 : t < 10.6 ? 2 : 3);
  let landed = 0;
  coins.forEach((c, i) => {
    const ck = prog(t, PAY[i], PAY[i] + 0.5);
    c.visible = ck > 0 && ck < 1;
    c.position.set(lerp(BX, 0.05, ck), lerp(1.0, 1.35, ck) + Math.sin(ck * Math.PI) * 0.9, lerp(1.1, 0.6, ck)); c.rotation.y = ck * 16;
    if (t > PAY[i] + 0.5) landed++;
  });
  jar.userData.fill(1 + landed);
  slots.forEach(({ open, booked }, i) => {
    const at = PAY[i] + 0.45, k = E.back(prog(t, at, at + 0.3));
    open.visible = t > 5.6 && k < 0.5; booked.visible = t > at; booked.scale.setScalar(Math.max(0.01, k));
    open.scale.setScalar(Math.max(0.01, E.back(prog(t, 5.6 + i * 0.2, 5.9 + i * 0.2))));
  });

  // The tech: excited, then cheering with the bride.
  const cheer = E.back(prog(t, 12.3, 12.6)) * (1 - prog(t, 15.3, 15.6));
  T.pose({ blink: blinkAt(t, 0.8), lookX: 0.5, mouth: "smile", armL: 0.1 + cheer * 2.5, armLx: cheer > 0.1 ? 0 : -0.9, armR: 0.1 + cheer * 2.5, armRx: cheer > 0.1 ? 0 : -0.9 });

  // Pink Lockie: book both now.
  const drop = prog(t, 5.1, 5.45);
  L.root.visible = t > 5.1;
  const landK = t > 5.45 ? Math.exp(-(t - 5.45) * 6) * Math.cos((t - 5.45) * 18) : 0;
  const signUp = E.back(prog(t, 5.7, 6.05)) * (1 - E.inOut(prog(t, 8.2, 8.5)));
  L.root.position.set(0.72, 0.95 + (1 - E.out(drop)) * 3.5 + dance * Math.abs(Math.sin(t * 9)) * 0.2, 0.45);
  L.pose({ squash: landK * 0.7, open: t < 11.2 ? 1 : 0, armR: 0.25 + signUp * 1.2 + dance * 2, armL: 0.25 + dance * 2, blink: blinkAt(t, 1.4), lookX: 0.4, tilt: dance * Math.sin(t * 9) * 0.15 });
  poof.position.set(0.72, 1.4, 0.7); poof.userData.at(prog(t, 5.2, 6.0));
  sign.visible = signUp > 0.01;
  sign.position.set(0.95, 1.45, 0.95); sign.scale.setScalar(0.5 * signUp); sign.rotation.z = -0.08 + Math.sin(t * 3) * 0.03;

  confetti.position.set(0.3, 1.5, 0.8); confetti.userData.at(t - 12.3);
  showBubbles(t, bub, S.toScreen);
  outro(t, 15.6, { h: "Trial booked.<br>Big day booked.", p: "Booking + deposits for nail techs,<br>lash artists & beauty pros." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
