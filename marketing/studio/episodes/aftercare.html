<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeArtist, makeBlob, makePhone, makeSign, makeHeart, makeNurseCap, makeFloaty, makeConfetti, makePoof, blinkAt, BLOB_COLORS } from "/kit.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
const S = setup({ camPos: [0, 2.6, 13], look: [0, 1.95, 0] });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const A = makeArtist(); A.root.position.set(-1.25, 0, 0.1); S.scene.add(A.root);
// The pool.
const water = mesh(new THREE.CylinderGeometry(0.66, 0.66, 0.06, 40), toon(0x7fd3f0), 0.02); water.position.set(1.28, 0.03, 0.2); S.scene.add(water);
const rim = mesh(new THREE.TorusGeometry(0.68, 0.06, 10, 40), toon(0xffffff), 0.015); rim.rotation.x = Math.PI / 2; rim.position.set(1.28, 0.07, 0.2); S.scene.add(rim);
const C = makeBlob(BLOB_COLORS[1], 0.85); S.scene.add(C.root);
const tat = makeHeart(0xe0453a); tat.scale.setScalar(0.13); tat.position.set(0.26, 0.42, 0.4); tat.rotation.y = 0.5; C.body.add(tat);
const wrap = new THREE.Mesh(new THREE.CircleGeometry(0.14, 20), flat(0xffffff, { transparent: true, opacity: 0.45 })); wrap.position.set(0.27, 0.42, 0.44); wrap.rotation.y = 0.5; C.body.add(wrap);
const floaty = makeFloaty(); floaty.position.y = 0.38; C.root.add(floaty);
const L = makeLockie(); L.root.scale.setScalar(0.62); S.scene.add(L.root);
const cap = makeNurseCap(); cap.position.set(0, 1.3, 0.1); L.body.add(cap);
const phone = makePhone([{ lines: ["EMAIL:", "AFTERCARE"], bg: "#fff3d6" }]); S.scene.add(phone);
const RULES = [["AFTERCARE:", "NO POOL · 2 WKS"], ["NO SUN", "FOR 2 WEEKS"], ["WASH +", "MOISTURIZE"]];
const signs = RULES.map((r) => { const s = makeSign(r, { w: 1.7, h: 0.9, bg: "#ffffff", color: "#e0453a" }); S.scene.add(s); return s; });
const RULE_AT = [5.9, 8.6, 9.8];
const poof = makePoof(14, 91), splash = makePoof(16, 93); S.scene.add(poof, splash);
splash.children.forEach((m) => { m.material.color.setHex(0xbfeeff); m.material.emissive.setHex(0x4a9ac0); });
const confetti = makeConfetti(90, 97); S.scene.add(confetti);

const bub = bubbles([
  { t0: 0.4, t1: 2.2, text: "obsessed. thank uuu 🥹", anchor: () => V(-0.2, 1.3, 0.8), align: 0.5 },
  { t0: 2.5, t1: 3.3, sfx: true, text: "3 HOURS LATER", anchor: () => V(0, 2.6, 0.5), rot: -4 },
  { t0: 3.6, t1: 5.1, text: "pool party tonight 🏊", anchor: () => V(0.45, 1.45, 0.7), align: 0.6, tail: "60%" },
  { t0: 5.0, t1: 5.6, sfx: true, text: "bzzt!", anchor: () => V(0.75, 2.0, 1.2), rot: -8 },
  { t0: 5.6, t1: 6.3, sfx: true, text: "POOF!", anchor: () => V(-0.45, 1.9, 1.3), rot: 8 },
  { t0: 9.4, t1: 10.3, sfx: true, text: "PSSSHHH", anchor: () => V(0.7, 0.9, 1.0), rot: -6 },
  { t0: 10.4, t1: 11.8, text: "ok ok. no pool 😅", anchor: () => V(0.5, 1.45, 0.7), align: 0.6, tail: "60%" },
  { t0: 12.0, t1: 12.9, sfx: true, text: "2 WEEKS LATER", anchor: () => V(0, 2.6, 0.5), rot: 4 },
  { t0: 13.5, t1: 14.3, sfx: true, text: "SPLASH!", anchor: () => V(1.2, 1.6, 0.5), rot: -8 },
]);

window.DUR = 18.8;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.5, html: "Fresh tattoo. <em>Happy client.</em>" },
    { t0: 2.5, t1: 5.4, html: "3 hours later: <em>pool party?</em> 🏊" },
    { t0: 5.6, t1: 8.6, html: "Slotlock emails your <em>aftercare</em> a few hours later." },
    { t0: 8.6, t1: 12.0, html: "No pool. No sun. <em>Wash + moisturize.</em>" },
    { t0: 12.0, t1: 15.6, html: "2 weeks later: <em>healed. Then pool.</em>" },
  ]);
  S.aim(V(0, 2.6, 13), V(0, 1.95, 0));

  // The client: leaves happy, grabs a floaty, gets the aftercare, waits, then cannonballs.
  const walk = E.inOut(prog(t, 2.4, 3.3));
  const jump = prog(t, 13.0, 13.55);
  let cx = lerp(-0.2, 0.45, walk), cy = 0;
  if (jump > 0) { cx = lerp(0.45, 1.28, jump); cy = Math.sin(jump * Math.PI) * 1.3 - jump * 0.35; }
  const bob = t > 13.55 ? Math.sin(t * 4) * 0.04 : 0;
  C.root.position.set(cx, cy + bob + (walk > 0 && walk < 1 ? Math.abs(Math.sin(t * 11)) * 0.14 : 0), lerp(0.8, 0.7, walk) - (jump > 0 ? jump * 0.5 : 0));
  C.pose({ blink: blinkAt(t, 1.3), lookX: t < 2.4 ? -0.6 : t > 5.6 && t < 12 ? -0.5 : 0.3, mouth: t > 5.0 && t < 6.5 ? "o" : "smile", squash: jump > 0 && jump < 1 ? -0.1 : 0,
    armL: 0.3 + (t < 2.2 ? 1.2 + Math.sin(t * 8) * 0.3 : 0) + (t > 13.6 ? 1.6 : 0), armR: 0.3 + (t > 3.6 && t < 5.0 ? 1.4 : 0) + (t > 13.6 ? 1.6 : 0) });
  const deflate = E.inOut(prog(t, 9.4, 10.2));
  floaty.visible = (t > 3.0 && t < 10.6) || t > 13.4;
  const inflate = t > 13.4 ? 1 : 1 - deflate * 0.55;
  const pop = t > 13.4 ? 1 : E.back(prog(t, 3.0, 3.3));
  floaty.scale.set(inflate * pop, inflate * (t < 13.4 ? 1 - deflate * 0.4 : 1), inflate * pop);
  floaty.position.y = 0.38 - deflate * (t < 13.4 ? 0.3 : 0);
  wrap.visible = t < 12.0;
  splash.position.set(1.28, 0.4, 0.5); splash.userData.at(prog(t, 13.5, 14.3));

  // The client's phone buzzes with the aftercare email.
  const pk = E.out(prog(t, 5.0, 5.2)) * (1 - prog(t, 5.8, 6.0));
  phone.visible = pk > 0.01; phone.position.set(0.75, 1.55, 1.2); phone.scale.setScalar(1.1 * pk); phone.rotation.set(-0.1, -0.2, 0.04 * Math.sin(t * 60));

  // The artist: waves goodbye, horrified at the pool, relieved, then cheering.
  const panic = t > 3.6 && t < 5.6;
  const cheer = E.back(prog(t, 13.6, 13.9)) * (1 - prog(t, 15.3, 15.6));
  A.pose({ blink: blinkAt(t, 0.6), mouth: panic ? "o" : "smile", lookX: 0.8, slump: panic ? 0.3 : 0,
    armR: 0.15 + (t < 2.2 ? 1.8 + Math.sin(t * 8) * 0.3 : 0) + cheer * 2.4, armL: 0.15 + (panic ? 1.0 : 0) + cheer * 2.4, armLx: panic ? -1.2 : 0 });

  // Nurse Lockie drops in with the aftercare rules.
  const drop = prog(t, 5.4, 5.75);
  L.root.visible = t > 5.4;
  const landK = t > 5.75 ? Math.exp(-(t - 5.75) * 6) * Math.cos((t - 5.75) * 18) : 0;
  const party = prog(t, 13.6, 13.8) * (1 - prog(t, 15.3, 15.5));
  L.root.position.set(-0.45, (1 - E.out(drop)) * 4.5 + party * Math.abs(Math.sin(t * 9)) * 0.2, 1.2);
  const up = E.back(prog(t, 5.9, 6.25)) * (1 - E.inOut(prog(t, 11.6, 11.9)));
  L.pose({ squash: landK * 0.8, open: 0, armR: 0.25 + up * 1.2 + party * 2, armL: 0.25 + party * 2, blink: blinkAt(t, 1.2), lookX: 0.6, tilt: party * Math.sin(t * 9) * 0.15 });
  poof.position.set(-0.45, 1.0, 1.4); poof.userData.at(prog(t, 5.5, 6.3));
  let r = -1; RULE_AT.forEach((a, i) => { if (t >= a) r = i; });
  signs.forEach((s, i) => {
    s.visible = i === r && up > 0.01;
    s.position.set(-0.25, 1.5, 1.5); s.rotation.z = -0.06 + Math.sin(t * 3) * 0.03;
    s.scale.setScalar(0.55 * (i === 0 ? up : up * E.back(prog(t, RULE_AT[i], RULE_AT[i] + 0.3))));
  });

  confetti.position.set(0.2, 1.6, 0.6); confetti.userData.at(t - 13.6);
  showBubbles(t, bub, S.toScreen);
  outro(t, 15.6, { h: "Aftercare sent.<br>Tattoo saved.", p: "Booking + deposits for tattoo artists.<br>Free for founding artists." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
