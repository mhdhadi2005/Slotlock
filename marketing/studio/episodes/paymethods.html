<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeArtist, makeBlob, makeCoin, makeJar, makePhone, makeSign, makeLabel, makeConfetti, makePoof, blinkAt, BLOB_COLORS } from "/kit.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
const S = setup({ camPos: [0, 2.6, 13], look: [0, 1.95, 0] });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const A = makeArtist(); A.root.position.set(-1.25, 0, 0.1); S.scene.add(A.root);
const C = makeBlob(BLOB_COLORS[0], 0.85); S.scene.add(C.root);
// The goat: a white gumdrop with horns and a little beard.
const goat = makeBlob(0xf6f2eb, 0.6); S.scene.add(goat.root);
for (const s of [-1, 1]) { const h = mesh(new THREE.ConeGeometry(0.07, 0.3, 10), toon(0x9a8f84), 0.012); h.position.set(s * 0.18, 0.98, -0.05); h.rotation.z = -s * 0.35; goat.body.add(h);
  const ear = mesh(new THREE.SphereGeometry(0.1, 10, 8), toon(0xf6f2eb), 0.012); ear.scale.set(1.6, 0.6, 0.8); ear.position.set(s * 0.5, 0.75, 0); goat.body.add(ear); }
const beard = mesh(new THREE.ConeGeometry(0.07, 0.2, 10), toon(0xd9d2c8), 0.01); beard.rotation.x = Math.PI; beard.position.set(0, 0.22, 0.44); goat.body.add(beard);
const L = makeLockie(); L.root.scale.setScalar(0.8); S.scene.add(L.root);
const jar = makeJar("DEPOSITS"); jar.position.set(-0.95, 0, 1.35); jar.scale.setScalar(0.7); jar.userData.fill(2); S.scene.add(jar);
const sign = makeSign(["VENMO", "CASH APP · ZELLE"], { w: 1.8, h: 1.0 }); S.scene.add(sign);
const offers = [makeLabel(["IOU $50 ✍️"], { w: 1.0, h: 0.34, bg: "#fff3d6", color: "#1a0905" }), makeLabel(["MEME COIN? 🚀"], { w: 1.1, h: 0.34, bg: "#d7a6ff", color: "#1a0905" })];
offers.forEach((o) => S.scene.add(o));
const OFFER_AT = [2.9, 3.9];
const phone = makePhone([{ lines: ["VENMO", "@artist"] }, { lines: ["$50", "DEPOSIT"] }, { lines: ["SENT", "✓"], bg: "#e6fff1", color: "#128a52" }]); S.scene.add(phone);
const coin = makeCoin(); coin.scale.setScalar(0.7); S.scene.add(coin);
const poof = makePoof(14, 101); S.scene.add(poof);
const confetti = makeConfetti(90, 103); S.scene.add(confetti);
const CX = 0.8, GX = 1.35;

const bub = bubbles([
  { t0: 0.6, t1: 2.4, text: "can i pay the deposit with… him? 🐐", anchor: () => V(CX, 1.35, 0.8), align: 0.75, tail: "75%" },
  { t0: 2.4, t1: 3.1, sfx: true, text: "MEHHH!", anchor: () => V(GX, 1.2, 1.2), rot: 8 },
  { t0: 2.5, t1: 3.3, text: "no.", cls: "dark", anchor: () => V(-1.25, 2.55, 0.1), align: 0.25, tail: "25%" },
  { t0: 5.3, t1: 6.0, sfx: true, text: "POOF!", anchor: () => V(0.0, 1.9, 1.0), rot: 8 },
  { t0: 11.2, t1: 11.9, sfx: true, text: "CLICK!", anchor: () => V(0.0, 1.9, 1.0), rot: -6 },
  { t0: 12.2, t1: 14.2, text: "ok the goat can stay 🐐", cls: "dark", anchor: () => V(-1.25, 2.55, 0.1), align: 0.25, tail: "25%" },
]);

window.DUR = 18.8;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.5, html: "“Can I pay the deposit with <em>a goat?</em>” 🐐" },
    { t0: 2.5, t1: 5.3, html: "Or an IOU? <em>A meme coin?</em>" },
    { t0: 5.5, t1: 8.6, html: "Your page shows <em>how you take deposits.</em>" },
    { t0: 8.6, t1: 11.9, html: "Paid straight to you. <em>You confirm it.</em>" },
    { t0: 11.9, t1: 15.6, html: "Deposit paid. <em>Goat optional.</em>" },
  ]);
  S.aim(V(0, 2.6, 13), V(0, 1.95, 0));

  // The client and the goat trot in together.
  const cin = E.out(prog(t, 0.1, 0.6));
  const party = prog(t, 12.0, 12.2) * (1 - prog(t, 15.3, 15.5));
  const hopC = (cin < 1 ? Math.abs(Math.sin(t * 11)) * 0.15 : 0) + party * Math.abs(Math.sin(t * 9)) * 0.16;
  C.root.position.set(lerp(3.2, CX, cin), hopC, 0.8);
  goat.root.position.set(lerp(3.8, GX, cin), (cin < 1 ? Math.abs(Math.sin(t * 12 + 1)) * 0.15 : 0) + party * Math.abs(Math.sin(t * 9 + 2)) * 0.2 + (t > 2.4 && t < 3.1 ? Math.abs(Math.sin(t * 20)) * 0.06 : 0), 1.25);
  const tapping = t > 9.0 && t < 10.4;
  C.pose({ blink: blinkAt(t, 1.7), lookX: -0.7, mouth: t > 2.5 && t < 5.3 ? "o" : "smile", armL: 0.3 + (t > 2.9 && t < 5.2 ? 1.4 : 0) + (tapping ? 1.1 + Math.abs(Math.sin(t * 20)) * 0.2 : 0) + party * 1.5, armR: 0.3 + (t < 2.4 ? 1.2 : 0) + party * 1.5 });
  goat.pose({ blink: blinkAt(t, 0.9), lookX: -0.5, mouth: t > 2.4 && t < 3.1 ? "o" : "smile" });
  offers.forEach((o, i) => {
    const k = E.back(prog(t, OFFER_AT[i], OFFER_AT[i] + 0.3)) * (1 - E.inOut(prog(t, 5.0, 5.3)));
    o.visible = k > 0.01; o.scale.setScalar(Math.max(0.01, k)); o.position.set(CX - 0.05, 1.95 + i * 0.45 + Math.sin(t * 3 + i) * 0.03, 0.9); o.rotation.z = (i ? -1 : 1) * 0.06;
  });
  const pk = E.out(prog(t, 8.8, 9.1)) * (1 - prog(t, 10.9, 11.1));
  phone.visible = pk > 0.01; phone.position.set(0.75, 2.2, 1.1); phone.scale.setScalar(1.2 * pk); phone.rotation.set(-0.1, -0.2, 0);
  phone.userData.show(t < 9.6 ? 0 : t < 10.2 ? 1 : 2);
  const ck = prog(t, 10.2, 10.8);
  coin.visible = ck > 0 && ck < 1;
  coin.position.set(lerp(0.8, -0.95, ck), lerp(1.3, 0.7, ck) + Math.sin(ck * Math.PI) * 1.3, lerp(1.0, 1.35, ck)); coin.rotation.y = ck * 16;
  jar.userData.fill(t < 10.8 ? 2 : 3);

  // The artist: deadpan, confirms the deposit, then warms up to the goat.
  const dead = t > 1.0 && t < 5.4;
  const nod = t > 10.9 && t < 11.3 ? Math.sin(prog(t, 10.9, 11.3) * Math.PI * 2) * 0.2 : 0;
  const cheer = E.back(prog(t, 12.1, 12.4)) * (1 - prog(t, 15.3, 15.6));
  A.pose({ blink: dead ? 0.45 : blinkAt(t, 0.6), mouth: dead ? "flat" : "smile", lookX: 0.8, headTilt: dead ? -0.1 : 0, headNod: nod,
    armL: 0.15 + (dead ? 0.5 : 0) + cheer * 2.4, armLx: dead ? -1.1 : 0, armR: 0.15 + (dead ? 0.5 : 0) + cheer * 2.4, armRx: dead ? -1.1 : 0 });

  // Lockie with the real options.
  const drop = prog(t, 5.1, 5.45);
  L.root.visible = t > 5.1;
  const landK = t > 5.45 ? Math.exp(-(t - 5.45) * 6) * Math.cos((t - 5.45) * 18) : 0;
  const signUp = E.back(prog(t, 5.7, 6.05)) * (1 - E.inOut(prog(t, 8.5, 8.8)));
  const click = t > 11.2 ? Math.exp(-(t - 11.2) * 7) : 0;
  L.root.position.set(-0.1, (1 - E.out(drop)) * 4.5 + party * Math.abs(Math.sin(t * 9 + 1)) * 0.18, 1.0);
  L.pose({ squash: landK * 0.8 + click * 0.5, open: t < 11.2 ? 1 : 1 - E.out(prog(t, 11.2, 11.35)), armR: 0.25 + signUp * 2.3 + party * 2, armL: 0.25 + party * 2,
    blink: blinkAt(t, 1.2), lookX: 0.6, mouth: click > 0.3 ? "o" : "smile", tilt: party * Math.sin(t * 9) * 0.15 });
  poof.position.set(0.0, 1.0, 1.1); poof.userData.at(prog(t, 5.2, 6.0));
  sign.visible = signUp > 0.01;
  sign.position.set(0.15, 1.45, 1.2); sign.scale.setScalar(0.66 * signUp); sign.rotation.z = -0.06 + Math.sin(t * 3) * 0.03;

  confetti.position.set(0, 1.6, 0.6); confetti.userData.at(t - 12.1);
  showBubbles(t, bub, S.toScreen);
  outro(t, 15.6, { h: "Deposits: yes.<br>Goats: no.", p: "Booking + deposits for tattoo artists.<br>Free for founding artists." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
