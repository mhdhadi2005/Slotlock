<!doctype html><html data-look="blush"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
<style>
  /* Blush palette for beauty episodes. */
  body { background: #fff5f7; color: #3d1f2c; }
  .glow { background: radial-gradient(60% 38% at 82% 8%, rgba(255,150,190,.55), transparent 70%), radial-gradient(55% 35% at 0% 100%, rgba(255,200,220,.6), transparent 70%); }
  #cap { font: 700 84px/1.04 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  em { color: #d63a70; font-style: italic; }
  #foot { color: #a57f8f; }
  .bub { box-shadow: 0 16px 40px -14px rgba(170,60,105,.5); border: 3px solid #f6cfdc; }
  .bub::after { border-right: 3px solid #f6cfdc; border-bottom: 3px solid #f6cfdc; }
  .bub.accent { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; border-color: transparent; } .bub.accent::after { background: #e24f86; border-color: transparent; }
  .bub.dark { background: #3d1f2c; color: #fff5f7; border-color: #3d1f2c; } .bub.dark::after { background: #3d1f2c; border-color: #3d1f2c; }
  .sfx { color: #fff; -webkit-text-stroke: 4px #7a1d45; }
  #outro { background: radial-gradient(60% 40% at 50% 30%, rgba(255,150,190,.55), transparent 70%), #fff5f7; }
  #outro h2 { font: italic 700 100px/1.02 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  #outro p { color: #6e4b5b; }
  #outro .cta { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; }
  #outro .wordmark, #foot .wordmark { color: #3d1f2c; }
</style>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeTech, makeBlob, makeCoin, makeSign, makeClock, makeJar, makePhone, makeConfetti, makePoof, blinkAt } from "/kit.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
await document.fonts.load("600 40px 'Fraunces'"); await document.fonts.load("italic 600 40px 'Fraunces'");
const S = setup({ camPos: [0, 2.3, 10.5], look: [0, 1.75, 0], palette: "blush" });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const T = makeTech({ skin: 0xc68a64, hair: 0x3a2219, smock: 0xff9ec0 }); T.root.position.set(-1.0, 0, -0.2); S.scene.add(T.root);
const tweezers = mesh(new THREE.CylinderGeometry(0.012, 0.02, 0.26, 6), toon(0xd9d2c8), 0.006); tweezers.rotation.x = Math.PI / 2; tweezers.position.z = 0.15; T.arms[1].userData.hand.add(tweezers);
// The lash bed.
const bed = new THREE.Group(); bed.position.set(0.35, 0, 0.15); S.scene.add(bed);
const top = mesh(new RoundedBoxGeometry(1.7, 0.18, 0.8, 3, 0.07), toon(0xfff3f7), 0.022); top.position.y = 0.55; bed.add(top);
const bedBase = mesh(new RoundedBoxGeometry(1.4, 0.46, 0.6, 3, 0.05), toon(0xf6cfdc), 0.02); bedBase.position.y = 0.23; bed.add(bedBase);
const pillow = mesh(new RoundedBoxGeometry(0.45, 0.14, 0.6, 3, 0.06), toon(0xffffff), 0.015); pillow.position.set(0.6, 0.7, 0); pillow.rotation.z = 0.15; bed.add(pillow);
const C = makeBlob(0xffc56b, 0.8); S.scene.add(C.root);
// Lashes that grow during the set.
const lashes = new THREE.Group(); lashes.position.set(0, 0.62, 0.46); C.body.add(lashes);
for (const s of [-1, 1]) for (let i = 0; i < 4; i++) { const l = mesh(new THREE.BoxGeometry(0.016, 0.1, 0.012), flat(0x1a0905), 0); l.geometry.translate(0, 0.05, 0); l.position.set(s * 0.15 + (i - 1.5) * 0.035, 0.02, 0); l.rotation.z = -(i - 1.5) * 0.3 - s * 0.1; lashes.add(l); }
const jar = makeJar("DEPOSITS"); jar.position.set(-0.3, 0.64, 0.35); jar.scale.setScalar(0.7); jar.userData.fill(2); S.scene.add(jar);
const L = makeLockie({ color: 0xff7aa8, feet: 0xe0457f, key: 0x7a1d45 }); L.root.scale.setScalar(0.55); S.scene.add(L.root);
const clock = makeClock(); clock.position.set(1.2, 3.0, -1.2); clock.scale.setScalar(0.66); clock.children[0].material = toon(0xe0457f); S.scene.add(clock);
const sign = makeSign(["BOOK YOUR FILL", "BEFORE YOU LEAVE"], { w: 1.8, h: 0.9, bg: "#ffffff", color: "#e0457f" }); S.scene.add(sign);
const phone = makePhone([{ lines: ["LASH FILL", "IN 3 WKS"] }, { lines: ["SAT 21", "2 PM"] }, { lines: ["$20", "DEPOSIT"] }, { lines: ["BOOKED", "✓"], bg: "#fff0f5", color: "#e0457f" }]); S.scene.add(phone);
const coin = makeCoin(); coin.scale.setScalar(0.55); S.scene.add(coin);
const poof = makePoof(14, 131); S.scene.add(poof);
const confetti = makeConfetti(90, 133); S.scene.add(confetti);
const PINKS = [0xe0457f, 0xff8fb1, 0xffffff, 0xd7a6ff, 0xffc4d8, 0xf3c6b0];
confetti.children.forEach((m, i) => { m.material = flat(PINKS[i % PINKS.length], { side: THREE.DoubleSide }); });

const bub = bubbles([
  { t0: 0.4, t1: 1.9, text: "i won't fall asleep this time lol", anchor: () => V(0.75, 1.5, 0.3), align: 0.7, tail: "70%" },
  { t0: 2.0, t1: 2.7, sfx: true, text: "zzz…", anchor: () => V(0.95, 1.7, 0.3), rot: -8 },
  { t0: 3.4, t1: 4.4, sfx: true, text: "SNRRRK", anchor: () => V(0.85, 1.8, 0.3), rot: 6 },
  { t0: 5.4, t1: 6.4, text: "all done 💕", cls: "dark", anchor: () => V(-1.0, 2.3, -0.2), align: 0.3, tail: "30%" },
  { t0: 6.3, t1: 7.2, sfx: true, text: "OMG 😍", anchor: () => V(0.75, 1.75, 0.3), rot: -6 },
  { t0: 7.2, t1: 8.3, text: "wait when's my fill??", anchor: () => V(0.75, 1.5, 0.3), align: 0.7, tail: "70%" },
  { t0: 8.3, t1: 9.0, sfx: true, text: "POOF!", anchor: () => V(0.15, 1.6, 0.5), rot: 8 },
  { t0: 12.5, t1: 13.2, sfx: true, text: "CLICK!", anchor: () => V(0.15, 1.6, 0.5), rot: -6 },
  { t0: 13.4, t1: 15.2, text: "see u in 3 weeks 😴💕", anchor: () => V(0.75, 1.5, 0.3), align: 0.7, tail: "70%" },
]);

window.DUR = 18.8;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.2, html: "“I won't fall asleep <em>this time.</em>”" },
    { t0: 2.2, t1: 5.3, html: "2 hours later… <em>still asleep.</em> 😴" },
    { t0: 5.3, t1: 8.2, html: "Wakes up. <em>Obsessed.</em> “When's my fill?”" },
    { t0: 8.4, t1: 11.2, html: "Book the fill <em>before they leave.</em>" },
    { t0: 11.2, t1: 13.3, html: "3 weeks out. <em>Deposit paid.</em>" },
    { t0: 13.3, t1: 15.6, html: "Asleep for the set. <em>Awake for the booking.</em>" },
  ]);
  S.aim(V(0, 2.3, 10.5), V(0, 1.75, 0));
  clock.userData.setTime(13 * 60 + keys(t, [[0, 0], [2.2, 2], [5.2, 122], [20, 128]]));

  // The client: dozes off instantly, wakes to huge lashes, books the fill, heads out.
  const asleep = t > 2.0 && t < 6.2;
  const wake = E.back(prog(t, 6.2, 6.5));
  const up = E.inOut(prog(t, 13.3, 13.8));
  C.root.position.set(lerp(0.75, 0.95, up), 0.64 - up * 0.64 + (up > 0 && up < 1 ? Math.sin(up * Math.PI) * 0.4 : 0), 0.2 + up * 0.75);
  const grow = 0.25 + 0.75 * E.inOut(prog(t, 2.4, 5.2)) + (t > 6.2 ? 0.3 * wake : 0);
  lashes.scale.set(1, grow, 1);
  lashes.rotation.x = Math.sin(t * 14) * (t > 6.3 && t < 7.2 ? 0.25 : 0);
  const tapping = t > 11.0 && t < 12.4;
  C.pose({ blink: asleep ? 1 : blinkAt(t, 1.3), mouth: asleep ? "o" : "smile", tilt: asleep ? -0.45 + Math.sin(t * 2) * 0.03 : -0.1 * (1 - up), squash: asleep ? Math.sin(t * 2.2) * 0.04 : 0, lookX: t > 8.4 && t < 11 ? -0.6 : 0.2, lookY: 0.2,
    armL: 0.3 + (tapping ? 1.1 + Math.abs(Math.sin(t * 20)) * 0.2 : 0), armR: 0.3 + (t > 6.3 && t < 7.2 ? 1.6 : 0) + (t > 13.6 ? 1.3 + Math.sin(t * 8) * 0.3 : 0) });
  const pk = E.out(prog(t, 11.0, 11.3)) * (1 - prog(t, 12.8, 13.0));
  phone.visible = pk > 0.01; phone.position.set(0.85, 1.85, 1.2); phone.scale.setScalar(1.05 * pk); phone.rotation.set(-0.1, -0.25, 0);
  phone.userData.show(t < 11.5 ? 0 : t < 11.9 ? 1 : t < 12.3 ? 2 : 3);
  const ck = prog(t, 12.2, 12.7);
  coin.visible = ck > 0 && ck < 1;
  coin.position.set(lerp(0.8, -0.3, ck), lerp(1.2, 1.05, ck) + Math.sin(ck * Math.PI) * 0.8, lerp(1.0, 0.35, ck)); coin.rotation.y = ck * 16;
  jar.userData.fill(t < 12.7 ? 2 : 3);

  // The tech: working away, then proud.
  const working = t > 0.8 && t < 5.3;
  const cheer = E.back(prog(t, 13.4, 13.7)) * (1 - prog(t, 15.3, 15.6));
  T.pose({ blink: blinkAt(t, 0.8), lookX: 0.6, lookY: working ? -0.3 : 0, mouth: "smile", headNod: working ? -0.1 : 0,
    armR: 0.15 + (working ? 1.0 + Math.sin(t * 30) * 0.03 : 0) + cheer * 2.4, armRx: working ? -0.9 : 0, armL: 0.15 + cheer * 2.4 });

  // Pink Lockie hops onto the bed with the rule.
  const drop = prog(t, 8.2, 8.55);
  L.root.visible = t > 8.2;
  const landK = t > 8.55 ? Math.exp(-(t - 8.55) * 6) * Math.cos((t - 8.55) * 18) : 0;
  const signUp = E.back(prog(t, 8.8, 9.15)) * (1 - E.inOut(prog(t, 10.9, 11.2)));
  const click = t > 12.5 ? Math.exp(-(t - 12.5) * 7) : 0;
  const dance = prog(t, 13.4, 13.6) * (1 - prog(t, 15.4, 15.6));
  L.root.position.set(0.15, 0.64 + (1 - E.out(drop)) * 3.5 + dance * Math.abs(Math.sin(t * 9)) * 0.2, 0.3);
  L.pose({ squash: landK * 0.7 + click * 0.5, open: t < 12.5 ? 1 : 1 - E.out(prog(t, 12.5, 12.65)), armL: 0.25 + signUp * 1.3 + dance * 2, armR: 0.25 + dance * 2, blink: blinkAt(t, 1.4), lookX: 0.5, tilt: dance * Math.sin(t * 9) * 0.15, mouth: click > 0.3 ? "o" : "smile" });
  poof.position.set(0.15, 1.0, 0.5); poof.userData.at(prog(t, 8.3, 9.1));
  sign.visible = signUp > 0.01;
  sign.position.set(-0.1, 1.4, 0.8); sign.scale.setScalar(0.62 * signUp); sign.rotation.z = 0.06 + Math.sin(t * 3) * 0.03;

  confetti.position.set(0.2, 1.4, 0.6); confetti.userData.at(t - 13.4);
  showBubbles(t, bub, S.toScreen);
  outro(t, 15.6, { h: "Book the fill<br>before they leave.", p: "Booking + deposits for nail techs,<br>lash artists & beauty pros." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
