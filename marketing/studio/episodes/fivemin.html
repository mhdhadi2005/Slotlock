<!doctype html><html data-look="blush"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
<style>
  /* Blush palette for beauty episodes. */
  body { background: #fff5f7; color: #3d1f2c; }
  .glow { background: radial-gradient(60% 38% at 82% 8%, rgba(255,150,190,.55), transparent 70%), radial-gradient(55% 35% at 0% 100%, rgba(255,200,220,.6), transparent 70%); }
  #cap { font: 700 84px/1.04 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  em { color: #d63a70; font-style: italic; }
  #foot { color: #a57f8f; }
  .bub { box-shadow: 0 16px 40px -14px rgba(170,60,105,.5); border: 3px solid #f6cfdc; }
  .bub::after { border-right: 3px solid #f6cfdc; border-bottom: 3px solid #f6cfdc; }
  .bub.accent { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; border-color: transparent; } .bub.accent::after { background: #e24f86; border-color: transparent; }
  .bub.dark { background: #3d1f2c; color: #fff5f7; border-color: #3d1f2c; } .bub.dark::after { background: #3d1f2c; border-color: #3d1f2c; }
  .sfx { color: #fff; -webkit-text-stroke: 4px #7a1d45; }
  #outro { background: radial-gradient(60% 40% at 50% 30%, rgba(255,150,190,.55), transparent 70%), #fff5f7; }
  #outro h2 { font: italic 700 100px/1.02 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  #outro p { color: #6e4b5b; }
  #outro .cta { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; }
  #outro .wordmark, #foot .wordmark { color: #3d1f2c; }
</style>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeTech, makeNailTable, makeBlob, makeSign, makeClock, makeJar, makeCup, makeTumbleweed, makeConfetti, makePoof, blinkAt } from "/kit.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
await document.fonts.load("700 40px 'Fraunces'"); await document.fonts.load("italic 700 40px 'Fraunces'");
const S = setup({ camPos: [0, 2.3, 10.5], look: [0, 1.75, 0], palette: "blush" });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const T = makeTech({ skin: 0x8d5a3b, hair: 0x1f120c, smock: 0xff9ec0 }); T.root.position.set(-0.7, 0, -0.35); S.scene.add(T.root);
const table = makeNailTable(); table.position.set(0, 0, 0.35); S.scene.add(table);
const jar = makeJar("DEPOSITS"); jar.position.set(0.05, 0.95, 0.6); jar.scale.setScalar(0.9); jar.userData.fill(1); S.scene.add(jar);
const cup = makeCup(); S.scene.add(cup);
const L = makeLockie({ color: 0xff7aa8, feet: 0xe0457f, key: 0x7a1d45 }); L.root.scale.setScalar(0.62); S.scene.add(L.root);
const client = makeBlob(0xffc56b, 0.8); S.scene.add(client.root);
const clock = makeClock(); clock.position.set(1.25, 3.0, -1.2); clock.scale.setScalar(0.75); clock.children[0].material = toon(0xe0457f); S.scene.add(clock);
const weed = makeTumbleweed(); weed.scale.setScalar(1.6); weed.children.forEach((l) => l.material.color.setHex(0x7a4a2a)); S.scene.add(weed);
const poof = makePoof(14, 7); S.scene.add(poof);
const confetti = makeConfetti(90, 43); S.scene.add(confetti);
const PINKS = [0xe0457f, 0xff8fb1, 0xffffff, 0xd7a6ff, 0xffc4d8, 0xf3c6b0];
confetti.children.forEach((m, i) => { m.material = flat(PINKS[i % PINKS.length], { side: THREE.DoubleSide }); });
const phone = new THREE.Group(); phone.position.set(-0.4, 0.99, 0.6); phone.rotation.x = -Math.PI / 2 + 0.35; S.scene.add(phone);
phone.add(mesh(new RoundedBoxGeometry(0.3, 0.52, 0.05, 3, 0.05), toon(0x3d1f2c), 0.015));
const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.44), flat(0xffd6e5)); screen.position.z = 0.027; phone.add(screen);

const sign = makeSign(["LATE", "POLICY"], { w: 1.2, h: 0.85, bg: "#ffffff", color: "#e0457f" }); S.scene.add(sign);
const BOARDS = [[["2:00 PM", "LASH SET · MIA"], "#ffffff", "#3d1f2c"], [["15 MIN", "GRACE PERIOD"], "#3d1f2c", "#ffffff"], [["DEPOSIT", "ALREADY PAID ✓"], "#e0457f", "#ffffff"]];
const boards = BOARDS.map(([lines, bg, color]) => { const s = makeSign(lines, { w: 2.1, h: 0.85, bg, color }); s.children[0].visible = false; s.position.set(-0.15, 2.55, -1.4); s.scale.setScalar(0.72); S.scene.add(s); return s; });
const BOARD_AT = [0, 7.9, 11.5];

const MSGS = [[0.8, "omw!! 5 min away 🏃‍♀️"], [3.0, "5 min!!"], [4.2, "parking 🅿️"], [5.4, "2 min i swear"], [6.6, "omw fr this time 😅"]];
const bub = bubbles([
  ...MSGS.map(([t0, text], i) => ({ t0, t1: i === 0 ? 2.2 : t0 + 1.1, text, cls: i % 2 ? "accent" : "", anchor: () => V(-0.4, 1.2, 0.8), align: 0.3, tail: "30%" })),
  { t0: 7.5, t1: 8.2, sfx: true, text: "POOF!", anchor: () => V(0.72, 1.9, 0.8), rot: 8 },
  { t0: 11.6, t1: 12.4, sfx: true, text: "CLINK!", anchor: () => V(0.05, 1.85, 0.9), rot: -6 },
  { t0: 16.3, t1: 17.6, text: "i'm here!!! 😅", anchor: () => V(0.95, 1.2, 1.0), align: 0.75, tail: "75%" },
]);

window.DUR = 20.9;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.2, html: "Lash appointment: <em>2:00 PM.</em>" },
    { t0: 2.2, t1: 7.5, html: "“5 min away”… <em>45 minutes ago.</em>" },
    { t0: 7.9, t1: 11.5, html: "Your late policy was on the page <em>when they booked.</em>" },
    { t0: 11.5, t1: 14.8, html: "And the deposit's <em>already paid.</em>" },
    { t0: 14.8, t1: 17.8, html: "So you… <em>take a break.</em> 🧋" },
  ]);
  S.aim(V(0, 2.3, 10.5), V(0, 1.75, 0));
  clock.userData.setTime(13 * 60 + 58 + keys(t, [[0, 0], [2.2, 2], [7.5, 47], [21, 50]]));
  let st = 0; BOARD_AT.forEach((a, i) => { if (t >= a) st = i; });
  boards.forEach((b, i) => { b.visible = i === st; b.scale.setScalar(0.72 * (i === st && i > 0 ? E.back(prog(t, BOARD_AT[i], BOARD_AT[i] + 0.3)) : 1)); });
  const buzz = MSGS.some(([a]) => t > a && t < a + 0.6);
  phone.position.x = -0.4 + (buzz && Math.floor(t * 14) % 2 ? 0.012 : 0);
  screen.material.color.setHex(buzz && Math.floor(t * 6) % 2 === 0 ? 0xffffff : 0xffc4d8);

  // A tumbleweed rolls through while the tech waits.
  const wk = prog(t, 4.6, 7.2);
  weed.visible = wk > 0 && wk < 1;
  weed.position.set(lerp(-2.4, 2.4, wk), 0.55 + Math.abs(Math.sin(wk * 14)) * 0.25, 1.4); weed.rotation.z = -wk * 18;

  // The tech: waiting, bored, then relaxed with a drink.
  const waiting = t > 2.2 && t < 7.9;
  const sip = t > 14.8;
  const cheer = E.back(prog(t, 17.3, 17.5)) * (1 - prog(t, 17.7, 17.8));
  T.pose({ blink: waiting && t > 5 ? 0.45 : blinkAt(t, 0.8), lookX: waiting ? 0.2 : 0.5, lookY: waiting ? -0.5 : 0, mouth: waiting ? "flat" : "smile",
    slump: waiting ? prog(t, 3, 7) : 0, headTilt: waiting ? 0.2 * prog(t, 3, 7) : sip ? -0.1 : 0,
    armL: 0.1 + (sip ? 0.4 : 0) + cheer, armLx: sip ? -1.5 : -0.9, armR: 0.1 + (waiting ? Math.abs(Math.sin(t * 12)) * 0.08 : 0) + cheer, armRx: -0.9 });
  const cp = E.back(prog(t, 14.8, 15.1));
  cup.visible = cp > 0.01; cup.position.set(-0.3, 1.05 + (sip ? 0.25 + Math.max(0, Math.sin(t * 2)) * 0.1 : 0), 0.35); cup.scale.setScalar(1.2 * cp);

  // Pink Lockie with the policy.
  const drop = prog(t, 7.4, 7.75);
  L.root.visible = t > 7.4;
  const landK = t > 7.75 ? Math.exp(-(t - 7.75) * 6) * Math.cos((t - 7.75) * 18) : 0;
  const signUp = E.back(prog(t, 8.0, 8.35)) * (1 - E.inOut(prog(t, 11.2, 11.5)));
  const point = E.back(prog(t, 11.5, 11.8)) * (1 - prog(t, 14.3, 14.6));
  L.root.position.set(0.72, 0.95 + (1 - E.out(drop)) * 3.5, 0.45);
  L.pose({ squash: landK * 0.7, armR: 0.25 + signUp * 1.2, armL: 0.25 + point * 1.3, blink: blinkAt(t, 1.4), lookX: point > 0.3 ? -0.8 : 0.4,
    open: 0.4, mouth: t > 16.3 && t < 17.6 ? "flat" : "smile", shades: false });
  L.shades.visible = t > 15.0;
  poof.position.set(0.72, 1.4, 0.7); poof.userData.at(prog(t, 7.5, 8.3));
  sign.visible = signUp > 0.01;
  sign.position.set(1.0, 1.4, 0.95); sign.scale.setScalar(0.5 * signUp); sign.rotation.z = -0.08 + Math.sin(t * 3) * 0.03;

  // The client finally bursts in, way too late.
  const cin = E.out(prog(t, 16.0, 16.35));
  client.root.visible = t > 16.0;
  client.root.position.set(lerp(3.2, 0.95, cin), cin < 1 ? Math.abs(Math.sin(t * 13)) * 0.2 : 0, 1.0);
  client.pose({ blink: blinkAt(t, 2), lookX: -0.7, mouth: "o", armL: 1.2 + Math.sin(t * 15) * 0.3, armR: 1.2 - Math.sin(t * 15) * 0.3 });

  confetti.position.set(0, 2.2, 0.6); confetti.userData.at(t - 17.3);
  showBubbles(t, bub, S.toScreen);
  outro(t, 17.8, { h: "“5 min away”?<br>Deposit's paid.", p: "Booking + deposits for nail techs,<br>lash artists & beauty pros." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
