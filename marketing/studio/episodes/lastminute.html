<!doctype html><html data-look="blush"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
<style>
  /* Blush palette for beauty episodes. */
  body { background: #fff5f7; color: #3d1f2c; }
  .glow { background: radial-gradient(60% 38% at 82% 8%, rgba(255,150,190,.55), transparent 70%), radial-gradient(55% 35% at 0% 100%, rgba(255,200,220,.6), transparent 70%); }
  #cap { font: 700 84px/1.04 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  em { color: #d63a70; font-style: italic; }
  #foot { color: #a57f8f; }
  .bub { box-shadow: 0 16px 40px -14px rgba(170,60,105,.5); border: 3px solid #f6cfdc; }
  .bub::after { border-right: 3px solid #f6cfdc; border-bottom: 3px solid #f6cfdc; }
  .bub.accent { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; border-color: transparent; } .bub.accent::after { background: #e24f86; border-color: transparent; }
  .bub.dark { background: #3d1f2c; color: #fff5f7; border-color: #3d1f2c; } .bub.dark::after { background: #3d1f2c; border-color: #3d1f2c; }
  .sfx { color: #fff; -webkit-text-stroke: 4px #7a1d45; }
  #outro { background: radial-gradient(60% 40% at 50% 30%, rgba(255,150,190,.55), transparent 70%), #fff5f7; }
  #outro h2 { font: italic 700 100px/1.02 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  #outro p { color: #6e4b5b; }
  #outro .cta { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; }
  #outro .wordmark, #foot .wordmark { color: #3d1f2c; }
</style>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeTech, makeNailTable, makeBlob, makeCoin, makeSign, makeClock, makeJar, makeConfetti, makePoof, blinkAt } from "/kit.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
await document.fonts.load("600 40px 'Fraunces'"); await document.fonts.load("italic 600 40px 'Fraunces'");
const S = setup({ camPos: [0, 2.3, 10.5], look: [0, 1.75, 0], palette: "blush" });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const T = makeTech({ skin: 0xe8b48f, hair: 0x2a1a12, smock: 0xff9ec0 }); T.root.position.set(-0.7, 0, -0.35); S.scene.add(T.root);
const table = makeNailTable(); table.position.set(0, 0, 0.35); S.scene.add(table);
const jar = makeJar("DEPOSITS"); jar.position.set(0.05, 0.95, 0.6); jar.scale.setScalar(0.9); S.scene.add(jar);
const L = makeLockie({ color: 0xff7aa8, feet: 0xe0457f, key: 0x7a1d45 }); L.root.scale.setScalar(0.62); S.scene.add(L.root);
const client = makeBlob(0x8fc1ff, 0.8); S.scene.add(client.root);
const coin = makeCoin(); coin.scale.setScalar(0.6); S.scene.add(coin);
const clock = makeClock(); clock.position.set(1.25, 3.0, -1.2); clock.scale.setScalar(0.7); clock.children[0].material = toon(0xe0457f); S.scene.add(clock);
const poof = makePoof(14, 5); S.scene.add(poof);
const confetti = makeConfetti(90, 29); S.scene.add(confetti);
const PINKS = [0xe0457f, 0xff8fb1, 0xffffff, 0xd7a6ff, 0xffc4d8, 0xf3c6b0];
confetti.children.forEach((m, i) => { m.material = flat(PINKS[i % PINKS.length], { side: THREE.DoubleSide }); });
// The phone buzzing on the table.
const phone = new THREE.Group(); phone.position.set(-0.4, 0.99, 0.6); phone.rotation.x = -Math.PI / 2 + 0.35; S.scene.add(phone);
phone.add(mesh(new RoundedBoxGeometry(0.3, 0.52, 0.05, 3, 0.05), toon(0x3d1f2c), 0.015));
const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.44), flat(0xffd6e5)); screen.position.z = 0.027; phone.add(screen);

const sign = makeSign(["CANCEL", "24H AHEAD"], { w: 1.4, h: 0.9, bg: "#ffffff", color: "#e0457f" }); S.scene.add(sign);
const BOARDS = [[["2:00 PM", "LASH SET · JESS"], "#ffffff", "#3d1f2c"], [["CANCELLED", "INSIDE 24H"], "#3d1f2c", "#ffffff"], [["2:00 PM", "OPEN AGAIN"], "#ffffff", "#3d1f2c"], [["2:00 PM", "BOOKED · MIA"], "#e0457f", "#ffffff"]];
const boards = BOARDS.map(([lines, bg, color]) => { const s = makeSign(lines, { w: 2.1, h: 0.85, bg, color }); s.children[0].visible = false; s.position.set(-0.15, 2.55, -1.4); s.scale.setScalar(0.72); S.scene.add(s); return s; });
const BOARD_AT = [0, 2.4, 12.6, 14.4];

const bub = bubbles([
  { t0: 0.6, t1: 1.3, sfx: true, text: "bzzt!", anchor: () => V(-0.2, 1.3, 0.8), rot: -8 },
  { t0: 1.0, t1: 2.4, text: "hey can't make it today 😅", anchor: () => V(-0.4, 1.2, 0.8), align: 0.3, tail: "30%" },
  { t0: 2.5, t1: 4.9, text: "can i still get my deposit back? 🥺", anchor: () => V(-0.4, 1.2, 0.8), align: 0.3, tail: "30%" },
  { t0: 5.1, t1: 5.8, sfx: true, text: "POOF!", anchor: () => V(0.75, 1.9, 0.8), rot: 8 },
  { t0: 9.4, t1: 10.2, sfx: true, text: "CLINK!", anchor: () => V(0.05, 1.85, 0.9), rot: -6 },
  { t0: 10.2, t1: 11.8, text: "phew 💕", anchor: () => V(-0.25, 2.0, 0.3), align: 0.2, tail: "20%" },
  { t0: 13.4, t1: 14.3, text: "is 2pm free?? 🙏", anchor: () => V(0.95, 1.2, 1.0), align: 0.75, tail: "75%" },
  { t0: 14.4, t1: 15.2, sfx: true, text: "CLICK!", anchor: () => V(0.75, 1.85, 0.8), rot: -6 },
]);

window.DUR = 21.4;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.4, html: "1 hour before a <em>2-hour lash set…</em>" },
    { t0: 2.4, t1: 5.0, html: "“Can I still get my <em>deposit back?</em>” 🥺" },
    { t0: 5.4, t1: 9.2, html: "Your policy was on the page <em>when they booked.</em>" },
    { t0: 9.2, t1: 12.6, html: "Inside the cutoff? <em>The deposit stays with you.</em>" },
    { t0: 12.6, t1: 15.8, html: "And the slot <em>opens back up.</em>" },
    { t0: 15.8, t1: 18.2, html: "Cancelled late? <em>Still paid.</em>" },
  ]);
  S.aim(V(0, 2.3, 10.5), V(0, 1.75, 0));
  clock.userData.setTime(13 * 60 + t * 0.6);
  let st = 0; BOARD_AT.forEach((a, i) => { if (t >= a) st = i; });
  boards.forEach((b, i) => { b.visible = i === st; b.scale.setScalar(0.72 * (i === st && i > 0 ? E.back(prog(t, BOARD_AT[i], BOARD_AT[i] + 0.3)) : 1)); });
  phone.position.x = -0.4 + (t > 0.6 && t < 4.9 && Math.floor(t * 14) % 2 ? 0.012 : 0);
  screen.material.color.setHex(t > 0.6 && t < 4.9 && Math.floor(t * 6) % 2 === 0 ? 0xffffff : 0xffc4d8);

  // The tech: prepped and happy, deflated, then relieved.
  const worried = t > 1.2 && t < 5.4;
  const hug = E.inOut(prog(t, 9.6, 10.0)) * (1 - E.inOut(prog(t, 11.6, 12.0)));
  const cheer = E.back(prog(t, 15.8, 16.1)) * (1 - prog(t, 17.9, 18.2));
  T.pose({ blink: blinkAt(t, 0.8), lookX: worried ? 0.3 : 0.5, lookY: worried ? -0.6 : 0, mouth: worried ? "o" : "smile", sweat: t > 2.6 && t < 5.4, slump: worried ? 0.6 : 0,
    armL: 0.1 + cheer * 2.5, armLx: cheer > 0.1 ? 0 : -0.9, armR: 0.1 + cheer * 2.5 + hug * 0.2, armRx: cheer > 0.1 ? 0 : -0.9 - hug * 0.3 });
  jar.userData.fill(t < 14.1 ? 1 : 2);
  const bounce = t > 9.4 ? Math.exp(-(t - 9.4) * 6) * Math.abs(Math.sin((t - 9.4) * 16)) : 0;
  jar.position.y = 0.95 + bounce * 0.15; jar.scale.setScalar(0.9 * (1 + bounce * 0.1));

  // Pink Lockie drops in with the policy.
  const drop = prog(t, 4.9, 5.25);
  L.root.visible = t > 4.9;
  const landK = t > 5.25 ? Math.exp(-(t - 5.25) * 6) * Math.cos((t - 5.25) * 18) : 0;
  const signUp = E.back(prog(t, 5.6, 5.95)) * (1 - E.inOut(prog(t, 9.0, 9.3)));
  const point = E.back(prog(t, 9.2, 9.5)) * (1 - prog(t, 11.8, 12.1));
  const click = t > 14.4 ? Math.exp(-(t - 14.4) * 7) : 0;
  const dance = prog(t, 15.8, 16.0) * (1 - prog(t, 18.0, 18.2));
  L.root.position.set(0.72, 0.95 + (1 - E.out(drop)) * 3.5 + dance * Math.abs(Math.sin(t * 9)) * 0.2, 0.45);
  L.pose({ squash: landK * 0.7 + click * 0.5, open: t < 14.4 ? 1 : 1 - E.out(prog(t, 14.4, 14.55)), tilt: dance * Math.sin(t * 9) * 0.15,
    armR: 0.25 + signUp * 1.2 + dance * 2, armL: 0.25 + point * 1.3 + dance * 2, blink: blinkAt(t, 1.4), lookX: point > 0.3 ? -0.8 : 0.4, mouth: click > 0.3 ? "o" : "smile" });
  poof.position.set(0.72, 1.4, 0.7); poof.userData.at(prog(t, 5.0, 5.8));
  sign.visible = signUp > 0.01;
  sign.position.set(1.0, 1.4, 0.95); sign.scale.setScalar(0.5 * signUp); sign.rotation.z = -0.08 + Math.sin(t * 3) * 0.03;

  // Someone else grabs the freed 2pm and sends a deposit.
  const cin = E.out(prog(t, 12.9, 13.3));
  client.root.visible = t > 12.9;
  client.root.position.set(lerp(3.2, 0.95, cin), (cin < 1 || dance > 0) ? Math.abs(Math.sin(t * 11)) * 0.14 : 0, 1.0);
  client.pose({ blink: blinkAt(t, 2.3), lookX: -0.7, armL: t > 13.8 && t < 14.2 ? 1.5 : 0.3 + dance * 1.5, armR: 0.3 + dance * 1.5 });
  const ck = prog(t, 13.7, 14.1);
  coin.visible = ck > 0 && ck < 1;
  coin.position.set(lerp(0.8, 0.05, ck), lerp(1.0, 1.35, ck) + Math.sin(ck * Math.PI) * 0.9, lerp(1.0, 0.55, ck)); coin.rotation.y = ck * 16;

  confetti.position.set(0, 2.2, 0.6); confetti.userData.at(t - 15.8);
  showBubbles(t, bub, S.toScreen);
  outro(t, 18.2, { h: "Cancel late?<br>Deposit stays.", p: "Booking + deposits for nail techs,<br>lash artists & beauty pros." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
