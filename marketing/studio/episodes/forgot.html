<!doctype html><html data-look="blush"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
<style>
  /* Blush palette for beauty episodes. */
  body { background: #fff5f7; color: #3d1f2c; }
  .glow { background: radial-gradient(60% 38% at 82% 8%, rgba(255,150,190,.55), transparent 70%), radial-gradient(55% 35% at 0% 100%, rgba(255,200,220,.6), transparent 70%); }
  #cap { font: 700 84px/1.04 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  em { color: #d63a70; font-style: italic; }
  #foot { color: #a57f8f; }
  .bub { box-shadow: 0 16px 40px -14px rgba(170,60,105,.5); border: 3px solid #f6cfdc; }
  .bub::after { border-right: 3px solid #f6cfdc; border-bottom: 3px solid #f6cfdc; }
  .bub.accent { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; border-color: transparent; } .bub.accent::after { background: #e24f86; border-color: transparent; }
  .bub.dark { background: #3d1f2c; color: #fff5f7; border-color: #3d1f2c; } .bub.dark::after { background: #3d1f2c; border-color: #3d1f2c; }
  .sfx { color: #fff; -webkit-text-stroke: 4px #7a1d45; }
  #outro { background: radial-gradient(60% 40% at 50% 30%, rgba(255,150,190,.55), transparent 70%), #fff5f7; }
  #outro h2 { font: italic 700 100px/1.02 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  #outro p { color: #6e4b5b; }
  #outro .cta { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; }
  #outro .wordmark, #foot .wordmark { color: #3d1f2c; }
  #vhs { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; background: repeating-linear-gradient(0deg, rgba(61,31,44,.14) 0 3px, transparent 3px 7px); }
</style>
</head><body><div id="gl"></div><div id="vhs"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeTech, makeNailTable, makeBlob, makeSign, makeClock, makeJar, makePhone, makeLabel, makeConfetti, makePoof, blinkAt } from "/kit.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
await document.fonts.load("600 40px 'Fraunces'"); await document.fonts.load("italic 600 40px 'Fraunces'");
const S = setup({ camPos: [0, 2.3, 10.5], look: [0, 1.75, 0], palette: "blush" });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const T = makeTech({ skin: 0xe8b48f, hair: 0x2a1a12, smock: 0xff9ec0 }); T.root.position.set(-0.7, 0, -0.35); S.scene.add(T.root);
const table = makeNailTable(); table.position.set(0, 0, 0.35); S.scene.add(table);
const jar = makeJar("DEPOSITS"); jar.position.set(0.05, 0.95, 0.6); jar.scale.setScalar(0.9); jar.userData.fill(3); S.scene.add(jar);
const L = makeLockie({ color: 0xff7aa8, feet: 0xe0457f, key: 0x7a1d45 }); L.root.scale.setScalar(0.62); S.scene.add(L.root);
const client = makeBlob(0xd7a6ff, 0.8); S.scene.add(client.root);
const clock = makeClock(); clock.position.set(1.25, 3.0, -1.2); clock.scale.setScalar(0.7); clock.children[0].material = toon(0xe0457f); S.scene.add(clock);
const dayLbl = [makeLabel(["TODAY"], { w: 0.9, h: 0.24, bg: null, color: "#a57f8f" }), makeLabel(["YESTERDAY"], { w: 0.9, h: 0.24, bg: null, color: "#e0457f" })];
dayLbl.forEach((d) => { d.position.set(1.25, 2.4, -1.2); S.scene.add(d); });
const poof = makePoof(14, 61); S.scene.add(poof);
const confetti = makeConfetti(90, 63); S.scene.add(confetti);
const PINKS = [0xe0457f, 0xff8fb1, 0xffffff, 0xd7a6ff, 0xffc4d8, 0xf3c6b0];
confetti.children.forEach((m, i) => { m.material = flat(PINKS[i % PINKS.length], { side: THREE.DoubleSide }); });
// The tech's phone on the table.
const tphone = new THREE.Group(); tphone.position.set(-0.4, 0.99, 0.6); tphone.rotation.x = -Math.PI / 2 + 0.35; S.scene.add(tphone);
tphone.add(mesh(new RoundedBoxGeometry(0.3, 0.52, 0.05, 3, 0.05), toon(0x3d1f2c), 0.015));
const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.44), flat(0xffd6e5)); screen.position.z = 0.027; tphone.add(screen);
// The client's phone with the reminder.
const cphone = makePhone([{ lines: ["REMINDER", "LASH FILL", "TMRW 2 PM"], bg: "#ffffff", color: "#e0457f" }]); S.scene.add(cphone);
const sign = makeSign(["REMINDER", "THE DAY BEFORE"], { w: 1.6, h: 0.9, bg: "#ffffff", color: "#e0457f" }); S.scene.add(sign);

const bub = bubbles([
  { t0: 2.0, t1: 2.7, sfx: true, text: "bzzt!", anchor: () => V(-0.2, 1.3, 0.8), rot: -8 },
  { t0: 2.4, t1: 4.6, text: "omg i totally forgot 😭 tmrw??", anchor: () => V(-0.4, 1.2, 0.8), align: 0.3, tail: "30%" },
  { t0: 4.7, t1: 5.6, sfx: true, text: "⏪ REWIND", anchor: () => V(0, 2.4, 0.5), rot: -4 },
  { t0: 6.0, t1: 6.7, sfx: true, text: "POOF!", anchor: () => V(0.75, 1.9, 0.8), rot: 8 },
  { t0: 9.0, t1: 10.5, text: "omg i would've 100% forgotten 🥹", anchor: () => V(0.95, 1.25, 1.0), align: 0.75, tail: "75%" },
  { t0: 11.6, t1: 12.4, sfx: true, text: "DING-DONG!", anchor: () => V(0.95, 1.9, 1.0), rot: -6 },
  { t0: 12.5, t1: 14.2, text: "hiii 💅 right on time", anchor: () => V(0.95, 1.25, 1.0), align: 0.75, tail: "75%" },
]);

window.DUR = 18.8;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.4, html: "2:00 PM. Lash fill. <em>Nobody.</em>" },
    { t0: 2.4, t1: 4.7, html: "“omg I <em>totally forgot</em>” 😭" },
    { t0: 5.6, t1: 8.0, html: "Rewind. <em>With Slotlock…</em>" },
    { t0: 8.0, t1: 11.2, html: "They get a reminder email <em>the day before.</em>" },
    { t0: 11.4, t1: 15.6, html: "2:00 PM. <em>Right on time.</em> 💕" },
  ]);
  const rw = prog(t, 4.7, 5.6);
  const shake = rw > 0 && rw < 1 ? Math.sin(t * 50) * 0.04 : 0;
  S.aim(V(shake, 2.3, 10.5), V(shake, 1.75, 0));
  document.getElementById("vhs").style.opacity = rw > 0 && rw < 1 ? 1 : 0;
  document.getElementById("gl").style.filter = rw > 0 && rw < 1 ? "saturate(1.6) hue-rotate(" + Math.round(Math.sin(t * 30) * 12) + "deg) contrast(1.1)" : "none";
  // 2:00 → 2:40, rewind to 2:00 yesterday, then forward to 1:58 today.
  clock.userData.setTime(14 * 60 + keys(t, [[0, 0], [2.4, 40], [4.7, 40], [5.6, 0], [10.6, 2], [11.4, -2], [20, 0]]) + (t > 5.6 && t < 10.6 ? 0 : 0));
  dayLbl[0].visible = t < 5.1 || t > 11.0; dayLbl[1].visible = !dayLbl[0].visible;

  // The tech: waiting, stood up, then thrilled.
  const alone = t < 5.2;
  const cheer = E.back(prog(t, 12.4, 12.7)) * (1 - prog(t, 15.3, 15.6));
  T.pose({ blink: blinkAt(t, 0.8), lookX: alone ? (t > 2.4 ? 0.3 : 0.7) : 0.5, lookY: t > 2.4 && alone ? -0.6 : 0, mouth: t > 2.6 && alone ? "o" : "smile",
    sweat: t > 3.0 && alone, slump: t > 2.6 && alone ? 0.6 : 0, armL: 0.1 + cheer * 2.5, armLx: cheer > 0.1 ? 0 : -0.9, armR: 0.1 + cheer * 2.5, armRx: cheer > 0.1 ? 0 : -0.9 });
  tphone.position.x = -0.4 + (t > 2.0 && t < 4.6 && Math.floor(t * 14) % 2 ? 0.012 : 0);
  screen.material.color.setHex(t > 2.0 && t < 4.6 && Math.floor(t * 6) % 2 === 0 ? 0xffffff : 0xffc4d8);

  // Pink Lockie: the reminder rule.
  const drop = prog(t, 5.9, 6.25);
  L.root.visible = t > 5.9;
  const landK = t > 6.25 ? Math.exp(-(t - 6.25) * 6) * Math.cos((t - 6.25) * 18) : 0;
  const signUp = E.back(prog(t, 6.5, 6.85)) * (1 - E.inOut(prog(t, 8.2, 8.5)));
  const point = E.back(prog(t, 8.5, 8.8)) * (1 - prog(t, 10.4, 10.7));
  const dance = prog(t, 12.4, 12.6) * (1 - prog(t, 15.4, 15.6));
  L.root.position.set(0.72, 0.95 + (1 - E.out(drop)) * 3.5 + dance * Math.abs(Math.sin(t * 9)) * 0.2, 0.45);
  L.pose({ squash: landK * 0.7, open: 0, armR: 0.25 + signUp * 1.2 + point * 1.4 + dance * 2, armL: 0.25 + dance * 2, blink: blinkAt(t, 1.4), lookX: 0.5, tilt: dance * Math.sin(t * 9) * 0.15 });
  poof.position.set(0.72, 1.4, 0.7); poof.userData.at(prog(t, 6.0, 6.8));
  sign.visible = signUp > 0.01;
  sign.position.set(1.0, 1.4, 0.95); sign.scale.setScalar(0.5 * signUp); sign.rotation.z = -0.08 + Math.sin(t * 3) * 0.03;

  // The client: gets the reminder (yesterday), then shows up on time (today).
  const in1 = E.out(prog(t, 7.9, 8.3)), out1 = E.inOut(prog(t, 10.5, 10.9)), in2 = E.out(prog(t, 11.3, 11.7));
  client.root.visible = (t > 7.9 && out1 < 1) || t > 11.3;
  let cx = lerp(3.2, 0.85, in1) + out1 * 2.3; if (t > 11.3) cx = lerp(3.2, 0.85, in2);
  const moving = (in1 > 0 && in1 < 1) || (out1 > 0 && out1 < 1) || (in2 > 0 && in2 < 1);
  client.root.position.set(cx, (moving ? Math.abs(Math.sin(t * 11)) * 0.14 : 0) + dance * Math.abs(Math.sin(t * 9 + 1)) * 0.14, 1.0);
  client.pose({ blink: blinkAt(t, 2.3), lookX: t < 10.5 ? 0.2 : -0.7, lookY: t > 8.4 && t < 10.5 ? 0.6 : 0, mouth: "smile", armL: 0.3 + (t > 8.4 && t < 10.5 ? 1.2 : 0) + dance * 1.5, armR: 0.3 + dance * 1.5 });
  const pk = E.out(prog(t, 8.4, 8.7)) * (1 - prog(t, 10.3, 10.5));
  cphone.visible = pk > 0.01; cphone.position.set(0.8, 1.8, 1.3); cphone.scale.setScalar(1.15 * pk); cphone.rotation.set(-0.1, -0.25, 0);

  confetti.position.set(0, 1.4, 0.6); confetti.userData.at(t - 12.5);
  showBubbles(t, bub, S.toScreen);
  outro(t, 15.6, { h: "They forget.<br>Slotlock doesn't.", p: "Booking + deposits for nail techs,<br>lash artists & beauty pros." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
