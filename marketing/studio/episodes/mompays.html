<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeArtist, makeBlob, makeCoin, makeJar, makePhone, makeHeart, makeShoppingBag, makeConfetti, makePoof, blinkAt } from "/kit.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
const S = setup({ camPos: [0, 2.6, 13], look: [0, 1.95, 0] });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const A = makeArtist(); A.root.position.set(-1.25, 0, 0.1); S.scene.add(A.root);
// The tough client: shades and a spiky collar.
const K = makeBlob(0x7a7f8f, 0.85); S.scene.add(K.root);
const kShades = new THREE.Group(); kShades.position.set(0, 0.6, 0.47); K.body.add(kShades);
for (const s of [-1, 1]) { const l = mesh(new THREE.BoxGeometry(0.24, 0.12, 0.04), flat(0x111111), 0.01); l.position.x = s * 0.14; kShades.add(l); }
for (let i = 0; i < 7; i++) { const a = (i / 6 - 0.5) * 2.2; const sp = mesh(new THREE.ConeGeometry(0.05, 0.14, 8), toon(0xd9d2c8), 0.008); sp.position.set(Math.sin(a) * 0.47, 0.22, Math.cos(a) * 0.47); sp.rotation.x = Math.PI / 2; sp.rotation.z = -a; sp.lookAt(Math.sin(a) * 2, 0.22, Math.cos(a) * 2); sp.rotateX(Math.PI / 2); K.body.add(sp); }
// Mom: reading glasses and a handbag.
const M = makeBlob(0xffc4d8, 0.8); S.scene.add(M.root);
for (const s of [-1, 1]) { const g = mesh(new THREE.TorusGeometry(0.1, 0.018, 8, 20), toon(0xc9a24a), 0.006); g.position.set(s * 0.15, 0.6, 0.48); M.body.add(g); }
const bag = makeShoppingBag(0xe0457f); bag.scale.setScalar(0.6); bag.position.set(0.42, 0.0, 0.45); M.root.add(bag);
const L = makeLockie(); L.root.scale.setScalar(0.7); S.scene.add(L.root);
const cookie = mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.05, 20), toon(0xc98a4a), 0.008); cookie.rotation.x = Math.PI / 2; S.scene.add(cookie);
const jar = makeJar("DEPOSITS"); jar.position.set(-1.35, 0, 1.5); jar.scale.setScalar(0.7); jar.userData.fill(2); S.scene.add(jar);
const phone = makePhone([{ lines: ["$80", "DEPOSIT"] }, { lines: ["VENMO", "@artist"] }, { lines: ["SENT", "✓"], bg: "#e6fff1", color: "#128a52" }]); S.scene.add(phone);
const coin = makeCoin(); coin.scale.setScalar(0.7); S.scene.add(coin);
const hearts = [0, 1, 2, 3, 4].map(() => { const h = makeHeart(0xff4d6d); h.scale.setScalar(0.2); S.scene.add(h); return h; });
const poof = makePoof(14, 151); S.scene.add(poof);
const confetti = makeConfetti(90, 153); S.scene.add(confetti);
const KX = 0.5, MX = 1.22;

const bub = bubbles([
  { t0: 0.5, t1: 1.9, text: "giant skull. full sleeve. 💀", anchor: () => V(KX, 1.4, 0.8), align: 0.6, tail: "60%" },
  { t0: 1.9, t1: 2.8, text: "my mom's paying 😇", anchor: () => V(KX, 1.4, 0.8), align: 0.6, tail: "60%" },
  { t0: 2.9, t1: 4.0, text: "hi sweetie! where do i send it? 👓", anchor: () => V(MX, 1.3, 0.9), align: 0.8, tail: "80%" },
  { t0: 4.0, t1: 5.2, text: "do i press the blue one??", anchor: () => V(MX, 1.3, 0.9), align: 0.8, tail: "80%" },
  { t0: 5.3, t1: 6.0, sfx: true, text: "POOF!", anchor: () => V(-0.4, 1.9, 1.2), rot: 8 },
  { t0: 10.9, t1: 11.6, sfx: true, text: "CLICK!", anchor: () => V(-0.4, 1.9, 1.2), rot: -6 },
  { t0: 11.6, t1: 13.0, text: "a cookie for the nice lock 🍪", anchor: () => V(MX, 1.3, 0.9), align: 0.8, tail: "80%" },
  { t0: 13.1, t1: 15.0, text: "thanks mom 🥹💀", anchor: () => V(KX, 1.4, 0.8), align: 0.6, tail: "60%" },
]);

window.DUR = 18.8;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.8, html: "Giant skull tattoo. 💀 <em>“My mom's paying.”</em>" },
    { t0: 2.8, t1: 5.3, html: "Mom has <em>questions.</em> 👓" },
    { t0: 5.5, t1: 8.6, html: "One link. <em>Even mom gets it.</em>" },
    { t0: 8.6, t1: 11.6, html: "Deposit sent <em>straight to the artist.</em>" },
    { t0: 11.6, t1: 15.6, html: "Booked. <em>Thanks, mom.</em> 💀💕" },
  ]);
  S.aim(V(0, 2.6, 13), V(0, 1.95, 0));

  const kin = E.out(prog(t, 0.1, 0.6)), min = E.out(prog(t, 2.6, 3.1));
  const hug = E.inOut(prog(t, 13.0, 13.4)) * (1 - E.inOut(prog(t, 15.0, 15.4)));
  K.root.position.set(lerp(3.2, KX, kin) + hug * 0.25, kin < 1 ? Math.abs(Math.sin(t * 11)) * 0.15 : 0, 0.8);
  K.pose({ blink: blinkAt(t, 1.7), lookX: t > 2.8 ? 0.6 : -0.6, mouth: "smile", armL: 0.3 + hug * 1.6, armR: 0.3 + (t < 1.9 ? 1.6 : 0) + hug * 1.6 });
  M.root.visible = t > 2.6;
  M.root.position.set(lerp(3.2, MX, min) - hug * 0.15, min < 1 ? Math.abs(Math.sin(t * 11)) * 0.12 : 0, 0.9);
  const squint = t > 3.0 && t < 5.4;
  M.pose({ blink: squint ? 0.55 : blinkAt(t, 2.1), lookX: -0.6, mouth: squint ? "o" : "smile", armL: 0.3 + (t > 3.0 && t < 10.9 ? 1.2 : 0) + hug * 1.6, armR: 0.3 + (t > 11.6 && t < 12.6 ? 1.5 : 0) + hug * 1.6 });
  // Mom's phone: held at arm's length while she squints, then sent.
  const pk = E.out(prog(t, 3.0, 3.3)) * (1 - prog(t, 10.6, 10.9));
  const far = t < 5.4 ? 0.35 + Math.sin(t * 2) * 0.08 : 0;
  phone.visible = pk > 0.01; phone.position.set(MX - 0.6 - far * 0.3, 1.9 + far, 1.2); phone.scale.setScalar((t < 5.4 ? 0.8 : 1.25) * pk); phone.rotation.set(-0.1, -0.2, 0);
  phone.userData.show(t < 9.0 ? 0 : t < 9.8 ? 1 : 2);
  const ck = prog(t, 9.9, 10.5);
  coin.visible = ck > 0 && ck < 1;
  coin.position.set(lerp(0.8, -1.35, ck), lerp(1.5, 0.7, ck) + Math.sin(ck * Math.PI) * 1.3, lerp(1.1, 1.5, ck)); coin.rotation.y = ck * 16;
  jar.userData.fill(t < 10.5 ? 2 : 3);
  const kk = prog(t, 12.0, 12.5);
  cookie.visible = kk > 0 && t < 15.4;
  cookie.position.set(lerp(MX - 0.4, -0.1, Math.min(1, kk)), lerp(0.9, 1.2, Math.min(1, kk)) + Math.sin(Math.min(1, kk) * Math.PI) * 0.5, 1.5);
  hearts.forEach((h, i) => { const k = prog(t, 13.2 + i * 0.3, 14.8 + i * 0.3); h.visible = k > 0 && k < 1; h.position.set((KX + MX) / 2 - 0.1 + Math.sin(k * 6 + i) * 0.25, 1.3 + k * 1.8, 1.0); h.scale.setScalar(0.2 * (1 - k * 0.4)); });

  // The artist: amused, then cheering.
  const cheer = E.back(prog(t, 13.1, 13.4)) * (1 - prog(t, 15.3, 15.6));
  A.pose({ blink: blinkAt(t, 0.6), mouth: "smile", lookX: 0.8, headTilt: t > 1.9 && t < 5.3 ? -0.12 : 0, armL: 0.15 + cheer * 2.4, armR: 0.15 + cheer * 2.4 });

  // Lockie points mom to the right button and locks the booking.
  const drop = prog(t, 5.1, 5.45);
  L.root.visible = t > 5.1;
  const landK = t > 5.45 ? Math.exp(-(t - 5.45) * 6) * Math.cos((t - 5.45) * 18) : 0;
  const point = E.back(prog(t, 5.8, 6.1)) * (1 - prog(t, 9.6, 9.9));
  const click = t > 10.9 ? Math.exp(-(t - 10.9) * 7) : 0;
  const party = prog(t, 13.1, 13.3) * (1 - prog(t, 15.3, 15.5));
  L.root.position.set(-0.4, (1 - E.out(drop)) * 4.5 + party * Math.abs(Math.sin(t * 9 + 1)) * 0.18, 1.0);
  L.pose({ squash: landK * 0.8 + click * 0.5, open: t < 10.9 ? 1 : 1 - E.out(prog(t, 10.9, 11.05)), armR: 0.25 + point * 1.6 + party * 2, armL: 0.25 + (kk > 0.9 && t < 15 ? 1.4 : 0) + party * 2,
    lookX: 0.6, lookY: point > 0.3 ? 0.5 : 0, blink: blinkAt(t, 1.2), mouth: click > 0.3 ? "o" : "smile", tilt: party * Math.sin(t * 9) * 0.15 });
  poof.position.set(-0.4, 1.0, 1.3); poof.userData.at(prog(t, 5.2, 6.0));

  confetti.position.set(0.3, 1.6, 0.6); confetti.userData.at(t - 13.1);
  showBubbles(t, bub, S.toScreen);
  outro(t, 15.6, { h: "Anyone can pay.<br>Everyone pays first.", p: "Booking + deposits for tattoo artists.<br>Free for founding artists." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
