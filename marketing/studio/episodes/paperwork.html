<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, textTexture, makeLockie, makeArtist, makeBlob, makePhone, makeConfetti, blinkAt, rng, BLOB_COLORS } from "/kit.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
const S = setup({ camPos: [0, 2.6, 13], look: [0, 1.95, 0] });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const A = makeArtist(); A.root.position.set(-1.0, 0, 0.1); S.scene.add(A.root);
const client = makeBlob(BLOB_COLORS[2], 0.9); client.root.position.set(1.35, 0, 0.6); S.scene.add(client.root);
const L = makeLockie(); S.scene.add(L.root);
const confetti = makeConfetti(90, 14); S.scene.add(confetti);
// The client's phone with the consent form, and the artist's copy of the signed record.
const cPhone = makePhone([{ lines: ["SIGN", "HERE"] }, { lines: ["SIGNED", "✓"], bg: "#e6fff1", color: "#128a52" }]); S.scene.add(cPhone);
const aPhone = makePhone([{ lines: ["JESS", "SIGNED"], bg: "#e6fff1", color: "#128a52" }]); S.scene.add(aPhone);

// The paper storm: sheets with ruled lines swirl around, then pile up on the artist.
const sheetTex = (() => { const c = document.createElement("canvas"); c.width = 128; c.height = 170; const g = c.getContext("2d");
  g.fillStyle = "#fffdf6"; g.fillRect(0, 0, 128, 170); g.fillStyle = "#1a0905"; g.font = "900 20px 'Bricolage Grotesque'"; g.fillText("CONSENT", 14, 28);
  g.fillStyle = "#c9c2b6"; for (let i = 0; i < 8; i++) g.fillRect(14, 46 + i * 13, 100 - (i % 3) * 18, 4);
  g.strokeStyle = "#1a0905"; g.lineWidth = 2; g.strokeRect(14, 150, 12, 12); g.fillStyle = "#8a7f72"; g.fillRect(34, 156, 70, 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const r = rng(31);
const sheets = Array.from({ length: 34 }, (_, i) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.56), new THREE.MeshBasicMaterial({ map: sheetTex, side: THREE.DoubleSide }));
  S.scene.add(m);
  return { m, t0: 0.4 + i * 0.16, a: r() * Math.PI * 2, rad: 0.5 + r() * 1.3, h: 0.6 + r() * 2.6, spin: (r() - 0.5) * 6, px: -1.2 + (r() - 0.5) * 1.2, py: 0.2 + (i / 34) * 1.5, pz: 0.5 + r() * 0.4, rz: (r() - 0.5) * 1.2, wx: 4 + r() * 3, wy: r() * 2 };
});
// The heap growing around the artist.
const heap = mesh(new THREE.SphereGeometry(1, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), toon(0xfffdf6), 0.03); S.scene.add(heap);
const coffee = mesh(new THREE.CylinderGeometry(0.1, 0.085, 0.22, 16), toon(0xffffff), 0.015); S.scene.add(coffee);
const spill = new THREE.Mesh(new THREE.CircleGeometry(0.3, 24), flat(0x7a4a28)); spill.rotation.x = -Math.PI / 2; S.scene.add(spill);

const bub = bubbles([
  { t0: 2.4, t1: 3.9, text: "who has a pen??", anchor: () => V(-1.0, 2.5, 0.1), align: 0.25, tail: "25%" },
  { t0: 3.6, t1: 5.2, text: "which box do i sign 😵‍💫", anchor: () => V(1.35, 1.25, 0.6), align: 0.75, tail: "75%" },
  { t0: 4.9, t1: 5.8, sfx: true, text: "SPLASH!", anchor: () => V(0.2, 0.9, 1.0), rot: -8 },
  { t0: 5.8, t1: 6.6, sfx: true, text: "WHOOSH!", anchor: () => V(-0.2, 2.4, 0.6), rot: 6 },
  { t0: 6.7, t1: 7.5, sfx: true, text: "POP!", anchor: () => V(0.0, 1.6, 0.9), rot: -6 },
  { t0: 9.0, t1: 9.8, sfx: true, text: "TAP!", anchor: () => V(1.25, 2.0, 0.9), rot: 8 },
  { t0: 12.0, t1: 12.8, sfx: true, text: "CLICK!", anchor: () => V(0.1, 2.3, 0.7), rot: -6 },
  { t0: 12.6, t1: 14.2, text: "wait… it's already signed? 🥹", anchor: () => V(-1.0, 2.55, 0.1), align: 0.25, tail: "25%" },
]);

window.DUR = 21.4;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.2, html: "POV: consent forms, <em>the paper way</em> 📋" },
    { t0: 2.2, t1: 6.6, html: "No pen. Wrong box. <em>Coffee on page 3.</em>" },
    { t0: 6.7, t1: 10.4, html: "Slotlock sends the form <em>to their phone.</em>" },
    { t0: 10.4, t1: 15.4, html: "Signed before they sit down. <em>Record saved.</em>" },
    { t0: 15.4, t1: 18.3, html: "Paper cuts? <em>Not today.</em>" },
  ]);
  const shake = t > 4.9 && t < 6.6 ? Math.sin(t * 45) * 0.03 : 0;
  S.aim(V(shake, 2.6 + shake, 13), V(0, 1.95, 0));

  // Paper: swirl in, pile on the artist, then get blown away when the phone is signed.
  const blow = prog(t, 9.1, 10.3);
  sheets.forEach((s, i) => {
    const k = prog(t, s.t0, s.t0 + 1.4);
    s.m.visible = t > s.t0 && blow < 1;
    const a = s.a + t * 1.6, sw = 1 - E.inOut(k);
    let x = lerp(s.px, 0.3 + Math.cos(a) * s.rad, sw), y = lerp(s.py, s.h, sw), z = lerp(s.pz, 0.6 + Math.sin(a) * 0.4, sw);
    let rx = lerp(-1.3, s.spin * t, sw), rz = lerp(s.rz, s.spin * t * 0.7, sw);
    if (blow > 0) { const b = blow * blow; x += s.wx * b; y += s.wy * b + Math.sin(t * 9 + i) * 0.2 * b; rz += 8 * b; }
    s.m.position.set(x, y, z); s.m.rotation.set(rx, 0, rz);
  });
  const hk = E.out(prog(t, 2.2, 6.4)) * (1 - E.inOut(prog(t, 9.2, 10.0)));
  heap.visible = hk > 0.01; heap.position.set(-0.95, 0, 0.35); heap.scale.set(1.05 * hk + 0.01, 1.35 * hk + 0.01, 0.8 * hk + 0.01);
  const tip = E.out(prog(t, 4.85, 5.1));
  coffee.visible = t > 1.5 && t < 10; coffee.scale.setScalar(1.8); coffee.position.set(0.05, 0.2 - tip * 0.08, 1.3); coffee.rotation.z = tip * 1.5;
  spill.visible = t > 4.9 && t < 10; spill.position.set(0.45, 0.006, 1.3); spill.scale.set(1.8 * E.out(prog(t, 4.9, 5.4)), 1.2 * E.out(prog(t, 4.9, 5.4)), 1);

  // The artist: frazzled, buried, freed, delighted.
  const buried = t > 5.6 && t < 9.4;
  const cheer = E.back(prog(t, 15.4, 15.7)) * (1 - prog(t, 18.0, 18.3));
  A.root.position.y = buried ? -0.6 * E.inOut(prog(t, 5.6, 6.2)) : t > 9.4 ? -0.6 * (1 - E.out(prog(t, 9.4, 9.9))) : 0;
  const checking = t > 11.3 && t < 15.3;
  A.pose({ blink: blinkAt(t, 0.5), mouth: t > 2.2 && t < 10 ? "o" : "smile", lookX: t < 2.2 ? 0.2 : checking ? 0.2 : 0.7, lookY: checking ? -0.5 : 0,
    headTilt: t > 2.2 && t < 5.6 ? Math.sin(t * 8) * 0.08 : 0, armL: 0.15 + cheer * 2.4 + (t > 2.2 && t < 5.6 ? 1.3 + Math.sin(t * 10) * 0.4 : 0), armR: 0.15 + cheer * 2.4, armLx: checking ? -1.2 : 0 });
  const ap = E.out(prog(t, 11.3, 11.6)) * (1 - prog(t, 15.0, 15.3));
  aPhone.visible = ap > 0.01; aPhone.position.set(-0.8, 1.05, 1.0); aPhone.scale.setScalar(1.35 * ap); aPhone.rotation.set(-0.1, 0.2, 0);

  // Lockie pops out of the heap and hands the client a phone.
  const pop = prog(t, 6.6, 7.3);
  L.root.visible = t > 6.6;
  const hand = E.inOut(prog(t, 7.4, 8.0));
  const click = t > 12.0 ? Math.exp(-(t - 12.0) * 7) : 0;
  const dance = prog(t, 15.4, 15.6) * (1 - prog(t, 18.1, 18.3));
  L.root.position.set(lerp(-0.6, 0.05, E.out(pop)), (t < 7.3 ? Math.sin(pop * Math.PI) * 2.0 : 0) + dance * Math.abs(Math.sin(t * 9)) * 0.22, 0.6);
  L.pose({ squash: click * 0.5 + (t > 7.3 ? Math.exp(-(t - 7.3) * 6) * Math.cos((t - 7.3) * 18) * 0.6 : 0), open: t < 12 ? 1 : 1 - E.out(prog(t, 12.0, 12.15)),
    armR: 0.25 + hand * (1 - prog(t, 8.3, 8.6)) * 1.4 + dance * 2, armL: 0.25 + dance * 2, tilt: t < 7.3 ? (1 - pop) * 2 : dance * Math.sin(t * 9) * 0.15,
    blink: blinkAt(t, 1.2), lookX: t > 7.3 && t < 11 ? 0.8 : -0.4, mouth: click > 0.3 ? "o" : "smile" });

  // The client: confused, then taps to sign on the phone.
  const signed = t > 9.0;
  client.root.position.y = Math.abs(Math.sin(t * 3)) * 0.03;
  client.pose({ blink: blinkAt(t, 2), lookX: -0.7, mouth: t > 3.4 && t < 7.4 ? "o" : "smile", armL: t > 8.2 && t < 9.4 ? 1.1 + (t > 8.8 && t < 9.1 ? 0.4 : 0) : 0.3 });
  const cp = E.out(prog(t, 7.6, 8.1)) * (1 - prog(t, 10.6, 11.0));
  cPhone.visible = cp > 0.01; cPhone.position.set(lerp(0.6, 1.1, cp), 1.4, 1.1); cPhone.scale.setScalar(1.3 * cp); cPhone.rotation.set(-0.1, -0.2, 0);
  cPhone.userData.show(signed ? 1 : 0);

  confetti.position.set(0, 2.3, 0.4); confetti.userData.at(t - 15.4);
  showBubbles(t, bub, S.toScreen);
  outro(t, 18.3, { h: "Sign here.<br>(on your phone)", p: "Booking + deposits for tattoo artists.<br>Free for founding artists." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
