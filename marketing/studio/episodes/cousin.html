<!doctype html><html data-look="blush"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
<style>
  /* Blush palette for beauty episodes. */
  body { background: #fff5f7; color: #3d1f2c; }
  .glow { background: radial-gradient(60% 38% at 82% 8%, rgba(255,150,190,.55), transparent 70%), radial-gradient(55% 35% at 0% 100%, rgba(255,200,220,.6), transparent 70%); }
  #cap { font: 700 84px/1.04 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  em { color: #d63a70; font-style: italic; }
  #foot { color: #a57f8f; }
  .bub { box-shadow: 0 16px 40px -14px rgba(170,60,105,.5); border: 3px solid #f6cfdc; }
  .bub::after { border-right: 3px solid #f6cfdc; border-bottom: 3px solid #f6cfdc; }
  .bub.accent { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; border-color: transparent; } .bub.accent::after { background: #e24f86; border-color: transparent; }
  .bub.dark { background: #3d1f2c; color: #fff5f7; border-color: #3d1f2c; } .bub.dark::after { background: #3d1f2c; border-color: #3d1f2c; }
  .sfx { color: #fff; -webkit-text-stroke: 4px #7a1d45; }
  #outro { background: radial-gradient(60% 40% at 50% 30%, rgba(255,150,190,.55), transparent 70%), #fff5f7; }
  #outro h2 { font: italic 700 100px/1.02 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  #outro p { color: #6e4b5b; }
  #outro .cta { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; }
  #outro .wordmark, #foot .wordmark { color: #3d1f2c; }
</style>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeTech, makeNailTable, makeBlob, makeCoin, makeSign, makeJar, makeConfetti, makePoof, blinkAt } from "/kit.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
await document.fonts.load("700 40px 'Fraunces'"); await document.fonts.load("italic 700 40px 'Fraunces'");
const S = setup({ camPos: [0, 2.3, 10.5], look: [0, 1.75, 0], palette: "blush" });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const T = makeTech({ skin: 0xf1c5a4, hair: 0x6b3a22, smock: 0xff9ec0 }); T.root.position.set(-0.7, 0, -0.35); S.scene.add(T.root);
const table = makeNailTable(); table.position.set(0, 0, 0.35); S.scene.add(table);
const jar = makeJar("DEPOSITS"); jar.position.set(-0.2, 0.95, 0.6); jar.scale.setScalar(0.9); S.scene.add(jar);
const L = makeLockie({ color: 0xff7aa8, feet: 0xe0457f, key: 0x7a1d45 }); L.root.scale.setScalar(0.62); S.scene.add(L.root);
const sign = makeSign(["$45", "EACH"], { w: 1.1, h: 0.85, bg: "#ffffff", color: "#e0457f" }); S.scene.add(sign);
const poof = makePoof(14, 3); S.scene.add(poof);
const confetti = makeConfetti(100, 47); S.scene.add(confetti);
const PINKS = [0xe0457f, 0xff8fb1, 0xffffff, 0xd7a6ff, 0xffc4d8, 0xf3c6b0];
confetti.children.forEach((m, i) => { m.material = flat(PINKS[i % PINKS.length], { side: THREE.DoubleSide }); });

// The client, then a tower of cousins. [color, arrive, leave]
const FAM = [[0xffc56b, 0.2, 13.6], [0x8fc1ff, 2.6, 12.8], [0x9fd8a8, 3.4, 12.0], [0xd7a6ff, 4.2, 11.2], [0xff8fb1, 5.0, 10.4]];
const fam = FAM.map(([c], i) => { const b = makeBlob(c, i ? 0.72 : 0.8); S.scene.add(b.root); return b; });
const coins = FAM.map(() => { const c = makeCoin(); c.scale.setScalar(0.55); S.scene.add(c); return c; });
const STEP = 0.6;
const BOARD_LINES = [["GEL MANI", "$45 · 1 HR"], ["SAT", "1 BOOKED"], ["SAT", "2 BOOKED"], ["SAT", "3 BOOKED"], ["SAT", "4 BOOKED"], ["SAT", "5 BOOKED ✓"]];
const boards = BOARD_LINES.map((lines, i) => { const s = makeSign(lines, { w: 2.0, h: 0.85, bg: i === 5 ? "#e0457f" : "#ffffff", color: i === 5 ? "#ffffff" : "#3d1f2c" }); s.children[0].visible = false; s.position.set(-0.15, 2.55, -1.4); s.scale.setScalar(0.72); S.scene.add(s); return s; });

const bub = bubbles([
  { t0: 0.8, t1: 2.3, text: "discount if i bring my cousin? 🥺", anchor: () => V(0.78, 1.15, 1.0), align: 0.75, tail: "75%" },
  ...FAM.slice(1).map(([, at], i) => ({ t0: at, t1: at + 0.6, sfx: true, text: "+1", anchor: () => V(0.15, 0.7 + (i + 1) * STEP, 1.0), rot: (i % 2 ? 8 : -8) })),
  { t0: 5.4, t1: 6.3, text: "we're a big family 😇", cls: "dark", anchor: () => V(0.3, 0.6 + 4 * STEP, 1.0), align: 0.95, tail: "90%" },
  { t0: 6.2, t1: 6.9, sfx: true, text: "POOF!", anchor: () => V(0.72, 1.9, 0.8), rot: 8 },
]);

window.DUR = 20.8;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.3, html: "Client: “discount if I bring <em>my cousin?</em>” 🥺" },
    { t0: 2.3, t1: 6.2, html: "…and her cousin. And <em>her</em> cousin." },
    { t0: 6.6, t1: 10.2, html: "Your prices are <em>on the page.</em>" },
    { t0: 10.2, t1: 14.6, html: "Everyone books their own slot and pays <em>their own deposit.</em>" },
    { t0: 14.6, t1: 17.6, html: "Group booking. <em>Zero chasing.</em>" },
  ]);
  S.aim(V(0, 2.3, 10.5), V(0, 1.75, 0));

  // The tower builds up, wobbles, then everyone hops down one at a time to book.
  let booked = 0;
  const wob = prog(t, 3, 6.2) * (1 - prog(t, 10.2, 10.6));
  FAM.forEach(([, at, leave], i) => {
    const b = fam[i];
    const inK = E.out(prog(t, at, at + 0.35)), outK = E.inOut(prog(t, leave, leave + 0.6));
    b.root.visible = t > at && outK < 1;
    const baseY = i * STEP;
    let x = 0.78 + Math.sin(t * 5 + i) * 0.04 * i * wob, y = i === 0 ? 0 : lerp(baseY + 1.5, baseY, inK);
    if (i === 0 && t < 0.8) x = lerp(3.2, 0.78, E.out(prog(t, 0.2, 0.7)));
    if (outK > 0) { x = 0.78 + outK * 2.8; y = baseY * (1 - outK) + Math.sin(outK * Math.PI) * 0.5; }
    b.root.position.set(x, y, 1.0); b.root.rotation.z = Math.sin(t * 5 + i) * 0.05 * wob;
    b.pose({ blink: blinkAt(t, i * 0.5), lookX: -0.6, mouth: "smile", armL: t > leave - 0.5 && t < leave ? 1.5 : 0.3, armR: 0.3 + (t > 5 && t < 6.2 ? 0.8 : 0) });
    const ck = prog(t, leave - 0.5, leave - 0.05);
    const c = coins[i];
    c.visible = ck > 0 && ck < 1;
    c.position.set(lerp(0.65, -0.2, ck), lerp(0.5 + baseY, 1.3, ck) + Math.sin(ck * Math.PI) * 0.8, lerp(1.0, 0.6, ck)); c.rotation.y = ck * 16;
    if (t >= leave - 0.05) booked++;
  });
  jar.userData.fill(booked);
  const bi = t < 10.2 ? 0 : booked;
  boards.forEach((b, i) => { b.visible = i === bi; });

  // The tech: flustered by the tower, happy with five bookings.
  const tower = t > 2.6 && t < 6.6;
  const cheer = E.back(prog(t, 14.6, 14.9)) * (1 - prog(t, 17.3, 17.6));
  T.pose({ blink: blinkAt(t, 0.8), lookX: 0.6, lookY: tower ? 0.5 : 0, mouth: tower ? "o" : "smile", sweat: t > 4.2 && t < 6.6,
    armL: 0.1 + cheer * 2.5, armLx: cheer > 0.1 ? 0 : -0.9, armR: 0.1 + cheer * 2.5, armRx: cheer > 0.1 ? 0 : -0.9 });

  // Pink Lockie with the price.
  const drop = prog(t, 6.1, 6.45);
  L.root.visible = t > 6.1;
  const landK = t > 6.45 ? Math.exp(-(t - 6.45) * 6) * Math.cos((t - 6.45) * 18) : 0;
  const signUp = E.back(prog(t, 6.7, 7.05)) * (1 - E.inOut(prog(t, 9.9, 10.2)));
  const dance = prog(t, 14.6, 14.8) * (1 - prog(t, 17.4, 17.6));
  L.root.position.set(0.35, 0.95 + (1 - E.out(drop)) * 3.5 + dance * Math.abs(Math.sin(t * 9)) * 0.2, 0.45);
  L.pose({ squash: landK * 0.7, armR: 0.25 + dance * 2, armL: 0.25 + signUp * 1.2 + dance * 2, blink: blinkAt(t, 1.3), lookX: 0.5, tilt: dance * Math.sin(t * 9) * 0.15, open: 0.3 });
  poof.position.set(0.35, 1.4, 0.7); poof.userData.at(prog(t, 6.2, 7.0));
  sign.visible = signUp > 0.01;
  sign.position.set(-0.1, 1.75, 0.9); sign.scale.setScalar(0.5 * signUp); sign.rotation.z = 0.08 + Math.sin(t * 3) * 0.03;

  confetti.position.set(0, 2.2, 0.6); confetti.userData.at(t - 14.6);
  showBubbles(t, bub, S.toScreen);
  outro(t, 17.6, { h: "Cousins welcome.<br>Deposits too.", p: "Booking + deposits for nail techs,<br>lash artists & beauty pros." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
