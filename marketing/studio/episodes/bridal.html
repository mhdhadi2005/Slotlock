<!doctype html><html data-look="blush"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
<style>
  /* Blush palette for beauty episodes. */
  body { background: #fff5f7; color: #3d1f2c; }
  .glow { background: radial-gradient(60% 38% at 82% 8%, rgba(255,150,190,.55), transparent 70%), radial-gradient(55% 35% at 0% 100%, rgba(255,200,220,.6), transparent 70%); }
  #cap { font: 700 84px/1.04 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  em { color: #d63a70; font-style: italic; }
  #foot { color: #a57f8f; }
  .bub { box-shadow: 0 16px 40px -14px rgba(170,60,105,.5); border: 3px solid #f6cfdc; }
  .bub::after { border-right: 3px solid #f6cfdc; border-bottom: 3px solid #f6cfdc; }
  .bub.accent { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; border-color: transparent; } .bub.accent::after { background: #e24f86; border-color: transparent; }
  .bub.dark { background: #3d1f2c; color: #fff5f7; border-color: #3d1f2c; } .bub.dark::after { background: #3d1f2c; border-color: #3d1f2c; }
  .sfx { color: #fff; -webkit-text-stroke: 4px #7a1d45; }
  #outro { background: radial-gradient(60% 40% at 50% 30%, rgba(255,150,190,.55), transparent 70%), #fff5f7; }
  #outro h2 { font: italic 700 100px/1.02 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  #outro p { color: #6e4b5b; }
  #outro .cta { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; }
  #outro .wordmark, #foot .wordmark { color: #3d1f2c; }
</style>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeTech, makeNailTable, makeBlob, makeCoin, makeSign, makeJar, makeLabel, makeConfetti, makePoof, blinkAt, BLOB_COLORS } from "/kit.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
await document.fonts.load("600 40px 'Fraunces'"); await document.fonts.load("italic 600 40px 'Fraunces'");
const S = setup({ camPos: [0, 2.4, 12], look: [0, 1.8, 0], palette: "blush" });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const T = makeTech({ skin: 0xe8b48f, hair: 0x2a1a12, smock: 0xff9ec0 }); T.root.position.set(-0.55, 0, -1.2); S.scene.add(T.root);
const table = makeNailTable(); table.position.set(0, 0, -0.4); S.scene.add(table);
const jar = makeJar("DEPOSITS"); jar.position.set(0.4, 0.95, -0.05); jar.scale.setScalar(0.8); S.scene.add(jar);
const L = makeLockie({ color: 0xff7aa8, feet: 0xe0457f, key: 0x7a1d45 }); L.root.scale.setScalar(0.55); S.scene.add(L.root);
const sign = makeSign(["ONE LINK.", "EACH ONE PAYS."], { w: 1.9, h: 0.9, bg: "#ffffff", color: "#e0457f" }); S.scene.add(sign);
const poof = makePoof(14, 9); S.scene.add(poof);
const confetti = makeConfetti(100, 71); S.scene.add(confetti);
const PINKS = [0xe0457f, 0xff8fb1, 0xffffff, 0xd7a6ff, 0xffc4d8, 0xf3c6b0];
confetti.children.forEach((m, i) => { m.material = flat(PINKS[i % PINKS.length], { side: THREE.DoubleSide }); });

// The bridal party: the bride (veil + flower crown) and five bridesmaids.
const NAMES = ["SARA", "NOOR", "BRIDE", "LILY", "MAYA", "ZOE"];
const COLS = [0xd7a6ff, 0xffc4d8, 0xffffff, 0xf3c6b0, 0xffc4d8, 0xd7a6ff];
const party = NAMES.map((n, i) => { const b = makeBlob(COLS[i], 0.55); S.scene.add(b.root); return b; });
const bride = party[2];
const veil = mesh(new THREE.ConeGeometry(0.78, 1.15, 28, 1, true, Math.PI / 2, Math.PI), toon(0xfff3f8, { side: THREE.DoubleSide }), 0.015);
veil.position.set(0, 0.52, -0.1); bride.body.add(veil);
const crown = new THREE.Group(); crown.position.set(0, 0.9, 0); bride.body.add(crown);
for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2; const f = mesh(new THREE.SphereGeometry(0.075, 10, 8), toon(i % 2 ? 0xff8fb1 : 0xe0457f), 0.01); f.position.set(Math.sin(a) * 0.26, 0, Math.cos(a) * 0.26); crown.add(f); }
bride.body.children[0].material = toon(0xfff8fb);
const PX = NAMES.map((_, i) => -1.25 + i * 0.5);

// The day's board: six slots that fill as each person books and pays.
const TIMES = ["7:00", "7:45", "8:30", "9:15", "10:00", "10:45"];
const ORDER = [2, 0, 1, 3, 4, 5]; // the bride books first
const tiles = TIMES.map((tm, i) => {
  const x = -1.05 + (i % 3) * 1.05, y = 3.3 - Math.floor(i / 3) * 0.62;
  const open = makeLabel([tm, "OPEN"], { w: 0.92, h: 0.52, bg: "#ffffff", color: "#b58a9b" });
  const paid = makeLabel([tm, NAMES[ORDER[i]] + " ✓"], { w: 0.92, h: 0.52, bg: "#e0457f", color: "#ffffff" });
  open.position.set(x, y, -1.6); paid.position.set(x, y, -1.58); S.scene.add(open, paid); return { open, paid };
});
const head = makeLabel(["SAT · BRIDAL PARTY"], { w: 2.2, h: 0.3, bg: null, color: "#3d1f2c" }); head.position.set(0, 3.85, -1.6); S.scene.add(head);
const coins = party.map(() => { const c = makeCoin(); c.scale.setScalar(0.5); S.scene.add(c); return c; });
const PAY = (i) => 7.6 + i * 0.7; // time the i-th booking (in ORDER) pays

const bub = bubbles([
  { t0: 1.9, t1: 3.5, text: "can all six of us come saturday? 👰💕", anchor: () => V(PX[2], 1.0, 1.0), align: 0.4, tail: "40%" },
  { t0: 3.6, t1: 5.1, text: "six people… if even one bails 😬", anchor: () => V(-0.55, 2.4, -1.2), align: 0.3, tail: "30%" },
  { t0: 5.2, t1: 5.9, sfx: true, text: "POOF!", anchor: () => V(1.05, 2.0, -0.1), rot: 8 },
  { t0: 12.1, t1: 12.9, sfx: true, text: "CLICK!", anchor: () => V(1.05, 2.1, -0.1), rot: -6 },
  { t0: 12.9, t1: 14.6, text: "see you saturday 💍", anchor: () => V(PX[2], 1.0, 1.0), align: 0.4, tail: "40%" },
]);

window.DUR = 18.8;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.4, html: "Bridal party. <em>Six people.</em> One morning." },
    { t0: 2.4, t1: 5.2, html: "If one bails, <em>the whole morning</em> falls apart." },
    { t0: 5.4, t1: 7.5, html: "Send one link. <em>Each one books their slot.</em>" },
    { t0: 7.5, t1: 12.1, html: "And each one <em>pays a deposit.</em>" },
    { t0: 12.1, t1: 15.8, html: "Bride plus five. <em>Six deposits.</em> 💍" },
  ]);
  S.aim(V(0, 2.4, 12), V(0, 1.8, 0));
  const dance = prog(t, 12.2, 12.4) * (1 - prog(t, 15.4, 15.6));

  // The party hops in one by one, then each pays in turn.
  let landed = 0;
  party.forEach((b, i) => {
    const at = 0.15 + i * 0.28, k = E.out(prog(t, at, at + 0.45));
    const from = i < 3 ? -2.6 : 2.6;
    const ord = ORDER.indexOf(i), pay = PAY(ord);
    const hop = t > pay - 0.3 && t < pay + 0.1 ? Math.sin(prog(t, pay - 0.3, pay + 0.1) * Math.PI) * 0.25 : 0;
    b.root.position.set(lerp(from, PX[i], k), (k < 1 ? Math.abs(Math.sin(t * 12 + i)) * 0.18 : 0) + hop + dance * Math.abs(Math.sin(t * 9 + i)) * 0.16, 1.0);
    b.root.visible = t > at;
    b.pose({ blink: blinkAt(t, i * 0.37), lookX: t > 3.5 && t < 5.2 ? -0.4 : t > 5.2 && t < 12 ? 0.4 : 0, lookY: 0.4, mouth: "smile",
      armL: 0.3 + (i === 2 && t > 1.9 && t < 3.5 ? 1.2 + Math.sin(t * 8) * 0.2 : 0) + dance * 1.5, armR: 0.3 + (hop > 0.05 ? 1.4 : 0) + dance * 1.5, tilt: dance * Math.sin(t * 9 + i) * 0.12 });
    const ck = prog(t, pay, pay + 0.5), c = coins[i];
    c.visible = ck > 0 && ck < 1;
    c.position.set(lerp(PX[i], 0.4, ck), lerp(0.7, 1.55, ck) + Math.sin(ck * Math.PI) * 1.1, lerp(1.0, -0.05, ck)); c.rotation.y = ck * 16;
    if (t > pay + 0.5) landed++;
  });
  jar.userData.fill(landed);
  const bounce = [0, 1, 2, 3, 4, 5].reduce((m, i) => Math.max(m, t > PAY(i) + 0.5 ? Math.exp(-(t - PAY(i) - 0.5) * 7) * Math.abs(Math.sin((t - PAY(i) - 0.5) * 16)) : 0), 0);
  jar.position.y = 0.95 + bounce * 0.12;
  tiles.forEach(({ open, paid }, i) => {
    const k = E.back(prog(t, PAY(i) + 0.45, PAY(i) + 0.75));
    open.visible = k < 0.5; paid.visible = t > PAY(i) + 0.45; paid.scale.setScalar(Math.max(0.01, k));
  });

  // The tech: worried about the headcount, then relieved.
  const worried = t > 3.3 && t < 5.4;
  const cheer = E.back(prog(t, 12.3, 12.6)) * (1 - prog(t, 15.3, 15.6));
  T.pose({ blink: blinkAt(t, 0.8), lookX: worried ? 0.2 : 0.4, lookY: worried ? -0.5 : -0.2, mouth: worried ? "o" : "smile", sweat: worried, slump: worried ? 0.6 : 0,
    armL: 0.1 + cheer * 2.5, armLx: cheer > 0.1 ? 0 : -0.9, armR: 0.1 + cheer * 2.5, armRx: cheer > 0.1 ? 0 : -0.9 });

  // Pink Lockie drops onto the table with the plan, and locks the morning in.
  const drop = prog(t, 5.0, 5.35);
  L.root.visible = t > 5.0;
  const landK = t > 5.35 ? Math.exp(-(t - 5.35) * 6) * Math.cos((t - 5.35) * 18) : 0;
  const signUp = E.back(prog(t, 5.6, 5.95)) * (1 - E.inOut(prog(t, 7.3, 7.6)));
  const click = t > 12.1 ? Math.exp(-(t - 12.1) * 7) : 0;
  L.root.position.set(1.05, 0.95 + (1 - E.out(drop)) * 3.5 + dance * Math.abs(Math.sin(t * 9)) * 0.2, -0.2);
  L.pose({ squash: landK * 0.7 + click * 0.5, open: t < 12.1 ? 1 : 1 - E.out(prog(t, 12.1, 12.25)), tilt: dance * Math.sin(t * 9) * 0.15,
    armR: 0.25 + signUp * 1.2 + dance * 2, armL: 0.25 + dance * 2, blink: blinkAt(t, 1.4), lookX: -0.4, mouth: click > 0.3 ? "o" : "smile" });
  poof.position.set(1.05, 1.5, 0); poof.userData.at(prog(t, 5.1, 5.9));
  sign.visible = signUp > 0.01;
  sign.position.set(0.9, 1.75, 0.3); sign.scale.setScalar(0.55 * signUp); sign.rotation.z = -0.06 + Math.sin(t * 3) * 0.03;

  confetti.position.set(0, 2.4, 0.6); confetti.userData.at(t - 12.2);
  showBubbles(t, bub, S.toScreen);
  outro(t, 15.8, { h: "Six in the party.<br>Six deposits.", p: "Booking + deposits for nail techs,<br>lash artists & beauty pros." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
