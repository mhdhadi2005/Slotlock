<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeArtist, makeBlob, makeChair, makeCoin, makeClock, makeJar, makePhone, makeSign, makeConfetti, makePoof, blinkAt, BLOB_COLORS } from "/kit.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
const S = setup({ camPos: [0, 2.6, 13], look: [0, 1.95, 0] });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const A = makeArtist(); A.root.position.set(-1.25, 0, 0.1); S.scene.add(A.root);
const chair = makeChair(); chair.position.set(-0.2, 0, -0.3); chair.rotation.y = 0.2; S.scene.add(chair);
const sitter = makeBlob(BLOB_COLORS[1], 0.8); S.scene.add(sitter.root);
const walker = makeBlob(BLOB_COLORS[3], 0.85); S.scene.add(walker.root);
const L = makeLockie(); S.scene.add(L.root);
const jar = makeJar("DEPOSITS"); jar.position.set(-0.95, 0, 1.35); jar.scale.setScalar(0.7); jar.userData.fill(2); S.scene.add(jar);
const clock = makeClock(); clock.position.set(1.2, 3.25, -1.4); clock.scale.setScalar(0.7); S.scene.add(clock);
const sign = makeSign(["NEXT OPENING", "TODAY 4:30 PM"], { w: 2.0, h: 0.95 }); S.scene.add(sign);
const phone = makePhone([{ lines: ["TODAY", "4:30 PM"] }, { lines: ["$40", "DEPOSIT"] }, { lines: ["BOOKED", "✓"], bg: "#e6fff1", color: "#128a52" }]); S.scene.add(phone);
const coin = makeCoin(); coin.scale.setScalar(0.7); S.scene.add(coin);
const poof = makePoof(14, 11); S.scene.add(poof);
const confetti = makeConfetti(90, 61); S.scene.add(confetti);

const bub = bubbles([
  { t0: 0.2, t1: 1.0, sfx: true, text: "DING-DONG!", anchor: () => V(1.4, 2.3, 0.6), rot: -6 },
  { t0: 0.9, t1: 2.3, text: "just a quick one? right now? 🙏", anchor: () => V(1.4, 1.3, 0.8), align: 0.8, tail: "80%" },
  { t0: 2.5, t1: 3.6, text: "i'm mid-session 😅", anchor: () => V(-1.25, 2.55, 0.1), align: 0.25, tail: "25%" },
  { t0: 3.7, t1: 5.2, text: "it's tiny i promise. i can wait 5 min?", anchor: () => V(1.4, 1.3, 0.8), align: 0.8, tail: "80%" },
  { t0: 5.3, t1: 6.0, sfx: true, text: "POOF!", anchor: () => V(0.25, 2.0, 1.0), rot: 8 },
  { t0: 11.3, t1: 12.1, sfx: true, text: "CLICK!", anchor: () => V(0.25, 2.2, 1.0), rot: -6 },
  { t0: 14.0, t1: 15.3, text: "right on time 😎", anchor: () => V(0.3, 1.9, 0.2), align: 0.5 },
]);

window.DUR = 18.8;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.3, html: "Walk-in: “just a quick one? <em>Right now?</em>” 🙏" },
    { t0: 2.3, t1: 5.3, html: "You're mid-session. <em>They're persistent.</em>" },
    { t0: 5.6, t1: 9.4, html: "Lockie shows them <em>your next real opening.</em>" },
    { t0: 9.4, t1: 12.8, html: "They book it and send the deposit. <em>On the spot.</em>" },
    { t0: 12.8, t1: 15.6, html: "4:30 PM. <em>Right on time.</em>" },
  ]);
  S.aim(V(0, 2.6, 13), V(0, 1.95, 0));
  clock.userData.setTime(14 * 60 + 10 + keys(t, [[0, 0], [12.6, 5], [13.4, 140], [20, 142]]));

  // The client in the chair leaves when the session is done; the walk-in takes the chair at 4:30.
  const sitterOut = E.inOut(prog(t, 12.8, 13.4));
  sitter.root.visible = sitterOut < 1;
  sitter.root.position.set(-0.2 + sitterOut * 3, 0.62 - sitterOut * 0.62 + (sitterOut > 0 ? Math.sin(sitterOut * Math.PI) * 0.4 : 0), -0.2);
  sitter.pose({ blink: t < 12.8 ? 0.8 : blinkAt(t, 1), mouth: "smile", lookX: -0.4 });

  const cin = E.out(prog(t, 0.1, 0.7));
  const leave = E.inOut(prog(t, 12.0, 12.6));
  const back = E.out(prog(t, 13.4, 13.9));
  const sit = E.inOut(prog(t, 13.9, 14.4));
  walker.root.visible = leave < 1 || t > 13.4;
  let wx = lerp(3.2, 1.4, cin) + leave * 2.2, wy = 0;
  if (t > 13.4) { wx = lerp(3.2, 1.2, back); if (sit > 0) { wx = lerp(1.2, -0.2, sit); wy = Math.sin(sit * Math.PI) * 0.6 + sit * 0.62; } }
  walker.root.position.set(wx, wy + ((cin < 1 && t < 1) || (leave > 0 && leave < 1) || (back > 0 && back < 1) ? Math.abs(Math.sin(t * 11)) * 0.15 : 0), t > 13.9 ? lerp(0.8, -0.2, sit) : 0.8);
  const tapping = t > 9.6 && t < 11.3;
  walker.pose({ blink: blinkAt(t, 1.7), lookX: -0.7, mouth: "smile", armL: (t < 5.3 ? 1.2 + Math.sin(t * 6) * 0.3 : tapping ? 1.1 + Math.abs(Math.sin(t * 20)) * 0.2 : 0.3), armR: 0.3 });
  const pk = E.out(prog(t, 9.5, 9.8)) * (1 - prog(t, 11.8, 12.1));
  phone.visible = pk > 0.01; phone.position.set(1.4, 1.6, 1.0); phone.scale.setScalar(1.3 * pk); phone.rotation.set(-0.1, -0.2, 0);
  phone.userData.show(t < 10.2 ? 0 : t < 10.9 ? 1 : 2);
  const ck = prog(t, 10.6, 11.2);
  coin.visible = ck > 0 && ck < 1;
  coin.position.set(lerp(1.2, -0.95, ck), lerp(1.0, 0.7, ck) + Math.sin(ck * Math.PI) * 1.4, lerp(0.8, 0.9, ck)); coin.rotation.y = ck * 16;
  jar.userData.fill(t < 11.2 ? 2 : 3);

  // The artist: busy tattooing, then ready and happy.
  const working = t < 12.8;
  const cheer = E.back(prog(t, 14.4, 14.7)) * (1 - prog(t, 15.3, 15.6));
  A.pose({ blink: blinkAt(t, 0.6), mouth: t > 2.3 && t < 5.4 ? "o" : "smile", lookX: working && !(t > 2.3 && t < 3.7) ? 0.6 : 0.8, lookY: working ? -0.2 : 0,
    armR: 0.15 + (working ? 0.9 + Math.sin(t * 40) * 0.03 : 0) + cheer * 2.4, armRx: working ? -0.8 : 0, armL: 0.15 + cheer * 2.4 });

  // Lockie drops in with the next opening, and locks it when it's booked.
  const drop = prog(t, 5.2, 5.55);
  L.root.visible = t > 5.2;
  const landK = t > 5.55 ? Math.exp(-(t - 5.55) * 6) * Math.cos((t - 5.55) * 18) : 0;
  const signUp = E.back(prog(t, 5.8, 6.15)) * (1 - E.inOut(prog(t, 9.2, 9.5)));
  const click = t > 11.3 ? Math.exp(-(t - 11.3) * 7) : 0;
  L.root.position.set(lerp(0.25, 1.25, E.inOut(prog(t, 12.8, 13.3))), (1 - E.out(drop)) * 4.5, 1.0);
  L.pose({ squash: landK * 0.8 + click * 0.5, open: t < 11.3 ? 1 : 1 - E.out(prog(t, 11.3, 11.45)), armR: 0.25 + signUp * 1.2, armL: 0.25 + cheer * 2,
    blink: blinkAt(t, 1.2), lookX: 0.6, mouth: click > 0.3 ? "o" : "smile" });
  poof.position.set(0.25, 1.2, 1.1); poof.userData.at(prog(t, 5.3, 6.1));
  sign.visible = signUp > 0.01;
  sign.position.set(0.75, 1.3, 1.35); sign.scale.setScalar(0.62 * signUp); sign.rotation.z = -0.08 + Math.sin(t * 3) * 0.03;

  confetti.position.set(-0.2, 2.4, 0.3); confetti.userData.at(t - 14.4);
  showBubbles(t, bub, S.toScreen);
  outro(t, 15.6, { h: "Walk-ins welcome.<br>At 4:30.", p: "Booking + deposits for tattoo artists.<br>Free for founding artists." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
