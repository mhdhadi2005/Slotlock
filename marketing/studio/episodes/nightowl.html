<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
<style>
  #night { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(70% 45% at 70% 35%, rgba(40,60,140,.2), transparent 70%), rgba(8,12,38,.42); }
</style>
</head><body><div id="gl"></div><div id="night"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeArtist, makeBlob, makeCoin, makeClock, makeJar, makePhone, makeSign, makeConfetti, makePoof, blinkAt, BLOB_COLORS } from "/kit.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
const S = setup({ camPos: [0, 2.6, 13], look: [0, 1.95, 0] });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const A = makeArtist(); A.root.position.set(-1.25, 0, 0.1); S.scene.add(A.root);
// The night owl: a purple gumdrop with ear tufts.
const O = makeBlob(BLOB_COLORS[2], 0.85); S.scene.add(O.root);
for (const s of [-1, 1]) { const tuft = mesh(new THREE.ConeGeometry(0.1, 0.28, 10), toon(0xb98ae6), 0.012); tuft.position.set(s * 0.26, 0.98, 0); tuft.rotation.z = -s * 0.4; O.body.add(tuft); }
const shades = new THREE.Group(); shades.position.set(0, 0.6, 0.47); O.body.add(shades);
for (const s of [-1, 1]) { const l = mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.04, 20), flat(0x111111), 0.01); l.rotation.x = Math.PI / 2; l.position.x = s * 0.15; shades.add(l); }
const L = makeLockie(); L.root.scale.setScalar(0.8); S.scene.add(L.root);
const jar = makeJar("DEPOSITS"); jar.position.set(-0.95, 0, 1.35); jar.scale.setScalar(0.7); jar.userData.fill(2); S.scene.add(jar);
const clock = makeClock(); clock.position.set(1.2, 3.25, -1.4); clock.scale.setScalar(0.7); S.scene.add(clock);
const sign = makeSign(["OPEN", "11 AM – 7 PM"], { w: 1.6, h: 0.95 }); S.scene.add(sign);
const phone = makePhone([{ lines: ["2 AM", "✕"], bg: "#3a1414", color: "#ff8a80" }, { lines: ["SAT", "6 PM"] }, { lines: ["$50", "DEPOSIT"] }, { lines: ["BOOKED", "✓"], bg: "#e6fff1", color: "#128a52" }]); S.scene.add(phone);
const coin = makeCoin(); coin.scale.setScalar(0.7); S.scene.add(coin);
const poof = makePoof(14, 121); S.scene.add(poof);
const confetti = makeConfetti(90, 123); S.scene.add(confetti);
const OX = 1.1;

const bub = bubbles([
  { t0: 0.6, t1: 2.5, text: "can u do 2am? i'm a night person 🦉", anchor: () => V(OX, 1.35, 0.8), align: 0.8, tail: "80%" },
  { t0: 1.9, t1: 2.5, sfx: true, text: "HOO?", anchor: () => V(OX, 2.2, 0.8), rot: 8 },
  { t0: 2.7, t1: 4.8, text: "i'm a sleep person 😴", cls: "dark", anchor: () => V(-1.25, 2.55, 0.1), align: 0.25, tail: "25%" },
  { t0: 3.6, t1: 4.6, sfx: true, text: "YAWN", anchor: () => V(-1.0, 3.1, 0.2), rot: -6 },
  { t0: 5.2, t1: 5.9, sfx: true, text: "POOF!", anchor: () => V(0.0, 1.9, 1.0), rot: 8 },
  { t0: 11.1, t1: 11.8, sfx: true, text: "CLICK!", anchor: () => V(0.0, 1.9, 1.0), rot: -6 },
  { t0: 13.0, t1: 15.0, text: "6pm is basically morning 😎", anchor: () => V(OX, 1.35, 0.8), align: 0.8, tail: "80%" },
]);

window.DUR = 18.8;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.6, html: "11:47 PM. “Can you do <em>2 AM?</em>” 🦉" },
    { t0: 2.6, t1: 5.2, html: "You have hours. <em>They have vibes.</em>" },
    { t0: 5.4, t1: 8.6, html: "Your page only shows <em>your hours.</em>" },
    { t0: 8.6, t1: 11.9, html: "They pick a slot <em>you actually work.</em>" },
    { t0: 11.9, t1: 15.6, html: "Saturday, 6 PM. <em>Everyone's awake.</em>" },
  ]);
  S.aim(V(0, 2.6, 13), V(0, 1.95, 0));
  const day = E.inOut(prog(t, 11.9, 12.6));
  document.getElementById("night").style.opacity = 1 - day;
  clock.userData.setTime(23 * 60 + 47 + keys(t, [[0, 0], [11.9, 6], [12.6, 1093], [20, 1095]]));

  // The owl: asks for 2 AM, books Saturday 6 PM, shows up in shades.
  const cin = E.out(prog(t, 0.1, 0.6)), out1 = E.inOut(prog(t, 11.9, 12.3)), in2 = E.out(prog(t, 12.4, 12.9));
  let ox = lerp(3.2, OX, cin) + out1 * 2.4; if (t > 12.4) ox = lerp(3.2, OX, in2);
  const moving = (cin > 0 && cin < 1) || (out1 > 0 && out1 < 1) || (in2 > 0 && in2 < 1);
  const party = prog(t, 13.0, 13.2) * (1 - prog(t, 15.3, 15.5));
  O.root.position.set(ox, (moving ? Math.abs(Math.sin(t * 11)) * 0.15 : 0) + party * Math.abs(Math.sin(t * 9)) * 0.16, 0.8);
  shades.visible = t > 12.4;
  const tapping = t > 9.0 && t < 10.6;
  O.pose({ blink: blinkAt(t, 1.7), lookX: -0.7, mouth: t > 5.4 && t < 8.6 ? "o" : "smile", armL: 0.3 + (tapping ? 1.1 + Math.abs(Math.sin(t * 20)) * 0.2 : 0) + party * 1.5, armR: 0.3 + (t < 2.5 ? 1.2 + Math.sin(t * 6) * 0.2 : 0) + party * 1.5, tilt: party * Math.sin(t * 9) * 0.12 });
  const pk = E.out(prog(t, 8.8, 9.1)) * (1 - prog(t, 11.0, 11.2));
  phone.visible = pk > 0.01; phone.position.set(0.9, 2.2, 1.1); phone.scale.setScalar(1.2 * pk); phone.rotation.set(-0.1, -0.2, 0);
  phone.userData.show(t < 9.5 ? 0 : t < 10.0 ? 1 : t < 10.5 ? 2 : 3);
  const ck = prog(t, 10.4, 11.0);
  coin.visible = ck > 0 && ck < 1;
  coin.position.set(lerp(0.9, -0.95, ck), lerp(1.3, 0.7, ck) + Math.sin(ck * Math.PI) * 1.3, lerp(1.0, 1.35, ck)); coin.rotation.y = ck * 16;
  jar.userData.fill(t < 11.0 ? 2 : 3);

  // The artist: exhausted at midnight, fresh at 6 PM.
  const tired = t < 11.9;
  const yawn = t > 3.6 && t < 4.6;
  const cheer = E.back(prog(t, 13.1, 13.4)) * (1 - prog(t, 15.3, 15.6));
  A.pose({ blink: tired ? (yawn ? 1 : 0.55) : blinkAt(t, 0.6), mouth: yawn ? "o" : tired ? "flat" : "smile", lookX: 0.8, slump: tired ? 0.7 : 0, headTilt: tired ? Math.sin(t * 1.2) * 0.08 : 0,
    armL: 0.15 + (yawn ? 2.2 : 0) + cheer * 2.4, armR: 0.15 + (yawn ? 2.2 : 0) + cheer * 2.4 });

  // Lockie with the opening hours.
  const drop = prog(t, 5.0, 5.35);
  L.root.visible = t > 5.0;
  const landK = t > 5.35 ? Math.exp(-(t - 5.35) * 6) * Math.cos((t - 5.35) * 18) : 0;
  const signUp = E.back(prog(t, 5.6, 5.95)) * (1 - E.inOut(prog(t, 8.5, 8.8)));
  const click = t > 11.1 ? Math.exp(-(t - 11.1) * 7) : 0;
  L.root.position.set(0.0, (1 - E.out(drop)) * 4.5 + party * Math.abs(Math.sin(t * 9 + 1)) * 0.18, 1.0);
  L.pose({ squash: landK * 0.8 + click * 0.5, open: t < 11.1 ? 1 : 1 - E.out(prog(t, 11.1, 11.25)), armR: 0.25 + signUp * 2.3 + party * 2, armL: 0.25 + party * 2,
    blink: blinkAt(t, 1.2), lookX: 0.6, mouth: click > 0.3 ? "o" : "smile", tilt: party * Math.sin(t * 9) * 0.15 });
  poof.position.set(0.0, 1.0, 1.1); poof.userData.at(prog(t, 5.1, 5.9));
  sign.visible = signUp > 0.01;
  sign.position.set(0.15, 1.45, 1.2); sign.scale.setScalar(0.64 * signUp); sign.rotation.z = -0.06 + Math.sin(t * 3) * 0.03;

  confetti.position.set(0, 1.6, 0.6); confetti.userData.at(t - 13.1);
  showBubbles(t, bub, S.toScreen);
  outro(t, 15.6, { h: "Your hours.<br>Not 2 AM.", p: "Booking + deposits for tattoo artists.<br>Free for founding artists." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
