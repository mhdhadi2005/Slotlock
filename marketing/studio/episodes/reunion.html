<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeArtist, makeGhost, makeBlob, makeCoin, makeSign, makePartyHat, makeCake, makeBanner, makeConfetti, makePoof, blinkAt, BLOB_COLORS } from "/kit.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
const S = setup({ camPos: [0, 2.6, 13], look: [0, 1.95, 0] });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// The party: banner, table, cake.
const banner = makeBanner(["NO-SHOW REUNION 2026", "REUNION CANCELLED"], { bg: ["#ffc53d", "#ff5c39"], color: ["#1a0905", "#ffffff"] });
banner.position.set(0, 2.75, -1.6); banner.scale.setScalar(1.3); S.scene.add(banner);
const table = new THREE.Group(); table.position.set(0, 0, -0.75); S.scene.add(table);
const top = mesh(new RoundedBoxGeometry(2.8, 0.1, 0.8, 3, 0.04), toon(0xfff3d6), 0.02); top.position.y = 0.8; table.add(top);
for (const x of [-1.25, 1.25]) { const l = mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.8, 8), toon(0x8a5a3a), 0.012); l.position.set(x, 0.4, 0); table.add(l); }
const cake = makeCake(); cake.position.set(0, 0.85, -0.75); cake.scale.setScalar(0.85); S.scene.add(cake);

// Every no-show of the year, in party hats.
const SPOTS = [[-1.3, -0.25], [-0.45, 0.1], [0.45, 0.1], [1.3, -0.25]];
const HATS = [[0xff5c39, 0xffc53d], [0x8fc1ff, 0xffffff], [0xd7a6ff, 0xffc53d], [0x9fd8a8, 0xff8fb1]];
const ghosts = SPOTS.map(([x, z], i) => {
  const g = makeGhost(); g.root.position.set(x, 0, z); g.root.scale.setScalar(0.72); S.scene.add(g.root);
  const hat = makePartyHat(...HATS[i]); hat.position.set(0, 1.55, 0); hat.rotation.z = (i % 2 ? 0.2 : -0.2); g.body.add(hat);
  return g;
});
const poofs = SPOTS.map(() => { const p = makePoof(12, 9); S.scene.add(p); return p; });
const POOF_AT = [8.3, 8.75, 9.2, 9.65];

const L = makeLockie(); L.shades.visible = true; S.scene.add(L.root);
const sign = makeSign(["DEPOSIT", "FIRST."], { w: 1.5, h: 0.9 }); S.scene.add(sign);
const A = makeArtist(); S.scene.add(A.root);
const GUESTS = [[BLOB_COLORS[1], 11.3, 0.8, 0.3], [BLOB_COLORS[4], 11.9, 1.5, -0.1], [BLOB_COLORS[0], 12.5, 1.2, 1.15]];
const blobs = GUESTS.map(([c]) => { const b = makeBlob(c, 0.8); S.scene.add(b.root); return b; });
const coins = GUESTS.map(() => { const c = makeCoin(); c.scale.setScalar(0.7); S.scene.add(c); return c; });
const confetti = makeConfetti(100, 21); S.scene.add(confetti);

const bub = bubbles([
  { t0: 2.3, t1: 3.2, text: "remember “omw!!” 😂", anchor: () => V(-1.3, 1.75, -0.25), align: 0.2, tail: "20%" },
  { t0: 3.25, t1: 4.15, text: "i booked 3 artists same day lol", cls: "dark", anchor: () => V(1.3, 1.75, -0.25), align: 0.85, tail: "85%" },
  { t0: 4.2, t1: 5.1, text: "deposit? never heard of her 💅", anchor: () => V(-0.45, 1.9, 0.1), align: 0.3, tail: "30%" },
  { t0: 5.15, t1: 6.05, text: "cheers to no-shows 🥂", cls: "dark", anchor: () => V(0.45, 1.9, 0.1), align: 0.7, tail: "70%" },
  { t0: 6.2, t1: 7.0, sfx: true, text: "CRASH!", anchor: () => V(0, 1.6, 1.2), rot: -8 },
  { t0: 7.2, t1: 8.1, text: "uh oh.", cls: "dark", anchor: () => V(1.3, 1.75, -0.25), align: 0.8, tail: "80%" },
  { t0: 8.3, t1: 9.9, sfx: true, text: "POOF! POOF!", anchor: () => V(0, 2.3, 0.6), rot: 6 },
  { t0: 12.0, t1: 13.3, text: "deposit sent 💸", cls: "accent", anchor: () => V(0.8, 1.25, 0.3), align: 0.6, tail: "60%" },
  { t0: 13.4, t1: 14.6, text: "wait… they SHOWED UP?", anchor: () => V(-1.35, 2.45, 0.6), align: 0.2, tail: "20%" },
]);

window.DUR = 21.2;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.2, html: "POV: every client who <em>ghosted you</em> this year…" },
    { t0: 2.2, t1: 6.1, html: "…threw a <em>reunion</em> 🎉" },
    { t0: 6.1, t1: 8.2, html: "Lockie <em>wasn't invited.</em>" },
    { t0: 8.2, t1: 11.1, html: "Deposit first? <em>Party's over.</em>" },
    { t0: 11.1, t1: 14.7, html: "Real clients pay, book, <em>show up.</em>" },
    { t0: 14.7, t1: 18.1, html: "Next year's reunion: <em>cancelled.</em>" },
  ]);
  const shake = t > 6.2 && t < 6.7 ? Math.sin(t * 60) * 0.06 * (1 - prog(t, 6.2, 6.7)) : 0;
  S.aim(V(shake, 2.6 + shake, 13), V(0, 1.95, 0));
  banner.userData.show(t < 14.7 ? 0 : 1);
  banner.scale.setScalar(1.3 * (t > 14.7 ? lerp(1.12, 1, E.out(prog(t, 14.7, 15.0))) : 1));
  cake.userData.candles.forEach((f, i) => { f.visible = t < 9.7; f.scale.set(1, 1.6 + Math.sin(t * 20 + i) * 0.25, 1); });

  // Ghosts fade in one by one, party, panic, and poof.
  ghosts.forEach((g, i) => {
    const appear = prog(t, 0.2 + i * 0.35, 0.7 + i * 0.35);
    const gone = prog(t, POOF_AT[i], POOF_AT[i] + 0.3);
    g.root.visible = appear > 0 && gone < 1;
    const party = t > 2.2 && t < 6.2;
    g.pose({ opacity: appear * (1 - gone), float: Math.abs(Math.sin(t * (party ? 7 : 3) + i)) * (party ? 0.18 : 0.06), tilt: party ? Math.sin(t * 7 + i) * 0.12 : 0,
      waveL: party ? 0.3 + Math.sin(t * 9 + i) * 0.15 : 0, waveR: party ? 0.3 + Math.cos(t * 9 + i) * 0.15 : 0,
      mouth: t > 6.3 ? "o" : "smile", sweat: t > 6.8, blink: blinkAt(t, i * 0.7), lookX: t > 6.3 ? (SPOTS[i][0] > 0 ? -0.6 : 0.6) : 0 }, t);
    poofs[i].position.set(SPOTS[i][0], 0.9, SPOTS[i][1] + 0.2); poofs[i].scale.setScalar(0.8); poofs[i].userData.at(prog(t, POOF_AT[i], POOF_AT[i] + 0.8));
  });

  // Lockie crashes the party from above, sign up, then steps aside for the real guests.
  const drop = prog(t, 5.9, 6.25);
  L.root.visible = t > 5.9;
  const landK = t > 6.25 ? Math.exp(-(t - 6.25) * 6) * Math.cos((t - 6.25) * 18) : 0;
  const signUp = E.back(prog(t, 7.0, 7.35)) * (1 - E.inOut(prog(t, 10.6, 11.0)));
  const aside = E.inOut(prog(t, 10.7, 11.3));
  const dance = prog(t, 14.7, 14.9) * (1 - prog(t, 17.9, 18.1));
  L.root.position.set(lerp(0, -0.35, aside), (1 - E.out(drop)) * 5 + dance * Math.abs(Math.sin(t * 9)) * 0.22, lerp(1.2, 1.0, aside));
  L.pose({ squash: landK * 0.8, tilt: dance * Math.sin(t * 9) * 0.15, armR: 0.25 + signUp * 1.2 + dance * 2, armL: 0.25 + dance * 2,
    blink: blinkAt(t, 1.1), lookX: t < 11 ? 0 : 0.7, mouth: "smile" });
  sign.visible = signUp > 0.01;
  sign.position.set(0.85, 1.25, 1.45); sign.scale.setScalar(0.6 * signUp); sign.rotation.z = -0.08 + Math.sin(t * 3) * 0.03;

  // The artist walks in once the ghosts are gone.
  const ain = E.out(prog(t, 10.9, 11.6));
  A.root.visible = t > 10.9;
  A.root.position.set(lerp(-2.8, -1.35, ain), ain < 1 ? Math.abs(Math.sin(t * 9)) * 0.06 : 0, 0.6);
  const cheer = E.back(prog(t, 14.7, 15.0)) * (1 - prog(t, 17.8, 18.1));
  let catchK = 0; GUESTS.forEach(([, at]) => { catchK = Math.max(catchK, E.back(prog(t, at + 0.35, at + 0.55)) * (1 - prog(t, at + 0.75, at + 0.95))); });
  A.pose({ blink: blinkAt(t, 0.4), mouth: t > 13.3 && t < 14.7 ? "o" : "smile", lookX: 0.7, armR: 0.15 + cheer * 2.4 + catchK * 1.4, armL: 0.15 + cheer * 2.4 });

  // Real guests hop in, send the deposit to the artist, and take over the party hats.
  GUESTS.forEach(([, at, x, z], i) => {
    const b = blobs[i], c = coins[i];
    const k = E.out(prog(t, at - 0.4, at));
    b.root.visible = t > at - 0.4;
    b.root.position.set(lerp(3.2, x, k), k < 1 || dance > 0 ? Math.abs(Math.sin(t * 10 + i)) * 0.14 : 0, z);
    b.pose({ blink: blinkAt(t, i * 0.6), lookX: -0.7, armL: t > at && t < at + 0.4 ? 1.5 : 0.3 + dance * 1.5, armR: 0.3 + dance * 1.5 });
    const ck = prog(t, at + 0.05, at + 0.5);
    c.visible = ck > 0 && ck < 1;
    c.position.set(lerp(x - 0.2, -1.05, ck), lerp(1.0, 1.75, ck) + Math.sin(ck * Math.PI) * 1.0, lerp(z, 0.8, ck)); c.rotation.y = ck * 16;
  });

  confetti.position.set(0, 2.4, 0.3); confetti.userData.at(t - 14.7);
  showBubbles(t, bub, S.toScreen);
  outro(t, 18.1, { h: "RSVP:<br>deposit first.", p: "Booking + deposits for tattoo artists.<br>Free for founding artists." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
