<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeArtist, makeBlob, makeCoin, makeSign, makePhone, makeConfetti, blinkAt, BLOB_COLORS } from "/kit.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
const S = setup({ camPos: [0, 2.6, 13], look: [0, 1.95, 0] });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const A = makeArtist(); A.root.position.set(-1.3, 0, 0.2); S.scene.add(A.root);
const client = makeBlob(BLOB_COLORS[5], 0.9); client.root.position.set(1.3, 0, 0.6); S.scene.add(client.root);
const L = makeLockie(); S.scene.add(L.root);
const coin = makeCoin(); coin.scale.setScalar(0.75); S.scene.add(coin);
const confetti = makeConfetti(90, 23); S.scene.add(confetti);

// The "reference photo": a blurry mystery.
const blurTex = (() => { const c = document.createElement("canvas"); c.width = 256; c.height = 200; const g = c.getContext("2d");
  g.fillStyle = "#e9e2d8"; g.fillRect(0, 0, 256, 200); g.filter = "blur(10px)";
  g.fillStyle = "#3a3430"; g.beginPath(); g.ellipse(110, 100, 60, 34, 0.6, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#2f7a5f"; g.beginPath(); g.ellipse(170, 80, 30, 50, -0.4, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#c0503a"; g.beginPath(); g.arc(80, 60, 20, 0, Math.PI * 2); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const photo = new THREE.Group(); S.scene.add(photo);
photo.add(mesh(new THREE.BoxGeometry(0.9, 0.72, 0.03), toon(0xffffff), 0.015));
const pic = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.62), new THREE.MeshBasicMaterial({ map: blurTex })); pic.position.z = 0.017; photo.add(pic);

// The consult form on the client's phone, and the quote on the artist's.
const cPhone = makePhone([{ lines: ["IDEA", "snake"] }, { lines: ["WHERE", "forearm"] }, { lines: ["SIZE", "4 in"] }, { lines: ["SENT", "✓"], bg: "#e6fff1", color: "#128a52" }]); S.scene.add(cPhone);
const quote = makeSign(["$300 · 2 HRS", "$75 DEPOSIT"], { w: 1.6, h: 0.85, bg: "#fff3d6" }); quote.children[0].visible = false; S.scene.add(quote);

const bub = bubbles([
  { t0: 0.8, t1: 2.2, text: "like this but different 🙏", anchor: () => V(1.3, 1.35, 0.6), align: 0.75, tail: "75%" },
  { t0: 2.5, t1: 3.6, text: "size? idk… medium?", anchor: () => V(1.3, 1.35, 0.6), align: 0.75, tail: "75%" },
  { t0: 3.7, t1: 4.9, text: "somewhere on my arm", anchor: () => V(1.3, 1.35, 0.6), align: 0.75, tail: "75%" },
  { t0: 3.0, t1: 5.4, sfx: true, text: "???", anchor: () => V(-1.3, 2.55, 0.2), rot: -6 },
  { t0: 5.4, t1: 6.2, sfx: true, text: "BOING!", anchor: () => V(0.1, 2.3, 0.7), rot: 8 },
  { t0: 7.5, t1: 9.5, sfx: true, text: "TAP TAP TAP", anchor: () => V(1.2, 2.25, 0.9), rot: -5 },
  { t0: 11.6, t1: 12.9, text: "yes!! 😍", anchor: () => V(1.3, 1.35, 0.6), align: 0.75, tail: "75%" },
  { t0: 14.4, t1: 15.2, sfx: true, text: "CLICK!", anchor: () => V(0.1, 2.3, 0.7), rot: -6 },
]);

window.DUR = 21.8;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.2, html: "Client: “can you do this but <em>different</em>?”" },
    { t0: 2.2, t1: 5.5, html: "Blurry pic. No size. <em>“Somewhere on my arm.”</em>" },
    { t0: 5.6, t1: 9.8, html: "Slotlock sends them an <em>idea form.</em>" },
    { t0: 9.8, t1: 13.3, html: "You reply with a <em>quote.</em>" },
    { t0: 13.3, t1: 16.2, html: "They pick a time and send the <em>deposit.</em>" },
    { t0: 16.2, t1: 18.6, html: "From “like this but different” to <em>booked.</em>" },
  ]);
  const zoom = E.inOut(prog(t, 0.2, 1.0)) * (1 - E.inOut(prog(t, 4.9, 5.5)));
  S.aim(V(0.2 * zoom, 2.6 - 0.2 * zoom, 13 - 1.4 * zoom), V(0.25 * zoom, 1.95 - 0.25 * zoom, 0));

  // The client waves the blurry photo, then fills in the form on the phone.
  const ph = E.back(prog(t, 0.3, 0.7)) * (1 - E.inOut(prog(t, 5.3, 5.7)));
  photo.visible = ph > 0.01; photo.position.set(0.7, 1.15 + Math.sin(t * 6) * 0.04, 1.0); photo.scale.setScalar(ph); photo.rotation.z = Math.sin(t * 5) * 0.08;
  const cp = E.out(prog(t, 6.6, 7.1)) * (1 - prog(t, 10.2, 10.6));
  cPhone.visible = cp > 0.01; cPhone.position.set(lerp(0.4, 1.0, cp), 1.5, 1.2); cPhone.scale.setScalar(1.7 * cp); cPhone.rotation.set(-0.1, -0.2, 0);
  cPhone.userData.show(t < 7.9 ? 0 : t < 8.6 ? 1 : t < 9.3 ? 2 : 3);
  const cheer = E.back(prog(t, 16.2, 16.5)) * (1 - prog(t, 18.3, 18.6));
  client.root.position.y = Math.abs(Math.sin(t * 3)) * 0.03 + (t > 11.6 && t < 12.9 ? Math.abs(Math.sin(t * 10)) * 0.15 : 0);
  client.pose({ blink: blinkAt(t, 2.1), lookX: -0.7, mouth: "smile", armL: (t < 5.4 ? 1.2 : t > 7.4 && t < 9.4 ? 1.1 + Math.sin(t * 20) * 0.1 : t > 13.6 && t < 14.0 ? 1.5 : 0.3) + cheer, armR: 0.3 + cheer });

  // The artist: squints at the photo, sends a quote, catches the deposit.
  const confused = t > 2.5 && t < 5.6;
  const send = E.back(prog(t, 10.0, 10.3)) * (1 - prog(t, 10.9, 11.2));
  const catchK = E.back(prog(t, 13.9, 14.15)) * (1 - prog(t, 14.5, 14.8));
  A.pose({ blink: confused ? 0.45 : blinkAt(t, 0.6), mouth: confused ? "flat" : "smile", lookX: 0.8, headTilt: confused ? Math.sin(t * 3) * 0.15 : 0,
    armR: 0.15 + send * 1.4 + catchK * 1.4 + cheer * 2.4, armL: 0.15 + cheer * 2.4 });
  const qk = prog(t, 10.2, 11.0), qh = 1 - E.inOut(prog(t, 12.9, 13.3));
  quote.visible = t > 10.2 && qh > 0.01;
  quote.position.set(lerp(-1.0, 0.75, E.inOut(qk)), lerp(1.5, 1.0, qk) + Math.sin(qk * Math.PI) * 0.8, 1.3); quote.scale.setScalar(0.85 * qh); quote.rotation.z = Math.sin(qk * Math.PI) * 0.3;

  // Lockie bounces in with the form, then locks the booking.
  const hop = prog(t, 5.4, 6.1);
  L.root.visible = t > 5.4;
  const click = t > 14.4 ? Math.exp(-(t - 14.4) * 7) : 0;
  const dance = prog(t, 16.2, 16.4) * (1 - prog(t, 18.4, 18.6));
  L.root.position.set(lerp(0.1, 0.05, hop), (t < 6.1 ? Math.sin(hop * Math.PI) * 1.6 - (1 - hop) * 2 : 0) + dance * Math.abs(Math.sin(t * 9)) * 0.22, 0.7);
  L.pose({ squash: click * 0.5 + (t > 6.1 ? Math.exp(-(t - 6.1) * 6) * Math.cos((t - 6.1) * 18) * 0.6 : 0), open: t < 14.4 ? 1 : 1 - E.out(prog(t, 14.4, 14.55)),
    armR: 0.25 + E.back(prog(t, 6.3, 6.6)) * (1 - prog(t, 7.0, 7.3)) * 1.4 + dance * 2, armL: 0.25 + dance * 2, tilt: dance * Math.sin(t * 9) * 0.15,
    blink: blinkAt(t, 1.3), lookX: t < 10 ? 0.7 : -0.5, mouth: click > 0.3 ? "o" : "smile" });

  const ck = prog(t, 13.7, 14.2);
  coin.visible = ck > 0 && ck < 1;
  coin.position.set(lerp(1.1, -1.05, ck), lerp(1.0, 1.85, ck) + Math.sin(ck * Math.PI) * 1.2, lerp(0.6, 0.5, ck)); coin.rotation.y = ck * 18;
  confetti.position.set(0, 2.3, 0.4); confetti.userData.at(t - 16.2);
  showBubbles(t, bub, S.toScreen);
  outro(t, 18.6, { h: "Less guessing.<br>More tattooing.", p: "Booking + deposits for tattoo artists.<br>Free for founding artists." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
