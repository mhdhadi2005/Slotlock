<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, textTexture, makeLockie, makeArtist, makeBlob, makeCoin, makeFlipSign, makeBell, makeJar, makeClock, makeConfetti, makePoof, blinkAt, BLOB_COLORS } from "/kit.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
const S = setup({ camPos: [0, 2.6, 13], look: [0, 1.95, 0] });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// Next month's calendar on the wall.
const board = new THREE.Group(); board.position.set(0, 2.95, -2.6); S.scene.add(board);
board.add(mesh(new RoundedBoxGeometry(3.9, 1.95, 0.12, 4, 0.1), toon(0x2a2420), 0.03));
const title = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 0.4), new THREE.MeshBasicMaterial({ map: textTexture("", { w: 1024, h: 136, font: "900 84px 'Bricolage Grotesque'", color: "#ff7a52", bg: null, lines: ["NEXT MONTH"] }), transparent: true }));
title.position.set(-0.3, 0.68, 0.07); board.add(title);
const tiles = [];
for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) {
  const mat = toon(0x4a423c);
  const tile = mesh(new RoundedBoxGeometry(0.78, 0.5, 0.08, 3, 0.07), mat, 0.02);
  tile.position.set(-1.29 + c * 0.86, 0.12 - r * 0.62, 0.08); board.add(tile);
  const lock = new THREE.Group(); lock.position.set(tile.position.x, tile.position.y, 0.16); board.add(lock);
  lock.add(mesh(new RoundedBoxGeometry(0.2, 0.16, 0.06, 2, 0.04), flat(0xffffff), 0.012));
  const arc = mesh(new THREE.TorusGeometry(0.065, 0.02, 8, 16, Math.PI), flat(0xffffff), 0.01); arc.position.y = 0.08; lock.add(arc);
  lock.visible = false; tiles.push({ mat, lock, pos: tile.position });
}
const tileWorld = (i) => board.localToWorld(tiles[i].pos.clone().setZ(0.2));
const clock = makeClock(); clock.position.set(1.5, 0.68, 0.12); clock.scale.setScalar(0.38); board.add(clock);

const A = makeArtist(); A.root.position.set(-1.35, 0, 0.1); S.scene.add(A.root);
const sign = makeFlipSign(["BOOKS", "CLOSED"], ["BOOKS", "OPEN!"], { w: 1.3, h: 0.8, back: { bg: "#ff5c39", color: "#ffffff" } }); S.scene.add(sign);
const L = makeLockie(); L.root.position.set(0.35, 0, 0.5); S.scene.add(L.root);
const bell = makeBell(); S.scene.add(bell);
const jar = makeJar("DEPOSITS"); jar.position.set(-0.5, 0, 1.2); jar.scale.setScalar(0.85); S.scene.add(jar);
const dust = [0, 1, 2].map((i) => { const p = makePoof(12, 20 + i); p.scale.setScalar(1.6); S.scene.add(p); return p; });
const confetti = makeConfetti(90, 3); S.scene.add(confetti);
// The waitlist, in a polite line: [arrive time, tile].
const WAIT = [[6.4, 0], [7.1, 5], [7.8, 2], [8.5, 7], [9.2, 1], [9.9, 4], [10.6, 3], [11.3, 6]];
const COLS = [0, 2, 1, 3, 4, 5, 0, 2].map((i) => BLOB_COLORS[i]);
const blobs = WAIT.map((w, i) => { const b = makeBlob(COLS[i], 0.8); S.scene.add(b.root); return b; });
const coins = WAIT.map(() => { const c = makeCoin(); c.scale.setScalar(0.7); S.scene.add(c); return c; });

const bub = bubbles([
  { t0: 2.5, t1: 4.9, text: "ME ME ME!!", anchor: () => V(1.7, 2.1, 0.5), align: 0.9, tail: "85%", rot: 4 },
  { t0: 3.0, t1: 4.9, text: "HIII 👋 BOOK ME", cls: "accent", anchor: () => V(1.6, 1.3, 0.8), align: 0.9, tail: "85%", rot: -3 },
  { t0: 3.5, t1: 4.9, text: "i was here first 😤", cls: "dark", anchor: () => V(1.7, 0.6, 1.0), align: 0.9, tail: "85%", rot: 2 },
  { t0: 5.0, t1: 5.9, sfx: true, text: "DING DING!", anchor: () => V(0.6, 2.45, 0.6), rot: -6 },
  { t0: 8.3, t1: 12.0, text: "z z z", cls: "dark", anchor: () => V(-1.35, 2.35, 0.1), align: 0.3, tail: "30%" },
  { t0: 13.0, t1: 14.6, text: "wait… ALL booked?? 🥹", anchor: () => V(-1.35, 2.45, 0.1), align: 0.25, tail: "25%" },
  { t0: 14.7, t1: 15.5, sfx: true, text: "CLICK!", anchor: () => V(0.35, 2.1, 0.6), rot: 6 },
]);

window.DUR = 21.6;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.3, html: "POV: you open your books at <em>midnight</em> 🌙" },
    { t0: 2.3, t1: 5.0, html: "…and brace for the <em>stampede</em> 😬" },
    { t0: 5.0, t1: 6.3, html: "Lockie: <em>single file, please.</em>" },
    { t0: 6.3, t1: 12.2, html: "Your waitlist books. <em>Deposits go straight to you.</em>" },
    { t0: 12.2, t1: 15.6, html: "Wake up. Tap confirm. <em>Fully booked.</em>" },
    { t0: 15.6, t1: 18.4, html: "Slept through it. <em>Still booked.</em> 😴" },
  ]);
  const rumble = t > 2.3 && t < 5.0 ? Math.sin(t * 55) * 0.05 * (1 - prog(t, 4.7, 5.0)) : 0;
  S.aim(V(rumble, 2.6 + rumble, 13), V(0, 1.95, 0));
  clock.userData.setTime(keys(t, [[0, 0], [6.3, 5], [12.2, 7 * 60]]));

  // The sign flips from CLOSED to OPEN.
  sign.position.set(-0.55, 0.65, 0.6); sign.scale.setScalar(0.6);
  sign.rotation.y = E.back(prog(t, 1.2, 1.7)) * Math.PI; sign.rotation.z = Math.sin(t * 3) * 0.02;

  // Dust clouds on the right while the crowd thunders in, gone when the bell rings.
  dust.forEach((d, i) => { d.position.set(2.0 - i * 0.15, 0.6 + i * 0.5, 0.2 - i * 0.3); d.userData.at(t > 2.3 && t < 5.0 ? 0.25 + ((t * 0.9 + i * 0.33) % 1) * 0.5 : 1); });

  // The artist: proud, panics, falls asleep, wakes up fully booked.
  const asleep = t > 7.6 && t < 12.6;
  const flip = E.back(prog(t, 1.1, 1.4)) * (1 - prog(t, 1.7, 2.0));
  const cheer = E.back(prog(t, 15.6, 15.9)) * (1 - prog(t, 18.1, 18.4));
  const tap = t > 14.5 && t < 14.9 ? Math.sin(prog(t, 14.5, 14.9) * Math.PI) : 0;
  A.pose({ blink: asleep ? 1 : blinkAt(t, 0.6), mouth: t > 2.3 && t < 5.0 ? "o" : asleep ? "flat" : "smile", lookX: t > 2.3 && t < 5.0 ? 0.9 : 0.4,
    slump: asleep ? 1 : 0, headTilt: asleep ? 0.3 + Math.sin(t * 1.5) * 0.04 : t > 2.3 && t < 5.0 ? Math.sin(t * 20) * 0.05 : 0, headNod: asleep ? 0.25 : 0,
    armR: 0.15 + flip * 1.3 + cheer * 2.4 + tap * 1.0, armL: 0.15 + cheer * 2.4, squash: t > 2.3 && t < 5.0 ? 0.08 : 0 });

  // Lockie rings the bell, then waves each client through.
  const ring = E.back(prog(t, 4.8, 5.1)) * (1 - E.inOut(prog(t, 6.0, 6.4)));
  const dance = prog(t, 15.6, 15.8) * (1 - prog(t, 18.2, 18.4));
  const click = t > 14.7 ? Math.exp(-(t - 14.7) * 7) : 0;
  const wave = t > 6.3 && t < 12 ? Math.max(0, Math.sin(t * 9)) * 0.5 : 0;
  L.root.position.y = dance * Math.abs(Math.sin(t * 9)) * 0.22;
  L.pose({ squash: click * 0.5 + Math.sin(t * 6) * 0.03, open: t < 14.7 ? 1 : 1 - E.out(prog(t, 14.7, 14.85)),
    armR: 0.25 + ring * 2.2 + dance * 2, armL: 0.25 + wave + dance * 2, blink: blinkAt(t, 1.1), lookX: t > 6.3 && t < 12.2 ? 0.8 : -0.2,
    tilt: dance * Math.sin(t * 9) * 0.15, mouth: t > 5.0 && t < 5.9 ? "o" : "smile" });
  bell.visible = ring > 0.01;
  bell.position.set(1.1, 1.35 + ring * 0.2, 0.7); bell.scale.setScalar(0.8 * ring); bell.rotation.z = -0.4 + (t > 5 && t < 6 ? Math.sin(t * 40) * 0.5 : 0);

  // The waitlist: hop in, coin into the jar, hop onto a calendar tile.
  let inJar = 0;
  WAIT.forEach(([at, tile], i) => {
    const b = blobs[i], c = coins[i];
    const inK = E.out(prog(t, at - 0.35, at));
    const goK = prog(t, at + 0.45, at + 1.05);
    const tp = tileWorld(tile);
    let x = lerp(3.2, 1.4, inK), y = 0, z = 0.9, sc = 0.8;
    if (goK > 0) { const k = E.inOut(goK); x = lerp(1.4, tp.x, k); y = lerp(0, tp.y - 0.3, k) + Math.sin(k * Math.PI) * 0.8; z = lerp(0.9, tp.z, k); sc = 0.8 * (1 - k); }
    b.root.visible = t > at - 0.35 && goK < 1;
    b.root.position.set(x, y + (inK < 1 ? Math.abs(Math.sin(t * 11)) * 0.15 : 0), z); b.root.scale.setScalar(Math.max(0.01, sc));
    b.pose({ blink: blinkAt(t, i * 0.4), lookX: -0.7, armL: t > at && t < at + 0.35 ? 1.5 : 0.3 });
    const ck = prog(t, at, at + 0.4);
    c.visible = ck > 0 && ck < 1;
    c.position.set(lerp(1.25, -0.5, ck), lerp(1.0, 0.95, ck) + Math.sin(ck * Math.PI) * 1.2, lerp(0.9, 1.2, ck)); c.rotation.y = ck * 16;
    if (t >= at + 0.4) inJar++;
    const lit = E.back(prog(t, at + 1.0, at + 1.25));
    tiles[tile].mat.color.setHex(0x4a423c).lerp(new THREE.Color(0xff5c39), clamp(lit));
    const locked = E.back(prog(t, 14.7 + i * 0.05, 14.95 + i * 0.05));
    tiles[tile].lock.visible = locked > 0.01; tiles[tile].lock.scale.setScalar(Math.max(0.01, clamp(locked)));
  });
  jar.userData.fill(inJar);

  confetti.position.set(0, 2.3, 0.4); confetti.userData.at(t - 15.6);
  showBubbles(t, bub, S.toScreen);
  outro(t, 18.4, { h: "Books open.<br>Chaos closed.", p: "Booking + deposits for tattoo artists.<br>Free for founding artists." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
