<!doctype html><html data-look="blush"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
<style>
  /* Blush palette for beauty episodes. */
  body { background: #fff5f7; color: #3d1f2c; }
  .glow { background: radial-gradient(60% 38% at 82% 8%, rgba(255,150,190,.55), transparent 70%), radial-gradient(55% 35% at 0% 100%, rgba(255,200,220,.6), transparent 70%); }
  #cap { font: 700 84px/1.04 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  em { color: #d63a70; font-style: italic; }
  #foot { color: #a57f8f; }
  .bub { box-shadow: 0 16px 40px -14px rgba(170,60,105,.5); border: 3px solid #f6cfdc; }
  .bub::after { border-right: 3px solid #f6cfdc; border-bottom: 3px solid #f6cfdc; }
  .bub.accent { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; border-color: transparent; } .bub.accent::after { background: #e24f86; border-color: transparent; }
  .bub.dark { background: #3d1f2c; color: #fff5f7; border-color: #3d1f2c; } .bub.dark::after { background: #3d1f2c; border-color: #3d1f2c; }
  .sfx { color: #fff; -webkit-text-stroke: 4px #7a1d45; }
  #outro { background: radial-gradient(60% 40% at 50% 30%, rgba(255,150,190,.55), transparent 70%), #fff5f7; }
  #outro h2 { font: italic 700 100px/1.02 "Fraunces", Georgia, serif; letter-spacing: -.03em; color: #3d1f2c; }
  #outro p { color: #6e4b5b; }
  #outro .cta { background: linear-gradient(180deg, #f58ab2, #e0457f); color: #fff; }
  #outro .wordmark, #foot .wordmark { color: #3d1f2c; }
</style>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, mesh, toon, flat, makeLockie, makeTech, makeNailTable, makeBlob, makeCoin, makeSign, makeClock, makeJar, makePhone, makeLabel, makeConfetti, makePoof, blinkAt } from "/kit.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
await document.fonts.load("600 40px 'Fraunces'"); await document.fonts.load("italic 600 40px 'Fraunces'");
const S = setup({ camPos: [0, 2.3, 10.5], look: [0, 1.75, 0], palette: "blush" });
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const T = makeTech({ skin: 0xc68a64, hair: 0x3a2219, smock: 0xff9ec0 }); T.root.position.set(-0.7, 0, -0.35); S.scene.add(T.root);
const table = makeNailTable(); table.position.set(0, 0, 0.35); S.scene.add(table);
const jar = makeJar("DEPOSITS"); jar.position.set(0.05, 0.95, 0.6); jar.scale.setScalar(0.9); jar.userData.fill(2); S.scene.add(jar);
const L = makeLockie({ color: 0xff7aa8, feet: 0xe0457f, key: 0x7a1d45 }); L.root.scale.setScalar(0.62); S.scene.add(L.root);
const client = makeBlob(0x8fc1ff, 0.8); S.scene.add(client.root);
const coin = makeCoin(); coin.scale.setScalar(0.6); S.scene.add(coin);
const poof = makePoof(14, 81); S.scene.add(poof);
const confetti = makeConfetti(90, 83); S.scene.add(confetti);
const PINKS = [0xe0457f, 0xff8fb1, 0xffffff, 0xd7a6ff, 0xffc4d8, 0xf3c6b0];
confetti.children.forEach((m, i) => { m.material = flat(PINKS[i % PINKS.length], { side: THREE.DoubleSide }); });
// The ancient screenshot, and the live page.
const shot = makeSign(["PRICES · 2019", "FULL SET $25"], { w: 1.6, h: 0.95, bg: "#e9d9b8", color: "#7a5a3a" }); S.scene.add(shot);
const stamp = makeLabel(["OUTDATED"], { w: 0.95, h: 0.3, bg: "#e0457f", color: "#ffffff" }); stamp.rotation.z = -0.22; stamp.position.set(0, 0.55, 0.06); shot.add(stamp);
const live = makeSign(["FULL SET $65", "PRICES TODAY"], { w: 1.6, h: 0.95, bg: "#ffffff", color: "#e0457f" }); S.scene.add(live);
const phone = makePhone([{ lines: ["FULL SET", "$65"] }, { lines: ["$20", "DEPOSIT"] }, { lines: ["BOOKED", "✓"], bg: "#fff0f5", color: "#e0457f" }]); S.scene.add(phone);

const bub = bubbles([
  { t0: 0.8, t1: 2.5, text: "full set is $25 right? 🥺📸", anchor: () => V(0.85, 1.9, 1.2), align: 0.75, tail: "75%" },
  { t0: 2.6, t1: 4.8, text: "babe that's from 2019 😭", cls: "dark", anchor: () => V(-0.7, 2.3, -0.35), align: 0.25, tail: "25%" },
  { t0: 5.0, t1: 5.7, sfx: true, text: "POOF!", anchor: () => V(0.72, 1.9, 0.6), rot: 8 },
  { t0: 7.0, t1: 7.8, sfx: true, text: "STAMP!", anchor: () => V(0.72, 2.0, 1.5), rot: -8 },
  { t0: 8.0, t1: 9.0, text: "ok fair 😂", anchor: () => V(0.85, 1.2, 1.0), align: 0.75, tail: "75%" },
  { t0: 11.1, t1: 11.9, sfx: true, text: "CLINK!", anchor: () => V(0.05, 1.85, 0.9), rot: -6 },
  { t0: 12.2, t1: 14.2, text: "worth every cent 💅", anchor: () => V(0.85, 1.2, 1.0), align: 0.75, tail: "75%" },
]);

window.DUR = 18.8;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 2.5, html: "“Full set is <em>$25,</em> right?” 📸" },
    { t0: 2.5, t1: 5.0, html: "The screenshot is <em>from 2019.</em>" },
    { t0: 5.2, t1: 8.8, html: "Your page shows <em>today's prices.</em>" },
    { t0: 8.8, t1: 12.2, html: "They book at the real price. <em>Deposit in.</em>" },
    { t0: 12.2, t1: 15.6, html: "No haggling. <em>No 2019.</em>" },
  ]);
  S.aim(V(0, 2.3, 10.5), V(0, 1.75, 0));

  // The client with the old screenshot.
  const cin = E.out(prog(t, 0.1, 0.6));
  const dance = prog(t, 12.2, 12.4) * (1 - prog(t, 15.4, 15.6));
  client.root.position.set(lerp(3.2, 0.85, cin), (cin < 1 ? Math.abs(Math.sin(t * 11)) * 0.14 : 0) + dance * Math.abs(Math.sin(t * 9)) * 0.16, 1.0);
  const holding = t > 0.5 && t < 8.0;
  const tapping = t > 9.4 && t < 10.9;
  client.pose({ blink: blinkAt(t, 2.3), lookX: -0.6, mouth: t > 7.0 && t < 8.0 ? "o" : "smile", armR: 0.3 + (holding ? 1.3 : 0) + dance * 1.5, armL: 0.3 + (tapping ? 1.1 + Math.abs(Math.sin(t * 20)) * 0.2 : 0) + dance * 1.5 });
  const sk = E.back(prog(t, 0.5, 0.85)) * (1 - E.inOut(prog(t, 7.9, 8.2)));
  shot.visible = sk > 0.01; shot.position.set(0.72, 1.05, 1.5); shot.scale.setScalar(0.5 * sk); shot.rotation.z = 0.06 + Math.sin(t * 2.5) * 0.03;
  stamp.visible = t > 7.0; stamp.scale.setScalar(t > 7.0 ? 1 + 0.6 * Math.exp(-(t - 7.0) * 12) : 1);
  const pk = E.out(prog(t, 9.1, 9.4)) * (1 - prog(t, 11.0, 11.3));
  phone.visible = pk > 0.01; phone.position.set(0.85, 1.75, 1.3); phone.scale.setScalar(1.05 * pk); phone.rotation.set(-0.1, -0.25, 0);
  phone.userData.show(t < 9.9 ? 0 : t < 10.5 ? 1 : 2);
  const ck = prog(t, 10.6, 11.1);
  coin.visible = ck > 0 && ck < 1;
  coin.position.set(lerp(0.8, 0.05, ck), lerp(1.0, 1.35, ck) + Math.sin(ck * Math.PI) * 0.9, lerp(1.0, 0.55, ck)); coin.rotation.y = ck * 16;
  jar.userData.fill(t < 11.1 ? 2 : 3);
  const bounce = t > 11.1 ? Math.exp(-(t - 11.1) * 6) * Math.abs(Math.sin((t - 11.1) * 16)) : 0;
  jar.position.y = 0.95 + bounce * 0.15;

  // The tech: bracing, then happy.
  const brace = t > 1.0 && t < 5.2;
  const cheer = E.back(prog(t, 12.3, 12.6)) * (1 - prog(t, 15.3, 15.6));
  T.pose({ blink: blinkAt(t, 0.8), lookX: 0.5, lookY: brace ? 0.1 : 0, mouth: brace ? "o" : "smile", sweat: t > 2.6 && t < 5.2, headTilt: brace ? 0.1 : 0,
    armL: 0.1 + cheer * 2.5, armLx: cheer > 0.1 ? 0 : -0.9, armR: 0.1 + cheer * 2.5, armRx: cheer > 0.1 ? 0 : -0.9 });

  // Pink Lockie with the live page, and the stamp.
  const drop = prog(t, 4.8, 5.15);
  L.root.visible = t > 4.8;
  const landK = t > 5.15 ? Math.exp(-(t - 5.15) * 6) * Math.cos((t - 5.15) * 18) : 0;
  const signUp = E.back(prog(t, 5.4, 5.75)) * (1 - E.inOut(prog(t, 8.6, 8.9)));
  const stampArm = E.back(prog(t, 6.8, 7.0)) * (1 - prog(t, 7.3, 7.6));
  L.root.position.set(0.72, 0.95 + (1 - E.out(drop)) * 3.5 + dance * Math.abs(Math.sin(t * 9)) * 0.2, 0.45);
  L.pose({ squash: landK * 0.7 + stampArm * 0.2, open: 0, armL: 0.25 + signUp * 1.3 + dance * 2, armR: 0.25 + stampArm * 1.6 + dance * 2, blink: blinkAt(t, 1.4), lookX: 0.4, tilt: dance * Math.sin(t * 9) * 0.15 });
  poof.position.set(0.72, 1.4, 0.7); poof.userData.at(prog(t, 4.9, 5.7));
  live.visible = signUp > 0.01;
  live.position.set(0.3, 1.6, 0.8); live.scale.setScalar(0.45 * signUp); live.rotation.z = 0.06 + Math.sin(t * 3) * 0.03;

  confetti.position.set(0, 1.4, 0.6); confetti.userData.at(t - 12.3);
  showBubbles(t, bub, S.toScreen);
  outro(t, 15.6, { h: "Prices from 2019?<br>Not on your page.", p: "Booking + deposits for nail techs,<br>lash artists & beauty pros." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
