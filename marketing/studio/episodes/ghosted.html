<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lib.css"><link rel="stylesheet" href="/ui.css"><script src="/lib.js"></script>
<script type="importmap">{ "imports": { "three": "/three.js", "three/addons/": "/addons/" } }</script>
</head><body><div id="gl"></div><div id="bubbles"></div>
<script type="module">
import { THREE, setup, makeLockie, makeGhost, makeArtist, makeBlob, makeChair, makeClock, makeSign, makeCoin, makeTumbleweed, makeConfetti, makePoof, blinkAt, BLOB_COLORS } from "/kit.js";
import { bubbles, showBubbles } from "/ui.js";
base();
await document.fonts.load("900 40px 'Bricolage Grotesque'"); await document.fonts.load("700 40px 'Inter'");
const S = setup({ camPos: [0, 2.6, 13], look: [0, 1.95, 0] });
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const A = makeArtist(), G = makeGhost(), L = makeLockie(), B = makeBlob(BLOB_COLORS[0], 0.85);
const chair = makeChair(); chair.position.set(0.1, 0, -2.2); chair.rotation.y = -0.25;
const clock = makeClock(); clock.position.set(1.15, 3.75, -2.2);
const sign = makeSign(["DEPOSIT", "FIRST"]);
const coin = makeCoin(), tumble = makeTumbleweed(), confetti = makeConfetti(), poof = makePoof(12, 5), dust = makePoof(8, 9);
[A, G, L, B].forEach((c) => S.scene.add(c.root));
S.scene.add(chair, clock, sign, coin, tumble, confetti, poof, dust);

const bub = bubbles([
  { t0: 2.7, t1: 4.7, text: "omg can't wait!! see u at 2 🥹", anchor: () => G.root.position.clone().add(V(0, 2.05, 0)), align: 0.75, tail: "75%" },
  { t0: 8.5, t1: 10.3, text: "…cool cool cool", cls: "dark", anchor: () => V(A.root.position.x, 2.5, 0), align: 0.3, tail: "30%" },
  { t0: 12.5, t1: 14.1, text: "hiii can i book saturday? 👻", anchor: () => G.root.position.clone().add(V(0, 2.05, 0)), align: 0.8, tail: "80%" },
  { t0: 14.4, t1: 15.6, text: "…i'll get back to u", anchor: () => G.root.position.clone().add(V(0, 2.05, 0)), align: 0.8, tail: "80%" },
  { t0: 16.5, t1: 17.7, text: "deposit sent ✅", cls: "accent", anchor: () => B.root.position.clone().add(V(0, 1.25, 0)), align: 0.75, tail: "75%" },
  { t0: 6.45, t1: 7.4, sfx: true, text: "POOF!", anchor: () => V(1.2, 1.5, 0), rot: -8 },
  { t0: 10.85, t1: 11.6, sfx: true, text: "THUD", anchor: () => V(1.25, 0.1, 0.6), rot: 6 },
  { t0: 17.65, t1: 18.6, sfx: true, text: "CLICK!", anchor: () => V(0.05, 2.45, 0.6), rot: -6 },
]);

window.DUR = 22.5;
window.render = (t) => {
  captions(t, [
    { t0: 0, t1: 4.8, html: "Client booked for 2pm. <em>No deposit.</em>" },
    { t0: 4.8, t1: 7.3, html: "2:00pm…" },
    { t0: 7.3, t1: 10.4, html: "Ghosted. <em>Again.</em>" },
    { t0: 10.4, t1: 12.2, html: "Enter <em>Lockie.</em>" },
    { t0: 12.2, t1: 16.2, html: "No deposit, <em>no slot.</em>" },
    { t0: 16.2, t1: 19.2, html: "Real clients pay. <em>Slot locked.</em>" },
  ]);

  // Camera: comedic push-in on the sad artist, then back out.
  const push = E.inOut(prog(t, 7.6, 8.6)) * (1 - E.inOut(prog(t, 10.2, 10.9)));
  S.aim(V(lerp(0, -0.8, push), lerp(2.6, 2.2, push), lerp(13, 9.5, push)), V(lerp(0, -0.8, push), lerp(1.95, 1.8, push), 0));

  // Clock: 1:55 → 2:00 fast at 4.8, then drifts to 2:40 while waiting.
  const minutes = 115 + keys(t, [[0, 0], [4.8, 3], [5.6, 5], [7.3, 5], [10.4, 45]], E.inOut);
  clock.userData.setTime(minutes);

  // Artist: happy bounce, then deflates; cheers at the end.
  const happy = t < 7.3 || t > 17.6;
  const cheer = E.back(prog(t, 17.7, 18.1)) * (1 - prog(t, 19.0, 19.2));
  const hop = happy ? Math.abs(Math.sin(t * 5.5)) * (t < 7.3 ? 0.06 : 0.25) : 0;
  A.root.position.set(-1.1 - E.inOut(prog(t, 10.4, 11.2)) * 0.25, hop, 0);
  const slump = E.inOut(prog(t, 8.2, 8.8)) * (1 - E.inOut(prog(t, 10.6, 11.0)));
  A.pose({
    blink: blinkAt(t, 0.4), lookX: t < 10.4 ? 0.7 : 0.6, lookY: t > 4.8 && t < 6.4 ? 0.8 : 0,
    mouth: slump > 0.3 ? "frown" : t > 10.5 && t < 11.3 ? "o" : "smile",
    slump, headNod: slump * 0.25, headTilt: slump * 0.12, squash: slump * 0.25 - (hop > 0.1 ? 0.1 : 0),
    armL: 0.15 + cheer * 2.4, armR: 0.15 + cheer * 2.4 + (t < 4.8 ? Math.max(0, Math.sin(t * 8)) * 0.3 : 0),
  });

  // Ghost #1: floats in, notices the time, poofs.
  let gx = 3.4, gOp = 0, gScale = 1, gTilt = 0, gSweat = false, gMouth = "smile";
  if (t < 7.2) {
    gx = lerp(3.4, 1.25, E.out(prog(t, 1.8, 3.2)));
    const vanish = prog(t, 6.3, 6.9);
    gOp = 1 - vanish; gScale = 1 - vanish * 0.7; gTilt = vanish * 3;
    if (t > 4.9) gMouth = "o";
  } else if (t > 12.1 && t < 16.4) {
    // Ghost #2: tries to book, meets the sign, flees.
    gx = lerp(3.4, 1.5, E.out(prog(t, 12.1, 12.8))) + E.inOut(prog(t, 15.5, 16.1)) * 2.4;
    gOp = 1; gSweat = t > 14.2; gMouth = t > 14.0 ? "o" : "smile";
    if (t > 14.2 && t < 15.5) gx += Math.sin(t * 60) * 0.03;
    gTilt = -E.inOut(prog(t, 15.5, 15.8)) * 0.3;
  }
  G.root.position.set(gx, 0, 0.1);
  G.root.visible = gOp > 0.01;
  G.pose({ opacity: gOp, scale: gScale, tilt: gTilt, float: Math.sin(t * 2.4) * 0.08, waveR: t < 4.7 ? Math.max(0, Math.sin(t * 9)) * 0.25 : 0,
    blink: blinkAt(t, 1.3), lookX: t > 4.9 && t < 6.3 ? -0.4 : -0.6, lookY: t > 4.9 && t < 6.3 ? 0.9 : 0, mouth: gMouth, sweat: gSweat }, t);
  poof.position.set(1.25, 0.9, 0.1); poof.userData.at(prog(t, 6.35, 7.2));

  // Tumbleweed rolls through the awkward silence.
  const tw = prog(t, 7.6, 10.2);
  tumble.visible = tw > 0 && tw < 1;
  tumble.position.set(lerp(3.2, -3.4, tw), 0.35 + Math.abs(Math.sin(tw * 14)) * 0.35, 1.6);
  tumble.rotation.z = tw * 14;

  // Lockie drops in, lands with a squash, shackle open until the deposit lands.
  const fall = prog(t, 10.4, 10.9);
  const ly = t < 10.4 ? 12 : lerp(9, 0, E.inOut(fall) * fall);
  const land = t > 10.9 ? Math.exp(-(t - 10.9) * 6) * Math.cos((t - 10.9) * 18) : 0;
  L.root.visible = t > 10.4;
  L.root.position.set(0.05, Math.max(0, ly), 0.6);
  const catchK = prog(t, 17.55, 17.7);
  const lockHop = t > 17.7 ? Math.abs(Math.sin((t - 17.7) * 7)) * 0.3 * Math.exp(-(t - 17.7) * 1.5) : 0;
  L.root.position.y += lockHop;
  const signUp = E.back(prog(t, 13.6, 14.0)) * (1 - E.inOut(prog(t, 15.8, 16.2)));
  L.pose({
    squash: t < 10.9 ? -0.3 * fall : land * 0.8, open: 1 - E.out(catchK),
    blink: t > 13.9 && t < 15.8 ? 0.45 : blinkAt(t, 2.1), lookX: t > 12.3 && t < 16.2 ? 0.8 : t > 16.2 ? 0.6 : 0,
    armR: 0.25 + signUp * 1.1, armL: 0.25 + (t > 17.2 && t < 17.8 ? 1.4 : 0) + E.back(prog(t, 17.7, 18.0)) * 1.2 * (1 - prog(t, 19, 19.2)),
    mouth: t > 13.9 && t < 15.8 ? "flat" : "smile",
  });
  dust.position.set(0.05, 0.05, 0.3); dust.scale.setScalar(0.5); dust.userData.at(prog(t, 10.88, 11.5));
  sign.visible = signUp > 0.01;
  sign.position.set(0.8, 0.95, 0.95); sign.scale.setScalar(0.62 * signUp); sign.rotation.z = -0.1 + Math.sin(t * 3) * 0.03;

  // Blob client with a real deposit.
  const bIn = E.out(prog(t, 16.2, 16.8));
  B.root.visible = t > 16.2;
  B.root.position.set(lerp(3.2, 1.4, bIn), Math.abs(Math.sin(t * 9)) * 0.12 * (1 - prog(t, 16.6, 16.9)) + (t > 17.7 ? Math.abs(Math.sin(t * 7)) * 0.15 : 0), 0.3);
  B.pose({ blink: blinkAt(t, 0.9), lookX: -0.7, armL: 0.3 + (t > 16.9 && t < 17.3 ? 1.6 : 0), mouth: "smile" });
  const ct = prog(t, 17.0, 17.6);
  coin.visible = ct > 0 && ct < 1;
  coin.position.set(lerp(1.2, 0.05, ct), lerp(1.0, 2.05, ct) + Math.sin(ct * Math.PI) * 1.2, lerp(0.35, 0.6, ct));
  coin.rotation.y = ct * 16;
  confetti.position.set(0.05, 1.9, 0.6); confetti.userData.at(t - 17.7);

  showBubbles(t, bub, S.toScreen);
  outro(t, 19.2, { h: "Ghost-proof<br>your books.", p: "Booking + deposits for tattoo artists.<br>Free for founding artists." });
  S.frame();
};
render(0);
window.READY = true;
</script></body></html>
